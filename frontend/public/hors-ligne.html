<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>rafals — pas de connexion</title>
    <style>
      /* Page montrée par l'application installée quand il n'y a pas de réseau (RM-APPLICATION.md).
         Elle ne charge rien d'autre : ses couleurs sont celles de la charte, recopiées ici. */
      :root { --fond: #f3f6f2; --texte: #1d2620; --doux: #58665c; --primaire: #2f6b4f; --primaire-texte: #ffffff; --accent: #d9793a; }
      @media (prefers-color-scheme: dark) {
        :root { --fond: #121713; --texte: #e7ecf2; --doux: #a3aebd; --primaire: #79c49c; --primaire-texte: #0f1a13; --accent: #f0955a; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--fond); color: var(--texte); font: 17px/1.5 system-ui, sans-serif; text-align: center; }
      main { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 34ch; }
      .logo { font-size: 34px; font-weight: 800; color: var(--primaire); letter-spacing: -0.5px; }
      .logo span { color: var(--accent); }
      h1 { margin: 0; font-size: 22px; line-height: 1.25; }
      p { margin: 0; color: var(--doux); }
      button { min-height: 44px; padding: 10px 22px; border: 0; border-radius: 999px; background: var(--primaire); color: var(--primaire-texte); font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">rafals<span>.</span></div>
      <h1>Pas de connexion : rafals a besoin d'Internet.</h1>
      <p>Vérifiez le Wi-Fi ou les données mobiles de votre appareil, puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
