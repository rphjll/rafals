<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Application à installer (RM-APPLICATION.md) : icône, nom, couleur de la barre du téléphone -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f6b4f" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/icone-apple-180.png" />
    <meta name="apple-mobile-web-app-title" content="rafals" />
    <title>rafals</title>
    <script>
      // Thème choisi dans « Paramètres » (composables/useTheme.ts), posé avant l'affichage pour éviter un éclair blanc.
      // Même clé et même règle que useTheme.ts : rien de gardé = comme l'appareil.
      var choix = null
      try {
        choix = localStorage.getItem('rafals-theme') // peut être refusé (navigation privée) : on suit alors l'appareil
      } catch (e) {}
      var sombre = choix === 'sombre' || (choix !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('sombre', sombre)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
