# rafals - les boites Docker (developpement sur le PC)
# Ports cote PC : base 5433, serveur 8001, ecrans 5174 (voir CLAUDE.md)

services:
  db:
    image: postgres:18
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - rafals_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # IA de moderation des avis (Detoxify, libre et gratuite) : lit un avis, dit s'il est injurieux.
  # Aucune porte ouverte sur le PC : seul le serveur de rafals lui parle. Image d'environ 2 Go (modele inclus).
  moderation:
    build: ./moderation

  # Attrape tous les mails envoyes par rafals sur le PC (rien ne part pour de vrai).
  # Page des mails : http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # Le "placard" a fichiers (compatible S3) : accords des parents, photos, factures.
  # Aucune porte ouverte sur le PC : seul le serveur de rafals lui parle.
  # A preparer une seule fois par PC avec preparer-stockage.bat
  garage:
    image: dxflrs/garage:v2.3.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - rafals_garage_meta:/var/lib/garage/meta
      - rafals_garage_data:/var/lib/garage/data

volumes:
  rafals_db_data:
  rafals_garage_meta:
  rafals_garage_data:
