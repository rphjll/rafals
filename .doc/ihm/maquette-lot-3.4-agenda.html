<title>Maquette rafals agenda</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
.menu{display:flex;gap:14px;font-size:14px;color:var(--doux);flex-wrap:wrap} .menu b{color:var(--prim)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.champ{display:flex;flex-direction:column;gap:6px} .champ label,.leg{font-weight:600;font-size:13px} .champ label i,.leg i{color:var(--err);font-style:normal}
input,select{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:520px){.deux{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:34px;padding:5px 10px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-ok{background:var(--ok-doux);color:var(--ok)} .b-att{background:var(--att-doux);color:var(--att)} .b-neu{background:var(--neu-doux);color:var(--neu)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13.5px;color:var(--doux);margin:0}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-err{background:var(--err-doux);color:var(--err)}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.jour{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:start;border-top:1px solid var(--bord);padding-top:12px}
.jour:first-of-type{border-top:0;padding-top:0}
.plages{display:flex;flex-direction:column;gap:8px}
.plage{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .plage input{width:110px}
.x{border:0;background:var(--err-doux);color:var(--err);border-radius:999px;width:30px;height:30px;font-weight:700;cursor:pointer}
.mois{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mois .t{font-size:12px;color:var(--doux);text-align:center;font-weight:600;padding-bottom:4px}
.case{min-height:58px;border-radius:8px;border:1px solid var(--bord);padding:5px;font-size:13px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface);color:var(--texte);font:inherit;text-align:left}
.case b{font-size:14px}
.ouvert{background:var(--ok-doux)} .ferme{background:var(--neu-doux);color:var(--doux)} .bloque{background:repeating-linear-gradient(135deg,var(--att-doux) 0 6px,var(--surface) 6px 12px);border-color:var(--att)}
.case.choisi{outline:3px solid var(--prim)}
.marque{font-size:11px;font-weight:700;color:var(--att)} .fin{font-size:11px;font-weight:700;color:var(--err)}
.vide{visibility:hidden}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--doux)} .legende span{display:inline-flex;gap:6px;align-items:center} .legende i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--bord)}
.puces{display:flex;gap:8px;flex-wrap:wrap} .puce{border:1px solid var(--prim);color:var(--prim);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.ligne{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--bord);padding-top:10px}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.coche{display:flex;gap:10px;align-items:center;min-height:42px} .coche input{width:20px;min-height:20px;accent-color:var(--prim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
.choix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} @media (max-width:520px){.choix{grid-template-columns:1fr}}
.choix button{font:inherit;border:1px solid var(--bord);background:var(--fond);color:var(--texte);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:42px}
.choix button[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);color:var(--prim);font-weight:600}
</style>

<div class="bandeau"><b>Maquette lot 3.4</b> · écrans :
  <button class="onglet" data-e="calendrier" aria-pressed="true">1. Calendrier</button>
  <button class="onglet" data-e="semaine">2. Semaine type</button>
  <button class="onglet" data-e="reglages">3. Réglages</button>
  <button class="onglet" data-e="apercu">4. Aperçu des horaires libres</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span><nav class="menu"><span>Trouver</span><span>Mon activité</span><span>Mes annonces</span><b>Mon agenda</b><span>Mon compte</span></nav></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const onglets = cle => '<h1>Mon agenda</h1><div class="sous-onglets">' + [['calendrier','Calendrier'],['semaine','Semaine type'],['reglages','Réglages'],['apercu','Horaires libres']].map(([c,t]) => '<button data-e="' + c + '" aria-pressed="' + (c===cle) + '">' + t + '</button>').join('') + '</div>';

// Octobre 2026 : commence un jeudi. Léa : mardi et samedi ouverts ; congés 20-24/10 ; fin de Plombier le 15/10.
function calendrier() {
  let h = '<div class="mois">' + ['lun','mar','mer','jeu','ven','sam','dim'].map(j => '<div class="t">' + j + '</div>').join('');
  for (let i = 0; i < 3; i++) h += '<div class="case vide"></div>';
  for (let d = 1; d <= 31; d++) {
    const js = (d + 2) % 7 + 1; // 1 = lundi
    const bloque = d >= 20 && d <= 24, ouvert = js === 2 || js === 6;
    const cls = bloque ? 'bloque' : ouvert ? 'ouvert' : 'ferme';
    h += '<button class="case ' + cls + (d === 13 ? ' choisi' : '') + '" data-jour="' + d + '"><b>' + d + '</b>' +
      (bloque ? '<span class="marque">bloqué</span>' : ouvert ? '<span>' + (js === 2 ? '9-12 · 14-19' : '9-12') + '</span>' : '<span>fermé</span>') +
      (d === 15 ? '<span class="fin">fin Plombier</span>' : '') + '</button>';
  }
  return h + '</div>';
}
const E = {};
E.calendrier = () => onglets('calendrier') +
  '<div class="carte"><div class="tete"><button class="btn sec petit">‹ Septembre</button><h2>Octobre 2026</h2><button class="btn sec petit">Novembre ›</button></div>' + calendrier() +
  '<div class="legende"><span><i style="background:var(--ok-doux)"></i>ouvert</span><span><i style="background:var(--neu-doux)"></i>fermé</span><span><i style="background:var(--att-doux)"></i>bloqué</span><span><b style="color:var(--err)">fin …</b> date de fin d\'un métier</span></div></div>' +
  '<div class="carte" id="detail"><div class="tete"><h2>Mardi 13 octobre</h2><span class="badge b-ok">ouvert</span></div><p class="note">9 h 00 – 12 h 00 · 14 h 00 – 19 h 00 (semaine type)</p><div class="actions"><button class="btn sec" data-fen="bloquer-jour">Bloquer ce jour</button><button class="btn sec" data-fen="bloquer-heures">Bloquer quelques heures…</button></div></div>' +
  '<div class="carte"><div class="tete"><h2>Périodes bloquées à venir</h2><button class="btn prim" data-fen="bloquer">Bloquer une période…</button></div>' +
    '<div class="ligne"><div><b>Du 20/10 au 24/10/2026</b> <span class="note">· Congés</span></div><button class="btn dan petit" data-toast="Période débloquée : ces jours sont de nouveau réservables.">Débloquer</button></div>' +
    '<div class="ligne"><div><b>Mardi 03/11/2026, de 14 h 00 à 16 h 00</b></div><button class="btn dan petit">Débloquer</button></div>' +
    '<p class="note">Le motif n\'est jamais montré aux clients : ils voient seulement moins d\'horaires.</p></div>' +
  '<div class="carte"><h2>Dates de fin de métier</h2><div class="ligne"><div><b>Plombier</b> : dernier jour le 15/10/2026, ensuite Électricien devient principal.</div><button class="btn sec petit">Changer…</button></div><p class="note">Réglées dans « Mon activité › Mes métiers ».</p></div>';

const plage = (d, f) => '<div class="plage"><input type="time" value="' + d + '"> à <input type="time" value="' + f + '"><button class="x" title="Retirer cette plage">×</button></div>';
const jourS = (nom, plages) => '<div class="jour"><b>' + nom + '</b><div class="plages">' + (plages.length ? plages.join('') : '<span class="note">Fermé</span>') + '<div><button class="btn sec petit" data-toast="Plage ajoutée : choisissez les heures.">+ Ajouter une plage</button></div></div></div>';
E.semaine = () => onglets('semaine') +
  '<div class="carte"><h2>Semaine type</h2><p class="note">Vos horaires de chaque semaine, heure de Paris. Plusieurs plages possibles par jour (ex. une pause déjeuner). Un jour sans plage est fermé.</p>' +
  jourS('Lundi', []) + jourS('Mardi', [plage('09:00','12:00'), plage('14:00','19:00')]) + jourS('Mercredi', [plage('09:00','12:00'), plage('14:00','19:00')]) +
  jourS('Jeudi', [plage('09:00','12:00'), plage('14:00','19:00')]) + jourS('Vendredi', [plage('09:00','12:00'), plage('14:00','19:00')]) + jourS('Samedi', [plage('09:00','12:00')]) + jourS('Dimanche', []) +
  '<div class="alerte a-err" id="err" hidden>Deux plages se chevauchent le mardi : 9 h 00-12 h 00 et 11 h 00-13 h 00.</div>' +
  '<div class="actions"><button class="btn prim" data-toast="Semaine type enregistrée.">Enregistrer la semaine</button><button class="btn sec">Annuler</button><button class="btn sec" style="margin-left:auto" onclick="document.getElementById(\'err\').hidden=false">Voir un refus</button></div>' +
  '<p class="note">Rendez-vous déjà pris hors des nouveaux horaires : vous pourrez choisir de les annuler ou de les garder (quand les rendez-vous existeront).</p></div>';

const choix = (vals, sel) => '<div class="choix">' + vals.map(v => '<button aria-pressed="' + (v === sel) + '">' + v + '</button>').join('') + '</div>';
E.reglages = () => onglets('reglages') +
  '<div class="carte"><h2>Réglages</h2>' +
  '<span class="leg">Heures de début proposées aux clients <i>*</i></span>' + choix(['toutes les 15 min','toutes les 30 min','toutes les heures'], 'toutes les 15 min') +
  '<p class="note">Ex. ouvert à 9 h, coupe de 45 min : 9 h 00, 9 h 15, 9 h 30…</p>' +
  '<div class="deux"><div class="champ"><label>Pause après chaque rendez-vous <i>*</i></label><select><option selected>aucune</option><option>15 min</option><option>30 min</option><option>45 min</option><option>1 h</option><option>1 h 30</option><option>2 h</option><option>3 h</option></select><span class="note">Pour le trajet ou le rangement.</span></div>' +
  '<div class="champ"><label>Réservation au plus tôt <i>*</i></label><select><option>à tout moment</option><option>30 min avant</option><option>1 h avant</option><option selected>2 h avant</option><option>4 h avant</option><option>la veille (24 h)</option><option>2 jours avant</option><option>7 jours avant</option></select></div></div>' +
  '<div class="champ"><label>Réservation au plus tard <i>*</i></label><select><option>1 mois à l\'avance</option><option selected>2 mois à l\'avance</option><option>3 mois</option><option>6 mois</option><option>12 mois</option></select></div>' +
  '<div class="actions"><button class="btn prim" data-toast="Réglages enregistrés.">Enregistrer</button></div></div>';

E.apercu = () => onglets('apercu') +
  '<div class="carte"><h2>Horaires libres</h2><p class="note">Ce que voit un client qui veut réserver (la réservation arrive au niveau 4).</p>' +
  '<div class="deux"><div class="champ"><label>Annonce</label><select><option>Coupe femme — 35 € · 45 min</option><option>Coupe homme — 20 € · 30 min</option></select></div><div class="champ"><label>Jour</label><input type="date" value="2026-10-13"></div></div>' +
  '<p style="margin:0;font-weight:600">Mardi 13 octobre : 20 horaires</p><div class="puces">' + ['9 h 00','9 h 15','9 h 30','9 h 45','10 h 00','10 h 15','10 h 30','10 h 45','11 h 00','11 h 15','14 h 00','14 h 15','…','18 h 15'].map(h => '<span class="puce">' + h + '</span>').join('') + '</div>' +
  '<p class="note">Aucun horaire ? « Aucun horaire libre ce jour-là (fermé, bloqué, trop tôt ou trop loin). »</p></div>';

const F = {
  bloquer: '<h3>Bloquer une période</h3><label class="coche"><input type="checkbox" onclick="document.getElementById(\'jours\').hidden=this.checked;document.getElementById(\'heures\').hidden=!this.checked"> Seulement quelques heures</label>' +
    '<div class="deux" id="jours"><div class="champ"><label>Du <i>*</i></label><input type="date" value="2026-10-20"></div><div class="champ"><label>Au (inclus) <i>*</i></label><input type="date" value="2026-10-24"></div></div>' +
    '<div id="heures" hidden><div class="champ"><label>Le <i>*</i></label><input type="date" value="2026-11-03"></div><div class="deux" style="margin-top:10px"><div class="champ"><label>De <i>*</i></label><input type="time" value="14:00"></div><div class="champ"><label>À <i>*</i></label><input type="time" value="16:00"></div></div></div>' +
    '<div class="champ"><label>Motif (pour vous seul)</label><input placeholder="ex. Congés, dentiste…"></div>' +
    '<p class="note">Les clients ne verront plus d\'horaires pendant cette période. (Rendez-vous déjà pris : vous choisirez de les annuler ou de les garder, quand les rendez-vous existeront.)</p>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Période bloquée : du 20/10 au 24/10/2026.">Bloquer</button><button class="btn sec" data-close>Annuler</button></div>',
};
F['bloquer-jour'] = F.bloquer; F['bloquer-heures'] = F.bloquer;

let etat = 'calendrier', minuterie;
function rendre() { document.getElementById('ecran').innerHTML = E[etat](); document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat)); }
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(minuterie); minuterie = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const j = ev.target.closest('[data-jour]');
  if (j) { document.querySelectorAll('.case').forEach(c => c.classList.remove('choisi')); j.classList.add('choisi'); const d = +j.dataset.jour, b = d >= 20 && d <= 24;
    document.getElementById('detail').innerHTML = '<div class="tete"><h2>' + d + ' octobre</h2><span class="badge ' + (b ? 'b-att">bloqué' : j.classList.contains('ouvert') ? 'b-ok">ouvert' : 'b-neu">fermé') + '</span></div><p class="note">' + (b ? 'Congés (du 20/10 au 24/10)' : j.textContent.replace(/^\d+/, '')) + '</p><div class="actions">' + (b ? '<button class="btn dan" data-toast="Période débloquée.">Débloquer cette période</button>' : '<button class="btn sec" data-fen="bloquer">Bloquer ce jour</button><button class="btn sec" data-fen="bloquer">Bloquer quelques heures…</button>') + '</div>'; return; }
  const c = ev.target.closest('.choix button');
  if (c) { c.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === c)); return; }
  const el = ev.target.closest('[data-e],[data-fen],[data-close],[data-toast]'); if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
  if (el.dataset.e) { etat = el.dataset.e; rendre(); }
  if (el.dataset.toast) toast(el.dataset.toast);
});
rendre();
</script>
