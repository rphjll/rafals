<title>Maquette rafals paiements</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:36px;padding:6px 12px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-att{background:var(--att-doux);color:var(--att)}
.note{font-size:13.5px;color:var(--doux);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-att{background:var(--att-doux);color:var(--att)} .a-err{background:var(--err-doux);color:var(--err)}
.etoiles{color:var(--accent);font-size:18px;letter-spacing:1px}
.choix-etoiles{display:flex;gap:4px} .choix-etoiles button{font-size:30px;border:0;background:none;cursor:pointer;color:var(--bord);padding:0 2px;min-height:42px} .choix-etoiles button.on{color:var(--accent)}
.avis{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--bord);padding-top:12px}
.avis:first-of-type{border-top:0;padding-top:0}
.reponse{margin-left:18px;border-left:3px solid var(--prim-doux);padding:4px 10px;font-size:14px}
.rdv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bord);padding-top:14px}
.rdv:first-of-type{border-top:0;padding-top:0}
.monavis{background:var(--fond);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap} .grosse{font-size:34px;font-weight:700}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.compteur{margin-left:4px;background:var(--accent);color:var(--sur);border-radius:999px;padding:1px 7px;font-size:12px}
.mots{display:flex;flex-wrap:wrap;gap:6px} .mot{display:inline-flex;align-items:center;gap:6px;background:var(--neu-doux);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px} .mot button{border:0;background:var(--surface);color:var(--err);border-radius:999px;width:24px;height:24px;cursor:pointer;font-weight:700}
input,textarea{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
textarea{min-height:100px}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
.b-ok{background:var(--ok-doux);color:var(--ok)} .b-err{background:var(--err-doux);color:var(--err)}
.a-ok{background:var(--ok-doux);color:var(--ok)} .a-neu{background:var(--neu-doux);color:var(--neu)}
.ver{background:var(--neu-doux);color:var(--neu);border-color:var(--neu-doux)}
.lignes{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px} .lignes span:nth-child(odd){color:var(--doux)}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:8px} .choix button{font:inherit;border:1px solid var(--bord);background:var(--surface);color:var(--texte);border-radius:10px;min-height:52px;padding:8px;cursor:pointer;text-align:left}
.choix button[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);font-weight:600}
.case{display:flex;gap:10px;align-items:flex-start;font-size:14px} .case input{width:20px;min-height:20px;height:20px;margin-top:2px}
.etats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--doux);align-items:center}
.tableau{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bord)} th{color:var(--doux);font-weight:600;font-size:13px} th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px} .chiffre{background:var(--fond);border-radius:10px;padding:10px 12px} .chiffre b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
</style>
<div class="bandeau"><b>Maquette lot 5.2</b> · écrans :
  <button class="onglet" data-e="activite" aria-pressed="true">1. Mon activité › Paiement par carte</button>
  <button class="onglet" data-e="reserver">2. Réserver par carte</button>
  <button class="onglet" data-e="client">3. Mes rendez-vous (client)</button>
  <button class="onglet" data-e="presta">4. Mon agenda › Paiements</button>
  <button class="onglet" data-e="compte">5. Mon compte › Mes paiements</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const E = {};
let carte = 'activer';
const etatsCarte = {
  siret: '<p class="note">Payé par carte, l\'argent arrive sur votre compte en banque 48 h après chaque rendez-vous.</p><div class="actions"><button class="btn ver" data-bulle="Il faut d\'abord un SIRET vérifié par l\'État : ajoutez-le avec [Modifier mon profil].">🔒 Activer le paiement par carte</button></div>',
  activer: '<p class="note">Vos clients paient en réservant, sur la page sécurisée de Stripe. L\'argent reste bloqué jusqu\'au rendez-vous, puis arrive sur votre compte en banque 48 h après.</p>' +
    '<div class="lignes"><span>Exemple</span><span>Coupe à 50 € : rafals garde 2,50 € (5 %), Stripe 1,00 € de frais, vous recevez <b>46,50 €</b>.</span><span>Remboursements</span><span>Si vous refusez, annulez ou êtes absent, le client est remboursé et les frais de Stripe restent à votre charge.</span></div>' +
    '<label class="case"><input type="checkbox" checked> <span>J\'accepte que rafals fasse mes factures à ma place, à mon nom (mandat de facturation). *</span></label>' +
    '<div class="actions"><button class="btn prim" data-toast="(vers la page de Stripe : identité et RIB)">Activer le paiement par carte</button></div><p class="note">Vous allez sur la page de Stripe pour donner votre identité et votre RIB, puis vous revenez ici. Case non cochée : « Cochez la case : vous acceptez que rafals fasse vos factures à votre place. » au-dessus du bouton.</p>',
  verification: '<div class="alerte a-att">Stripe vérifie vos informations : cela prend de quelques minutes à 2 jours. Vos annonces proposent les espèces en attendant.</div><div class="actions"><button class="btn sec" data-toast="(retour sur la page de Stripe)">Continuer chez Stripe</button><button class="btn sec" data-toast="Toujours en cours de vérification par Stripe.">Actualiser</button></div>',
  pret: '<p style="margin:0">Vos annonces qui acceptent la carte la proposent aux clients.</p><p class="note">Mandat de facturation accepté le 02/10/2026. Vos paiements : <b>Mon agenda › Paiements</b>.</p>',
};
const badgeCarte = {siret: '<span class="badge b-neu">espèces seulement</span>', activer: '<span class="badge b-neu">pas activé</span>', verification: '<span class="badge b-att">vérification par Stripe</span>', pret: '<span class="badge b-ok">activé</span>'};
const nomsEtats = {siret: 'sans SIRET vérifié', activer: 'à activer', verification: 'en vérification', pret: 'activé'};
E.activite = () => '<h1>Mon activité</h1><div class="etats">Voir l\'état : ' + Object.keys(nomsEtats).map(k => '<button class="onglet" data-carte="' + k + '" aria-pressed="' + (carte === k) + '">' + nomsEtats[k] + '</button>').join('') + '</div>' +
  '<div class="carte"><p class="note">(carte du profil, Mes annonces, Mes métiers : inchangés)</p></div>' +
  '<div class="carte"><div class="tete"><h2>Paiement par carte</h2>' + badgeCarte[carte] + '</div>' + etatsCarte[carte] + '</div>' +
  '<div class="carte"><p class="note">(Mon local, Visibilité : inchangés)</p></div>' +
  (carte === 'verification' ? '<p class="note">Au retour de la page de Stripe : message « Merci : Stripe vérifie vos informations. »</p>' : '') +
  '<p class="note">Si le paiement par carte n\'est pas encore ouvert sur rafals (pas de clés Stripe), la carte dit seulement : « Le paiement par carte arrivera bientôt sur rafals. »</p>';
E.reserver = () => '<div class="carte"><h2>Coupe femme — Léa Martin</h2><p class="note">50 € · 45 min · chez Léa, à Mérignac · <b>carte ou espèces</b></p><p class="note">(choix de l\'horaire : inchangé) → clic sur « 10 h 00 »</p><div><button class="btn prim" data-fen="reserver">Ouvrir la fenêtre de réservation</button></div></div>';
const ligneRdv = (titre, badge, quand, lignes, fin) => '<div class="rdv"><div class="tete"><h3>' + titre + '</h3>' + badge + '</div><p style="margin:0;font-weight:600">' + quand + '</p><div class="lignes">' + lignes + '</div>' + (fin || '') + '</div>';
E.client = () => '<h1>Mes rendez-vous</h1><div class="alerte a-ok">Paiement reçu : votre rendez-vous est confirmé.</div><p class="note">Au retour de Stripe. Paiement pas encore arrivé : « Paiement en cours de confirmation… » (la page se relit toute seule). Client revenu sans payer : la réservation est annulée aussitôt, message orange « Paiement non terminé : rien n\'a été pris, la réservation est annulée. »</p>' +
  '<div class="sous-onglets"><button aria-pressed="true">À venir</button><button>Passés et annulés</button></div><div class="carte">' +
  ligneRdv('Coupe femme', '<span class="badge b-ok">confirmé</span>', 'Mardi 13/10/2026, 10 h 00 – 10 h 45', '<span>Avec</span><span>Léa Martin · 06 12 34 56 78</span><span>Où</span><span>Chez Léa : 3 rue du Moulin, 33700 Mérignac</span><span>Prix</span><span>50 € · <b>payé par carte</b> le 02/10/2026</span>', '<div class="actions"><button class="btn sec petit">Déplacer</button><button class="btn dan petit" data-fen="annuler">Annuler…</button><span class="note">Annulation gratuite jusqu\'au lundi 12/10 à 10 h 00.</span></div>') +
  ligneRdv('Ménage 2 h', '<span class="badge b-att">en attente</span>', 'Vendredi 16/10/2026, 14 h 00 – 16 h 00', '<span>Prix</span><span>50 € · payé par carte · remboursé en entier si Julie Leroy refuse</span>', '<p class="note">Julie Leroy doit accepter avant le samedi 03/10 à 15 h 00.</p>') +
  ligneRdv('Dépannage fuite', '<span class="badge b-err">annulé par le prestataire</span>', 'Jeudi 15/10/2026, 9 h 00 – 11 h 00', '<span>Avec</span><span>Karim Benali</span><span>Prix</span><span>120 € · par carte · <b>remboursé 120,00 €</b> le 05/10/2026</span><span>Motif</span><span>« Malade, désolé »</span>') +
  '</div>';
const ligne = (rdv, etat, paye, com, frais, net) => '<tr><td>' + rdv + '</td><td>' + etat + '</td><td class="n">' + paye + '</td><td class="n">' + com + '</td><td class="n">' + frais + '</td><td class="n"><b>' + net + '</b></td></tr>';
E.presta = () => '<h1>Mon agenda</h1><div class="sous-onglets"><button>Calendrier</button><button>Rendez-vous</button><button>Semaine type</button><button>Réglages</button><button>Horaires libres</button><button aria-pressed="true">Paiements</button></div>' +
  '<div class="carte"><div class="chiffres"><div class="chiffre"><span class="note">À venir (bloqué chez Stripe)</span><b>93,00 €</b><span class="note">2 rendez-vous</span></div><div class="chiffre"><span class="note">Versé en octobre</span><b>46,50 €</b><span class="note">1 rendez-vous</span></div></div>' +
  '<div class="tableau"><table><thead><tr><th>Rendez-vous</th><th>État</th><th class="n">Payé</th><th class="n">rafals 5 %</th><th class="n">Frais Stripe</th><th class="n">Pour vous</th></tr></thead><tbody>' +
  ligne('Coupe femme<br><span class="note">mar. 13/10 · Marie Dupont</span>', '<span class="badge b-att">versé le 15/10</span>', '50,00 €', '2,50 €', '1,00 €', '46,50 €') +
  ligne('Coupe + brushing<br><span class="note">ven. 16/10 · Paul Petit</span>', '<span class="badge b-att">versé le 18/10</span>', '50,00 €', '2,50 €', '1,00 €', '46,50 €') +
  ligne('Coupe femme<br><span class="note">lun. 05/10 · Marie Dupont</span>', '<span class="badge b-ok">versé</span>', '50,00 €', '2,50 €', '1,00 €', '46,50 €') +
  ligne('Couleur<br><span class="note">sam. 03/10 · Paul Petit</span>', '<span class="badge b-err">remboursé au client</span>', '80,00 €', '—', '1,45 €', '−1,45 €') +
  '</tbody></table></div><p class="note">« versé le 15/10 » en orange = date prévue (48 h après la fin) ; l\'argent arrive sur votre compte en banque quelques jours après. Les frais d\'un remboursement sont retirés de votre versement suivant. Vide : « Aucun paiement par carte pour l\'instant. »</p></div>';
E.compte = () => '<h1>Mon compte</h1><div class="carte"><p class="note">(Mes informations, Mon adresse… : inchangés)</p></div>' +
  '<div class="carte"><h2>Mes paiements par carte</h2><div class="tableau"><table><thead><tr><th>Rendez-vous</th><th>Payé le</th><th class="n">Montant</th><th>Remboursement</th></tr></thead><tbody>' +
  '<tr><td>Coupe femme · Léa Martin<br><span class="note">mar. 13/10/2026</span></td><td>02/10/2026</td><td class="n">50,00 €</td><td>—</td></tr>' +
  '<tr><td>Dépannage fuite · Karim Benali<br><span class="note">jeu. 15/10/2026</span></td><td>01/10/2026</td><td class="n">120,00 €</td><td><span class="badge b-ok">120,00 € le 05/10</span></td></tr>' +
  '</tbody></table></div><p class="note">Carte affichée seulement si vous avez déjà payé par carte. Les factures arriveront au lot 5.6.</p></div>';
const F = {
  reserver: '<h3>Réserver ce rendez-vous ?</h3><div class="lignes"><span>Service</span><span>Coupe femme, avec Léa Martin</span><span>Quand</span><span>Mardi 13/10/2026, 10 h 00 – 10 h 45</span><span>Prix</span><span>50 €</span></div>' +
    '<span style="font-weight:600;font-size:13px">Paiement *</span><div class="choix"><button data-paie="especes">Espèces, le jour même</button><button data-paie="carte" aria-pressed="true">Carte, maintenant</button></div>' +
    '<div id="explic" class="alerte a-neu">Vous payez 50 € maintenant sur la page sécurisée de Stripe (30 minutes pour payer). Remboursé en entier si Léa refuse ou annule ; si vous annulez à temps, remboursé moins les frais de paiement (environ 1 €).</div>' +
    '<div class="pied"><button class="btn prim" id="go" data-close data-toast="(vers la page de paiement de Stripe)">Payer 50 € et réserver</button><button class="btn sec" data-close>Annuler</button></div>',
  annuler: '<h3>Annuler ce rendez-vous ?</h3><p class="note">Coupe femme avec Léa Martin, mardi 13/10/2026, 10 h 00 – 10 h 45. Léa Martin est prévenue par mail et l\'horaire redevient libre.</p><div class="alerte a-neu">Payé par carte : vous serez remboursé de 49,00 € (50 € moins 1,00 € de frais de paiement), sous 5 à 10 jours.</div><div class="pied"><button class="btn dan" data-close data-toast="Rendez-vous annulé : remboursement en cours.">Annuler le rendez-vous</button><button class="btn sec" data-close>Garder</button></div>',
};
let etat = 'activite', m;
function rendre() { document.getElementById('ecran').innerHTML = E[etat](); document.querySelectorAll('.bandeau .onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat)); }
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(m); m = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-carte]'); if (c) { carte = c.dataset.carte; rendre(); return; }
  const b = ev.target.closest('[data-bulle]'); if (b) { toast(b.dataset.bulle); return; }
  const p = ev.target.closest('[data-paie]');
  if (p) {
    p.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === p));
    const parCarte = p.dataset.paie === 'carte';
    document.getElementById('explic').hidden = !parCarte;
    const go = document.getElementById('go');
    go.textContent = parCarte ? 'Payer 50 € et réserver' : 'Réserver mardi 13/10 à 10 h 00';
    go.dataset.toast = parCarte ? '(vers la page de paiement de Stripe)' : 'Rendez-vous confirmé.';
    return;
  }
  const el = ev.target.closest('[data-e],[data-fen],[data-close],[data-toast]'); if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
  if (el.dataset.e) { etat = el.dataset.e; rendre(); }
  if (el.dataset.toast) toast(el.dataset.toast);
});
rendre();
</script>
