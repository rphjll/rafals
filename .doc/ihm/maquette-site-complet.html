<title>rafals Maquette Complète</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : en-tête collant (ordinateur) ou barre d'onglets en bas (téléphone) ; une colonne centrée de 880 px ; cartes blanches sur fond vert très pâle ; formes douces qui flottent derrière. */
:root{
  --fond:#F2F6F1; --surface:#FFFFFF; --surface2:#F7FAF6; --texte:#16211A; --doux:#5A6A5F; --bord:#DCE6DE;
  --primaire:#2F6B4F; --primaire-texte:#FFFFFF; --primaire-doux:#E2EFE6; --fonce:#1E4B37; --fonce-texte:#F2FFF6;
  --accent:#E0773A; --accent-doux:#FCEBDD;
  --ok:#2E7D4F; --ok-doux:#E1F2E7; --attente:#A86300; --attente-doux:#FBEFD9; --erreur:#B3261E; --erreur-doux:#FBE4E2;
  --ombre:0 1px 2px rgba(22,33,26,.06),0 6px 20px rgba(22,33,26,.06);
  --forme1:rgba(47,107,79,.10); --forme2:rgba(224,119,58,.09);
  --ouvert:#5FD38A; --ouvert-texte:#0F2A1A; --hachure:rgba(214,48,49,.38);
  --titre:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --corps:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#0E1410; --surface:#172019; --surface2:#1B251E; --texte:#E7EEE9; --doux:#9EB0A4; --bord:#29362D;
  --primaire:#7CC7A0; --primaire-texte:#0E1A13; --primaire-doux:#1B3125; --fonce:#163828; --fonce-texte:#E8F7EE;
  --accent:#F0955A; --accent-doux:#3A2414;
  --ok:#6CC592; --ok-doux:#17301F; --attente:#F0B35A; --attente-doux:#33260F; --erreur:#F08A82; --erreur-doux:#3A1A18;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --forme1:rgba(124,199,160,.10); --forme2:rgba(240,149,90,.08); color-scheme:dark;
  --ouvert:#1F8A4A; --ouvert-texte:#F2FFF6; --hachure:rgba(240,110,110,.40);
}}
:root[data-theme="dark"]{
  --fond:#0E1410; --surface:#172019; --surface2:#1B251E; --texte:#E7EEE9; --doux:#9EB0A4; --bord:#29362D;
  --primaire:#7CC7A0; --primaire-texte:#0E1A13; --primaire-doux:#1B3125; --fonce:#163828; --fonce-texte:#E8F7EE;
  --accent:#F0955A; --accent-doux:#3A2414;
  --ok:#6CC592; --ok-doux:#17301F; --attente:#F0B35A; --attente-doux:#33260F; --erreur:#F08A82; --erreur-doux:#3A1A18;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --forme1:rgba(124,199,160,.10); --forme2:rgba(240,149,90,.08); color-scheme:dark;
  --ouvert:#1F8A4A; --ouvert-texte:#F2FFF6; --hachure:rgba(240,110,110,.40);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--fond);color:var(--texte);font-family:var(--corps);font-size:16px;line-height:1.5;transition:background .3s,color .3s}
h1,h2,h3{font-family:var(--titre);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(28px,5vw,38px);font-weight:800;letter-spacing:-.5px}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700;font-family:var(--corps)}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.petit{font-size:14px}.doux{color:var(--doux)}

/* Fond animé */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco span{position:absolute;border-radius:40% 60% 55% 45%;filter:blur(2px);animation:flotte 26s ease-in-out infinite alternate}
.deco .d1{width:420px;height:420px;background:var(--forme1);left:-140px;top:120px}
.deco .d2{width:300px;height:300px;background:var(--forme2);right:-90px;top:45%;animation-duration:32s}
.deco .d3{width:200px;height:200px;background:var(--forme1);left:55%;bottom:-80px;animation-duration:22s;border-radius:32px}
.deco .d4{width:90px;height:90px;background:var(--forme2);left:30%;top:18%;border-radius:22px;animation-duration:18s}
@keyframes flotte{50%{transform:translate(50px,-40px) rotate(20deg)}100%{transform:translate(-30px,30px) rotate(-12deg)}}

/* En-tête */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bord)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.entete-in{max-width:1100px;margin:0 auto;height:64px;display:flex;align-items:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--titre);font-weight:800;font-size:28px;letter-spacing:-1px;color:var(--primaire);text-decoration:none;flex:none}
.logo b{color:var(--accent)}
.nav{display:flex;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--doux);position:relative;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--texte)}
.nav a.actif{background:var(--primaire-doux);color:var(--primaire)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.compte{position:relative;margin-left:auto}
.compte-btn{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--bord);padding:5px 12px 5px 5px;border-radius:999px;cursor:pointer;font-weight:600}
.compte-btn:hover{background:var(--surface2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.av.g{width:64px;height:64px;font-size:26px}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:240px;background:var(--surface);border:1px solid var(--bord);border-radius:16px;box-shadow:var(--ombre);padding:6px;animation:apparait .15s ease-out}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;text-decoration:none;font-weight:600;background:none;border:0;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--bord);margin:4px 0}
@keyframes apparait{from{opacity:0;transform:translateY(-4px)}}

/* Barre du bas (téléphone) */
.basbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--bord);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.basbar nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.basbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;font-size:11px;white-space:nowrap;font-weight:600;color:var(--doux);position:relative;border-radius:12px}
.basbar a.actif{color:var(--primaire)}
.basbar a.actif svg{background:var(--primaire-doux);border-radius:12px;padding:3px 10px;width:44px;height:30px}
.basbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:11px}

/* Page */
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.page{animation:entre .25s ease-out;display:flex;flex-direction:column;gap:22px}
@keyframes entre{from{opacity:0;transform:translateY(8px)}}
.retour{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--primaire);text-decoration:none;margin-bottom:-10px;align-self:flex-start;padding:4px 8px 4px 0}
.retour:hover{text-decoration:underline}
.tete{display:flex;flex-direction:column;gap:6px}
.tete p{color:var(--doux);font-size:17px}
.section{display:flex;flex-direction:column;gap:12px}
.section-titre{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.carte{background:var(--surface);border:1px solid var(--bord);border-radius:18px;padding:18px;box-shadow:var(--ombre)}
.ligne{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--bord);border-radius:16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
a.ligne:hover,button.ligne:hover{border-color:var(--primaire);transform:translateY(-1px);box-shadow:var(--ombre)}
button.ligne{width:100%;text-align:left;cursor:pointer}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-weight:700}
.ligne .txt span{display:block;color:var(--doux);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .fin{flex:none;display:flex;align-items:center;gap:8px;color:var(--doux);font-weight:600}
.liste{display:flex;flex-direction:column;gap:10px}
.ico-rond{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--primaire-doux);color:var(--primaire);flex:none}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.puce{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-doux);color:var(--ok)}.p-att{background:var(--attente-doux);color:var(--attente)}.p-err{background:var(--erreur-doux);color:var(--erreur)}.p-neutre{background:var(--surface2);color:var(--doux);border:1px solid var(--bord)}.p-accent{background:var(--accent-doux);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;transition:filter .15s,transform .1s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-1{background:var(--primaire);color:var(--primaire-texte)}
.btn-1:hover{filter:brightness(1.08)}
.btn-2{background:var(--surface);border-color:var(--bord);color:var(--texte)}
.btn-2:hover{border-color:var(--primaire);color:var(--primaire)}
.btn-ok{background:var(--ok-doux);color:var(--ok);cursor:default}
.btn-petit{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Accueil */
.hero{position:relative;overflow:hidden;background:var(--fonce);color:var(--fonce-texte);border-radius:24px;padding:32px 28px}
.hero h1{max-width:18ch}
.hero p{opacity:.85;margin-top:8px;font-size:17px}
.hero .forme{position:absolute;border-radius:28px;background:rgba(255,255,255,.07);animation:flotte 16s ease-in-out infinite alternate}
.hero .f1{width:180px;height:180px;right:-40px;top:-50px}
.hero .f2{width:90px;height:90px;right:120px;bottom:-30px;border-radius:50%;background:rgba(240,149,90,.25);animation-duration:12s}
.hero .f3{width:50px;height:50px;right:40px;bottom:40px;animation-duration:9s}
.recherche{position:relative;display:flex;gap:8px;margin-top:20px;max-width:560px;flex-wrap:wrap}
.recherche input{flex:1;min-width:0;min-height:52px;border-radius:14px;border:0;padding:0 16px;font-size:17px;background:#fff;color:#16211A}
.recherche .btn{min-height:52px;background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bord);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px;transition:.15s}
.chip:hover{border-color:var(--primaire)}
.chip.on{background:var(--primaire);border-color:var(--primaire);color:var(--primaire-texte)}
.hero .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--fonce-texte)}
.hero .chip:hover{background:rgba(255,255,255,.2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--surface);border:1px solid var(--bord);border-radius:18px;text-decoration:none;transition:.15s}
.stat:hover{border-color:var(--primaire);transform:translateY(-2px);box-shadow:var(--ombre)}
.stat b{font-family:var(--titre);font-size:30px;font-weight:800;color:var(--primaire);line-height:1.1}
.stat span{font-size:14px;color:var(--doux);font-weight:600}

/* Prestataires */
.presta{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--bord);border-radius:18px;text-decoration:none;transition:.15s}
.presta:hover{border-color:var(--primaire);transform:translateY(-2px);box-shadow:var(--ombre)}
.presta .haut{display:flex;gap:12px;align-items:center}
.presta .haut div{min-width:0}
.presta b{display:block;font-size:17px}
.presta .bas{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.etoile{color:var(--accent);font-weight:700}
.prix{font-weight:700;color:var(--primaire)}
.vide{text-align:center;padding:36px 16px;color:var(--doux)}
.fiche{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fiche .infos{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.creneaux{display:flex;gap:8px;flex-wrap:wrap}
.creneau{border:1px solid var(--bord);background:var(--surface2);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.creneau:hover{border-color:var(--primaire)}
.creneau.on{background:var(--primaire);color:var(--primaire-texte);border-color:var(--primaire)}
.avis{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--bord)}
.avis:first-child{border-top:0;padding-top:0}

/* Messages */
.conv{display:flex;flex-direction:column;gap:10px;min-height:300px}
.bulle{max-width:78%;padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--bord);align-self:flex-start;animation:entre .2s ease-out}
.bulle.moi{align-self:flex-end;background:var(--primaire);color:var(--primaire-texte);border-color:var(--primaire)}
.bulle small{display:block;font-size:12px;opacity:.7;margin-top:2px}
.ecrire{display:flex;gap:8px;position:sticky;bottom:12px}
.ecrire input{flex:1;min-width:0;min-height:50px;border-radius:14px;border:1px solid var(--bord);background:var(--surface);padding:0 16px;box-shadow:var(--ombre)}
.point{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}

/* Formulaires */
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-weight:700}
.champ input,.champ select,.champ textarea{min-height:48px;border-radius:12px;border:1px solid var(--bord);background:var(--surface);padding:10px 14px}
.champ textarea{min-height:110px;resize:vertical}
.champ small{color:var(--doux)}
.form{display:flex;flex-direction:column;gap:16px}

/* Réglages */
.reglage{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--bord)}
.reglage:first-of-type{border-top:0;padding-top:4px}
.reglage .rl{display:flex;justify-content:space-between;align-items:center;gap:14px}
.reglage .rl div{min-width:0}
.exemple{font-size:14px;color:var(--doux);background:var(--surface2);border-radius:10px;padding:8px 12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface2);border:1px solid var(--bord);padding:4px;border-radius:14px}
.seg button{flex:1;min-width:110px;min-height:42px;border:0;border-radius:10px;background:none;font-weight:600;cursor:pointer;color:var(--doux);transition:.15s}
.seg button:hover{color:var(--texte)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primaire);box-shadow:var(--ombre);font-weight:700}
.switch{flex:none;width:54px;height:32px;border-radius:16px;border:0;background:var(--bord);position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--primaire)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

/* Activité */
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tuile{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--bord);border-radius:18px;text-decoration:none;transition:.15s;position:relative}
a.tuile:hover{border-color:var(--primaire);transform:translateY(-2px);box-shadow:var(--ombre)}
.tuile b{display:block}
.tuile span.d{color:var(--doux);font-size:14px}
.tuile.bientot{opacity:.6}
.tuile .badge,.tuile .puce{position:absolute;top:12px;right:12px}

/* Onglets */
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--bord);overflow-x:auto;scrollbar-width:none}
.onglets button{background:none;border:0;padding:12px 16px;font-weight:700;color:var(--doux);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.onglets button[aria-selected="true"]{color:var(--primaire);border-color:var(--primaire)}
.jour{font-weight:700;color:var(--doux);font-size:14px;text-transform:uppercase;letter-spacing:.6px;margin-top:6px}
.heure{font-family:var(--titre);font-weight:800;font-size:20px;color:var(--primaire);width:64px;flex:none}

/* Avis */
.note-grande{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.note-grande .n{font-family:var(--titre);font-size:56px;font-weight:800;line-height:1}
.barres{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.barres div{display:flex;align-items:center;gap:10px;font-size:14px}
.barres i{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--bord)}
.barres i::after{content:"";display:block;height:100%;width:var(--l);background:var(--accent)}

/* Carte de visite */
.cv{max-width:100%;width:420px;aspect-ratio:85/55;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:background .3s}
.cv b{font-family:var(--titre);font-size:26px;display:block}
.cv .qr{width:64px;height:64px;background:#fff;border-radius:8px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.cv .qr i{background:#111;border-radius:1px}
.cv .qr i:nth-child(3n){background:transparent}
.nuancier{display:flex;gap:10px;flex-wrap:wrap}
.nuance{width:42px;height:42px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--bord);cursor:pointer}
.nuance.on{box-shadow:0 0 0 3px var(--texte)}

/* Étapes */
.etapes{display:flex;flex-direction:column;gap:0}
.etape{display:flex;gap:14px;padding-bottom:18px;position:relative}
.etape::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--ok)}
.etape:last-child::before{display:none}
.etape .rond{width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.etape .rond svg{width:18px;height:18px}

/* Connexion */
.connexion{max-width:420px;margin:20px auto 0;width:100%}

/* Agenda */
main.large{max-width:1100px}
.heure{width:auto;min-width:64px}
.bandeau{border-radius:12px;padding:12px 14px;font-weight:600}
.b-vert{background:var(--ouvert);color:var(--ouvert-texte);font-size:17px}
.b-err{background:var(--erreur-doux);color:var(--erreur)}
.b-att{background:var(--attente-doux);color:var(--attente);display:flex;flex-direction:column;gap:8px}
.b-att ul{margin:0;padding-left:18px;font-weight:500}
.btn-danger{background:var(--erreur);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.plage{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plage select{min-height:42px;border-radius:10px;border:1px solid var(--bord);background:var(--surface);padding:0 10px}

.legende{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--doux)}

.lg{width:18px;height:14px;border-radius:4px;border:1px solid var(--bord);display:inline-block;flex:none}

.bulle-jour{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 32px));max-height:45vh;overflow:auto;background:var(--surface);border:2px solid var(--primaire);border-radius:20px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px;animation:monte-bulle .2s ease-out}

 return `${retour('mes-demandes','Mes demandes')}${tete('Publier une demande','Dites ce dont vous avez besoin : les prestataires près de chez vous sont prévenus.')}
 <form class="carte form" data-form="demande">

/* ================= Mon agenda ================= */
const AUJ=new Date(2026,10,8);
const NOMS_J=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const NOMS_M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const p2=n=>String(n).padStart(2,'0');
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const cle=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const deCle=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const CLE_AUJ=cle(AUJ);
const jIdx=d=>(d.getDay()+6)%7;
const fmtH=m=>`${Math.floor(m/60)} h ${p2(m%60)}`;
const hC=m=>`${Math.floor(m/60)} h${m%60?' '+p2(m%60):''}`;
const court=m=>m%60?`${Math.floor(m/60)}h${p2(m%60)}`:`${m/60}`;
const plTxt=pl=>pl.map(p=>fmtH(p[0])+' – '+fmtH(p[1])).join(' · ');
const plCourt=pl=>pl.map(p=>court(p[0])+'-'+court(p[1])).join(' · ');
const dateLongue=k=>{const d=deCle(k);return `${NOMS_J[jIdx(d)]} ${d.getDate()} ${NOMS_M[d.getMonth()]}`;};
const dateCourte=k=>{const d=deCle(k);return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;};
const de_=m=>/^[aeiouyéèêàâîôûAEIOUYÉÈÊ]/.test(m)?'d’'+m:'de '+m;
const copie=x=>JSON.parse(JSON.stringify(x));
const trie=pl=>[...pl].sort((a,b)=>a[0]-b[0]);
const DEFAUT_SEM=[[[540,720],[840,1080]],[[540,720],[840,1080]],[[540,720],[840,1080]],[[540,720],[840,1080]],[[540,720],[840,1080]],[[540,720]],[]];
const metiersNoms=()=>S.metiersMoi.map(m=>m[0]);
function semaine(m){if(!S.semaines[m])S.semaines[m]=copie(DEFAUT_SEM);return S.semaines[m];}
function exc(m){return S.exceptions[m]||(S.exceptions[m]={});}
function heuresDuJour(m,k){return exc(m)[k]||semaine(m)[jIdx(deCle(k))];}
const rdvActifs=()=>S.rdv.filter(r=>r.etat!=='Annulé'&&r.etat!=='Refusé');
const prochainRdv=()=>rdvActifs().filter(r=>r.date>=CLE_AUJ).sort((a,b)=>a.date.localeCompare(b.date)||a.debut-b.debut)[0];
const dehors=(r,pl)=>!pl.some(p=>r.debut>=p[0]&&r.fin<=p[1]);
function valider(pl,jour){const t=trie(pl);for(const p of t)if(p[1]<=p[0])return jour?`Le ${jour} : chaque plage doit finir après son début.`:'Chaque plage doit finir après son début.';
 for(let i=1;i<t.length;i++)if(t[i][0]<t[i-1][1])return jour?`Deux plages se chevauchent le ${jour} : ${fmtH(t[i-1][0])}-${fmtH(t[i-1][1])} et ${fmtH(t[i][0])}-${fmtH(t[i][1])}.`:'Deux plages se chevauchent : changez leurs heures.';return null;}
function plageApres(pl,ecart,duree){if(!pl.length)return [540,720];const fin=Math.max(...pl.map(p=>p[1]));const d=Math.min(fin+ecart,1425);return [d,Math.min(d+duree,1440)];}
const nouvellePlageJour=pl=>plageApres(pl,120,240);
const nouvellePlageSem=pl=>pl.length===1&&pl[0][1]<=720?[840,1140]:plageApres(pl,60,180);
function selHeure(val,champ,fin,label){let o='';for(let m=fin?15:0;m<=(fin?1440:1425);m+=15)o+=`<option value="${m}"${m===val?' selected':''}>${fmtH(m)}</option>`;return `<select data-champ="${champ}" aria-label="${label}">${o}</select>`;}
function bandeauConflits(l,mode){const fin=mode==='f'?' et enregistrer':'';return `<div class="bandeau b-att"><b>${l.length>1?l.length+' rendez-vous tombent':'1 rendez-vous tombe'} en dehors de ces horaires :</b><ul>${l.map(r=>`<li>${dateCourte(r.date)} · ${fmtH(r.debut)} – ${fmtH(r.fin)} · ${r.quoi} · ${r.qui}</li>`).join('')}</ul><div class="btns"><button class="btn btn-danger btn-petit" data-act="${mode}-annuler-rdv">Annuler ces rendez-vous${fin}</button><button class="btn btn-2 btn-petit" data-act="${mode}-garder">Les garder${fin}</button></div></div>`;}

/* Semaine type : l’éditeur sert au premier passage et au bouton « Changer les horaires ». */
function editeurSemaine(ed){return `<div class="semaine">${NOMS_J.map((n,j)=>{const pl=ed.sem[j];return `<div class="sem-jour"><b class="sem-nom">${cap(n)}</b><div class="sem-plages">${pl.length?pl.map((p,k)=>`<div class="plage"><span>De</span>${selHeure(p[0],`s-${j}-${k}-0`,false,cap(n)+' : début')}<span>à</span>${selHeure(p[1],`s-${j}-${k}-1`,true,cap(n)+' : fin')}<button class="croix" data-act="s-retire" data-v="${j}-${k}" aria-label="Retirer cette plage">×</button></div>`).join(''):'<span class="puce p-neutre">Fermé</span>'}<button class="lien-plus" data-act="s-ajout" data-v="${j}">+ Ajouter une plage</button></div></div>`;}).join('')}</div>${ed.erreur?`<div class="bandeau b-err">${ed.erreur}</div>`:''}${ed.conflits?bandeauConflits(ed.conflits,'s'):''}`;}
function enregistrerSemaine(force){const ed=S.edSem;
 for(let j=0;j<7;j++){const e=valider(ed.sem[j],NOMS_J[j]);if(e){ed.erreur=e;ed.conflits=null;return false;}}
 ed.erreur=null;const sem=ed.sem.map(trie);
 if(!force){const c=rdvActifs().filter(r=>r.metier===ed.metier&&r.date>=CLE_AUJ&&!exc(ed.metier)[r.date]&&dehors(r,sem[jIdx(deCle(r.date))]));if(c.length){ed.conflits=c;return false;}}
 if(force==='annuler')ed.conflits.forEach(r=>r.etat='Annulé');
 S.semaines[ed.metier]=sem;ed.conflits=null;return true;}
const metierSemaine=()=>{const ms=metiersNoms();return ms.includes(S.calMetier)?S.calMetier:ms[0];};

function agendaAccueil(){const ms=metiersNoms();if(S.onboard>=ms.length)S.onboard=0;const m=ms[S.onboard];
 if(!S.edSem||S.edSem.metier!==m||S.edSem.enTab)S.edSem={metier:m,sem:copie(S.onboard>0?semaine(ms[S.onboard-1]):DEFAUT_SEM),erreur:null,conflits:null};
 const dernier=S.onboard>=ms.length-1;
 return `${retour('activite','Mon activité')}
 <section class="hero" style="padding:26px"><span class="forme f1"></span><span class="forme f2"></span><p style="font-weight:600;opacity:.9">Bienvenue dans votre agenda</p><h1 style="font-size:clamp(26px,4.5vw,34px)">Quand travaillez-vous d’habitude ?</h1><p>Choisissez les horaires d’une semaine normale. Les clients pourront réserver seulement pendant ces heures.</p></section>
 <div class="carte form">${ms.length>1?`<p class="doux petit" style="font-weight:700">Étape ${S.onboard+1} sur ${ms.length}</p>`:''}<h2>Vos horaires ${de_(m)}</h2><p class="doux">Déjà rempli avec des horaires courants : changez ce qui ne va pas. Un jour sans plage est fermé.</p>
 ${editeurSemaine(S.edSem)}
 <div class="btns"><button class="btn btn-1" data-act="sem-enreg">${dernier?'Enregistrer et voir mon calendrier':'Enregistrer et continuer'}</button></div>
 <p class="doux petit">Vous pourrez les changer quand vous voulez dans l’onglet « Semaine type ».</p></div>`;}

/* Calendrier */
function casePro(k,d){const m=S.calMetier,pl=heuresDuJour(m,k),passe=k<CLE_AUJ,n=rdvActifs().filter(r=>r.date===k&&r.metier===m).length;
 return `<button class="jcase${passe?' passe':''}${k===CLE_AUJ?' auj':''}"${passe?' disabled':''} data-act="jour" data-v="${k}" aria-label="${dateLongue(k)} : ${pl.length?'ouvert '+plTxt(pl):'fermé'}${n?', '+n+' rendez-vous':''}"><span class="bandes">${pl.map(p=>`<i style="left:${p[0]/14.4}%;width:${(p[1]-p[0])/14.4}%"></i>`).join('')}</span><b>${d}</b>${pl.length?`<small class="h">${plCourt(pl)}</small>`:''}${n?`<span class="nrdv">${n} rdv</span>`:''}</button>`;}
function caseClient(k,d){const l=S.rdvClient.filter(r=>r.date===k&&r.etat!=='Annulé');
 return `<button class="jcase client${l.length?(k>=CLE_AUJ?' a-rdv':' rdv-passe'):''}${k===CLE_AUJ?' auj':''}${S.jourClient===k?' choisi':''}" data-act="jour-client" data-v="${k}" aria-label="${dateLongue(k)}${l.length?', '+l.length+' rendez-vous':''}"><b>${d}</b>${l.length?`<span class="nrdv">${l.length} rdv</span>`:''}</button>`;}
function grilleMois(an,mo,client){const nb=new Date(an,mo+1,0).getDate(),dec=jIdx(new Date(an,mo,1));
 let h=`<div class="mois"><p class="mois-nom">${cap(NOMS_M[mo])} ${an}</p><div class="sem-tete">${['lun','mar','mer','jeu','ven','sam','dim'].map(x=>`<span>${x}</span>`).join('')}</div><div class="grille-j">`;
 for(let i=0;i<dec;i++)h+='<span></span>';
 for(let d=1;d<=nb;d++){const k=cle(new Date(an,mo,d));h+=client?caseClient(k,d):casePro(k,d);}
 return h+'</div></div>';}
function ligneRdvClient(r){let fin;
 if(r.etat==='Annulé')fin=puceEtat('Annulé');
 else if(r.date>=CLE_AUJ)fin=`<button class="btn btn-2 btn-petit" data-act="rc-deplacer" data-v="${r.id}">Déplacer</button><button class="btn btn-2 btn-petit" data-act="rc-annuler" data-v="${r.id}">Annuler</button>`;
 else fin=r.avis?'<span class="puce p-ok">Avis donné</span>':`<button class="btn btn-1 btn-petit" data-act="rc-avis" data-v="${r.id}">Donner mon avis</button>`;
 return `<div class="ligne ligne-rdv"><span class="heure">${hC(r.debut)}</span><div class="txt"><b>${r.quoi}</b><span>Avec ${r.avec} · ${dateCourte(r.date)}</span></div><span class="fin">${fin}</span></div>`;}
const triRdv=(a,b)=>a.date.localeCompare(b.date)||a.debut-b.debut;
/* Le mois reste dans la page ; le jour cliqué s’affiche dans une bulle fixée en bas de l’écran. */
function listeClient(an,mo){const pref=`${an}-${p2(mo+1)}`,k=S.jourClient;
 const l=S.rdvClient.filter(r=>r.date.startsWith(pref)).sort(triRdv);
 const mois=`<section class="section"><h2>Ce mois-ci</h2>${l.length?`<div class="liste">${l.map(ligneRdvClient).join('')}</div>`:'<div class="carte vide">Aucun rendez-vous ce mois-ci.</div>'}</section>`;
 if(!k)return mois;
 const j=S.rdvClient.filter(r=>r.date===k).sort(triRdv);
 return mois+`<div class="bulle-espace" aria-hidden="true"></div><aside class="bulle-jour" aria-label="Rendez-vous du ${dateLongue(k)}"><div class="bulle-tete"><h3>${cap(dateLongue(k))}</h3><button class="croix" data-act="jour-client" data-v="" aria-label="Fermer">×</button></div>${j.length?`<div class="liste">${j.map(ligneRdvClient).join('')}</div>`:'<p class="doux">Aucun rendez-vous ce jour-là.</p>'}</aside>`;}
function vueCalendrier(){const ms=metiersNoms();if(S.calMetier!=='client'&&!ms.includes(S.calMetier))S.calMetier=ms[0];
 const client=S.calMetier==='client';
 const choix=`<div class="cal-choix"><span class="doux petit" style="font-weight:700">Calendrier :</span><div class="seg seg-inline">${[...ms.map(m=>[m,m]),['client','Mes rendez-vous de client']].map(([v,t])=>`<button aria-pressed="${S.calMetier===v}" data-act="cal-metier" data-v="${esc(v)}">${esc(t)}</button>`).join('')}</div></div>`;
 const base=new Date(2026,10+S.moisDecal,1),an=base.getFullYear(),mo=base.getMonth(),suiv=new Date(an,mo+1,1),prec=new Date(an,mo-1,1);
 const pc=matchMedia('(min-width:1024px)').matches,deux=S.nbMois===2&&pc;

 const nav=`<div class="mois-nav"><button class="btn btn-2 btn-petit" data-act="mois" data-v="-1" aria-label="Mois précédent">‹ ${NOMS_M[prec.getMonth()]}</button><h2>${cap(titre)}</h2><button class="btn btn-2 btn-petit" data-act="mois" data-v="1" aria-label="Mois suivant">${NOMS_M[suiv.getMonth()]} ›</button></div>`;
 const grilles=`<div class="mois-liste${deux?' deux':''}">${grilleMois(an,mo,client)}${deux?grilleMois(suiv.getFullYear(),suiv.getMonth(),client):''}</div>`;
 if(client)return `${choix}<div class="carte cal">${barre}${nav}<p class="doux petit">Les rendez-vous que vous avez pris chez des prestataires. Cliquez sur un jour pour ne voir que lui.</p>${grilles}<div class="legende"><span><i class="lg lg-ouvert"></i>rendez-vous à venir</span><span><i class="lg lg-gris"></i>rendez-vous passé</span><span><i class="lg lg-auj"></i>aujourd’hui</span></div></div>${listeClient(an,mo)}`;
 return `${choix}<div class="carte cal">${barre}${nav}<p class="doux petit">Cliquez sur un jour pour dire quand vous êtes ouvert ce jour-là. Le reste du temps, vous êtes fermé (hachuré en rouge).</p>${grilles}<div class="legende"><span><i class="lg lg-ouvert"></i>ouvert</span><span><i class="lg lg-ferme"></i>fermé (hachuré sur les heures fermées, de 0 h à gauche à 24 h à droite)</span><span><span class="nrdv">2 rdv</span>rendez-vous</span><span><i class="lg lg-auj"></i>aujourd’hui</span></div></div>`;}

/* Fenêtres */
function ouvrirJour(k){const m=S.calMetier;S.fenetre={type:'jour',k,m,pl:copie(heuresDuJour(m,k)),erreur:null,conflits:null};dessineFenetre();}
function fenetreJour(f){const hab=semaine(f.m)[jIdx(deCle(f.k))],change=!!exc(f.m)[f.k];
 const resume=f.pl.length?`${dateCourte(f.k)}, ouvert ${plTxt(trie(f.pl))}`:`${dateCourte(f.k)}, fermé toute la journée`;
 return `<h2 id="f-titre">Horaires du ${dateLongue(f.k)}</h2><p class="doux petit" style="margin-top:-6px">Calendrier ${esc(f.m)}</p>
 <div class="bandeau b-vert">Indiquez vos heures d’OUVERTURE ce jour-là. En dehors, vous serez fermé.</div>
 <p class="doux">D’habitude : ${hab.length?plTxt(hab):'fermé'}.</p>
 ${f.pl.length?f.pl.map((p,i)=>`<div class="plage"><span>Ouvert de</span>${selHeure(p[0],'f-'+i+'-0',false,'Ouvert de')}<span>à</span>${selHeure(p[1],'f-'+i+'-1',true,'Jusqu’à')}<button class="croix" data-act="f-retire" data-v="${i}" aria-label="Retirer cette plage">×</button></div>`).join(''):'<div class="bandeau b-err">Fermé toute la journée.</div>'}
 <button class="lien-plus" data-act="f-ajout">+ Ajouter une plage</button>
 ${f.erreur?`<div class="bandeau b-err">${f.erreur}</div>`:''}${f.conflits?bandeauConflits(f.conflits,'f'):''}
 <div class="btns f-btns"><button class="btn btn-1" data-act="f-enreg">Enregistrer : ${resume}</button>${change?'<button class="btn btn-2" data-act="f-habituel">Remettre les horaires habituels</button>':''}<button class="btn btn-2" data-act="fermer-fenetre">Annuler</button></div>`;}
function enregJour(force){const f=S.fenetre,e=valider(f.pl);if(e){f.erreur=e;f.conflits=null;dessineFenetre();return;}
 f.erreur=null;const pl=trie(f.pl);
 if(!force){const c=rdvActifs().filter(r=>r.metier===f.m&&r.date===f.k&&dehors(r,pl));if(c.length){f.conflits=c;dessineFenetre();return;}}
 if(force==='annuler')f.conflits.forEach(r=>r.etat='Annulé');
 const hab=semaine(f.m)[jIdx(deCle(f.k))];
 if(JSON.stringify(pl)===JSON.stringify(trie(hab)))delete exc(f.m)[f.k];else exc(f.m)[f.k]=pl;
 S.fenetre=null;dessineFenetre();toast('Enregistré : '+(pl.length?`${dateCourte(f.k)}, ouvert ${plTxt(pl)}`:`${dateCourte(f.k)}, fermé toute la journée`));rafraichir();}
function fenetreReglages(f){const r=f.r;const sel=(c,opts)=>`<select id="r-${c}" data-champ="r-${c}">${opts.map(([v,t])=>`<option value="${v}"${r[c]===v?' selected':''}>${t}</option>`).join('')}</select>`;
 return `<h2 id="f-titre">Réglages</h2><div class="form">
 <div class="champ"><label>Quand un client réserve</label>${seg([['auto','Confirmé aussitôt'],['moi','J’accepte chaque demande']],r.confirm,'r-confirm')}</div>
 <div class="champ"><label for="r-annul">Annulation gratuite par le client jusqu’à</label>${sel('annul',[['2','2 h avant'],['12','12 h avant'],['24','24 h avant'],['48','48 h avant']])}</div>
 <div class="champ"><label>Heures de début proposées aux clients</label>${seg([['15','Tous les ¼ d’heure'],['30','Toutes les ½ heures'],['60','Toutes les heures']],r.pas,'r-pas')}</div>
 <div class="champ"><label for="r-pause">Pause après chaque rendez-vous</label>${sel('pause',[['0','Aucune'],['15','15 min'],['30','30 min'],['60','1 h']])}</div>
 <div class="champ"><label for="r-tot">Réservation au plus tôt</label>${sel('tot',[['2h','2 h avant'],['veille','La veille'],['2j','2 jours avant']])}</div>
 <div class="champ"><label for="r-tard">Réservation au plus tard</label>${sel('tard',[['1m','1 mois à l’avance'],['2m','2 mois à l’avance'],['3m','3 mois à l’avance']])}</div>
 ${S.metiersMoi.length>1?`<div class="champ"><label>Un rendez-vous dans un métier bloque mes autres calendriers</label>${seg([['oui','Oui, jamais deux rendez-vous en même temps'],['non','Non, chaque calendrier est indépendant']],r.bloque,'r-bloque')}<p class="exemple">${r.bloque==='oui'?'Ex. un rendez-vous Électricien jeudi à 14 h 00 : jeudi 14 h 00 n’est plus proposé en Plombier.':'Ex. jeudi à 14 h 00, un client peut réserver en Électricien et un autre en Plombier.'}</p></div>`:''}
 <p class="doux petit">Ces réglages valent pour tous vos métiers.</p>
 <div class="btns"><button class="btn btn-1" data-act="r-enreg">Enregistrer les réglages</button><button class="btn btn-2" data-act="fermer-fenetre">Annuler</button></div></div>`;}
function dessineFenetre(){const z=document.getElementById('modal'),f=S.fenetre;
 if(!f){z.innerHTML='';document.body.classList.remove('bloque');return;}
 const ancien=z.querySelector('.fenetre'),y=ancien?ancien.scrollTop:0,premier=!ancien;

/* Onglets Rendez-vous et Semaine type */
function vueRdv(){const l=S.rdv.filter(r=>r.date>=CLE_AUJ).sort((a,b)=>a.date.localeCompare(b.date)||a.debut-b.debut);let jour='';
 return l.length?`<div class="liste">${l.map(r=>{const t=r.date!==jour?`<p class="jour">${dateLongue(r.date)}</p>`:'';jour=r.date;
  const fin=r.etat==='En attente'?`<button class="btn btn-1 btn-petit" data-act="rdv-accepter" data-v="${r.id}">Accepter</button><button class="btn btn-2 btn-petit" data-act="rdv-refuser" data-v="${r.id}">Refuser</button>`:puceEtat(r.etat);
  return t+`<div class="ligne ligne-rdv"><span class="heure">${hC(r.debut)}</span><div class="txt"><b>${r.quoi}</b><span>${r.qui} · ${r.ville} · ${esc(r.metier)} · jusqu’à ${fmtH(r.fin)}</span></div><span class="fin">${fin}</span></div>`;}).join('')}</div>`:'<div class="carte vide">Aucun rendez-vous à venir.</div>';}

function agendaClic(a,v){
 const rc=()=>S.rdvClient.find(x=>x.id===+v),rp=()=>S.rdv.find(x=>x.id===+v);
 switch(a){
  case 'agenda-onglet':S.agendaOnglet=v;if(S.edSem&&S.edSem.enTab)S.edSem=null;rafraichir();return true;
  case 'cal-metier':S.calMetier=v;S.jourClient=null;rafraichir();return true;
  case 'sem-metier':S.calMetier=v;S.edSem=null;rafraichir();return true;
  case 'nb-mois':S.nbMois=+v;rafraichir();return true;
  case 'mois':S.moisDecal+=+v;S.jourClient=null;rafraichir();return true;
  case 'jour':ouvrirJour(v);return true;
  case 'jour-client':S.jourClient=v&&S.jourClient!==v?v:null;rafraichir();return true;
  case 'reglages-agenda':S.fenetre={type:'reglages',r:copie(S.regAgenda)};dessineFenetre();return true;
  case 'fermer-fenetre':S.fenetre=null;dessineFenetre();return true;
  case 'f-retire':S.fenetre.pl.splice(+v,1);S.fenetre.conflits=null;S.fenetre.erreur=null;dessineFenetre();return true;
  case 'f-ajout':S.fenetre.pl.push(nouvellePlageJour(S.fenetre.pl));S.fenetre.conflits=null;dessineFenetre();return true;
  case 'f-enreg':enregJour();return true;
  case 'f-annuler-rdv':enregJour('annuler');return true;
  case 'f-garder':enregJour('garder');return true;
  case 'f-habituel':{const f=S.fenetre;delete exc(f.m)[f.k];S.fenetre=null;dessineFenetre();toast('Horaires habituels remis le '+dateCourte(f.k));rafraichir();return true;}
  case 'r-confirm':case 'r-pas':case 'r-bloque':S.fenetre.r[a.slice(2)]=v;dessineFenetre();return true;
  case 'r-enreg':S.regAgenda=S.fenetre.r;S.fenetre=null;dessineFenetre();toast('Réglages enregistrés.');return true;
  case 's-ajout':{const pl=S.edSem.sem[+v];pl.push(nouvellePlageSem(pl));S.edSem.conflits=null;S.edSem.erreur=null;rafraichir();return true;}
  case 's-retire':{const [j,k]=v.split('-').map(Number);S.edSem.sem[j].splice(k,1);S.edSem.conflits=null;S.edSem.erreur=null;rafraichir();return true;}
  case 'sem-changer':{const m=metierSemaine();S.edSem={metier:m,sem:copie(semaine(m)),erreur:null,conflits:null,enTab:true};rafraichir();return true;}
  case 'sem-annuler':S.edSem=null;rafraichir();return true;
  case 'sem-enreg':case 's-annuler-rdv':case 's-garder':{
   const ok=enregistrerSemaine(a==='s-annuler-rdv'?'annuler':a==='s-garder'?'garder':null);
   if(!ok){rafraichir();return true;}
   S.edSem=null;toast('Semaine type enregistrée.');
   if(!S.agendaPret){const ms=metiersNoms();if(S.onboard<ms.length-1)S.onboard++;else{S.agendaPret=true;S.onboard=0;S.agendaOnglet='cal';S.calMetier=ms[0];}rendu();scrollTo({top:0,behavior:'instant'});}
   else rafraichir();
   return true;}
  case 'agenda-reset':S.agendaPret=false;S.onboard=0;S.edSem=null;rendu();scrollTo({top:0,behavior:'instant'});return true;
  case 'rdv-accepter':rp().etat='Confirmé';toast('Rendez-vous accepté : '+rp().qui+' est prévenu.');rafraichir();return true;
  case 'rdv-refuser':rp().etat='Refusé';toast('Demande refusée : '+rp().qui+' est prévenu.');rafraichir();return true;
  case 'rc-annuler':rc().etat='Annulé';toast('Rendez-vous annulé : '+rc().avec+' est prévenue.');rafraichir();return true;
  case 'rc-avis':rc().avis=true;toast('Merci ! Votre avis est publié.');rafraichir();return true;
  case 'rc-deplacer':aller('prestataire-'+rc().pid);return true;
 }
 return false;}

function profilClic(a,v){
 switch(a){
  case 'profil-onglet':S.profilOnglet=v;S.profilOuvert=null;rafraichir();return true;
  case 'dep':S.profilOuvert=S.profilOuvert===v?null:v;S.fermerConfirm=false;rafraichir();return true;
  case 'bulle-metier':S.profilOnglet='activite';S.profilOuvert='metiers';rafraichir();return true;
  case 'ajout-metier':S.fenetre={type:'ajout-metier',nom:'',prix:40};dessineFenetre();return true;
  case 'am-ok':{const f=S.fenetre,nom=(document.getElementById('am-nom').value||'').trim(),prix=Math.max(1,+document.getElementById('am-prix').value||40);f.nom=nom;f.prix=prix;
   if(!nom){f.erreur='Écrivez le métier à ajouter.';dessineFenetre();return true;}
   const n=cap(nom);if(S.metiersMoi.some(m=>m[0].toLowerCase()===n.toLowerCase())){f.erreur=`Vous avez déjà « ${esc(n)} ».`;dessineFenetre();return true;}
   S.metiersMoi.push([n,prix]);S.alertes[n]=true;S.fenetre=null;dessineFenetre();toast(n+' ajouté à vos métiers.');rafraichir();return true;}
  case 'arret':S.fenetre={type:'arret',m:v,date:CLE_AUJ};dessineFenetre();return true;
  case 'ar-ok':{const f=S.fenetre;S.arrets[f.m]=f.date;S.fenetre=null;dessineFenetre();toast(f.m+' : dernier jour le '+dateCourte(f.date)+'.');rafraichir();return true;}
  case 'arret-retirer':delete S.arrets[v];toast('Date d’arrêt retirée : '+v+' continue.');rafraichir();return true;
  case 'photo':S.fenetre={type:'photo',i:+v};dessineFenetre();return true;
  case 'photo-retirer':S.photos.splice(S.fenetre.i,1);S.fenetre=null;dessineFenetre();toast('Photo retirée.');rafraichir();return true;
  case 'modif-profil':S.fenetre={type:'modif-profil'};dessineFenetre();return true;
  case 'carte-bancaire':S.carteBancaire=!S.carteBancaire;toast(S.carteBancaire?'Paiement par carte activé.':'Paiement par carte désactivé.');rafraichir();return true;
  case 'visible':S.visible=!S.visible;toast(S.visible?'Vous apparaissez de nouveau dans les recherches.':'Votre page est en pause.');rafraichir();return true;
  case 'fermer-demande':S.fermerConfirm=true;rafraichir();return true;
  case 'fermer-non':S.fermerConfirm=false;rafraichir();return true;
  case 'fermer-oui':S.fermerConfirm=false;S.profilOuvert=null;toast('Maquette : rien n’est effacé.');rafraichir();return true;
 }
 return false;}

/* ================= Rendu ================= */
const PUBLIQUES=['accueil','trouver','demandes','demandes-pres','prestataire','connexion'];
const PARENT={prestataire:'trouver',conversation:'messages','demandes-pres':'demandes','mes-demandes':'demandes','nouvelle-demande':'demandes',agenda:'activite',devis:'activite',factures:'activite',paiements:'activite',clients:'activite',avis:'activite','carte-visite':'activite',urssaf:'activite','auto-entreprise':'activite',profil:'moi',abonnements:'moi',parametres:'moi','page-publique':'moi'};
function route(){const h=(location.hash||'#accueil').slice(1);const m=h.match(/^(prestataire|conversation)-(\d+)$/);return m?{nom:m[1],arg:m[2]}:{nom:PAGES[h]?h:'accueil',arg:null};}
function dessineEntete(r){
 const sect=PARENT[r.nom]||r.nom;
 const liens=[['accueil','accueil','Accueil'],['trouver','trouver','Trouver'],['demandes','demandes','Demandes'],['messages','messages','Messages',nonLus()],['activite','activite','Mon activité']];
 document.getElementById('nav').innerHTML=S.connecte?liens.map(([v,i,t,n])=>`<a href="#${v}" class="${sect===v?'actif':''}">${ic(i)}${t}${n?`<span class="badge">${n}</span>`:''}</a>`).join(''):liens.slice(0,3).map(([v,i,t])=>`<a href="#${v}" class="${sect===v?'actif':''}">${ic(i)}${t}</a>`).join('');
 document.getElementById('basbar').innerHTML=[...liens,['moi','moi','Moi']].map(([v,i,t,n])=>`<a href="#${S.connecte||PUBLIQUES.includes(v)?v:'connexion'}" class="${sect===v?'actif':''}">${ic(i)}${t==='Mon activité'?'Activité':t}${n&&S.connecte?`<span class="badge">${n}</span>`:''}</a>`).join('');
 document.getElementById('compte').innerHTML=S.connecte?`<button class="compte-btn" data-act="menu" aria-expanded="${S.menu}">${av('Karim',MOI.couleur)}Karim</button>${S.menu?`<div class="menu"><a href="#profil">${ic('moi')}Mon profil</a><a href="#abonnements">${ic('coeur')}Mes abonnements</a><a href="#parametres">${ic('reglages')}Paramètres</a><hr><button data-act="deconnexion">${ic('sortir')}Se déconnecter</button></div>`:''}`:`<a class="btn btn-1 btn-petit" href="#connexion">Se connecter</a>`;
}
let derniere='';
function rendu(){
 let r=route();
 if(!S.connecte&&!PUBLIQUES.includes(r.nom))r={nom:'connexion',arg:null};
 S.menu=false;dessineEntete(r);
 if(S.fenetre){S.fenetre=null;dessineFenetre();}
 const app=document.getElementById('app');
 app.classList.toggle('large',r.nom==='agenda');
 app.classList.toggle('etroit',r.nom==='profil'||r.nom==='prestataire'||r.nom==='page-publique');
 app.innerHTML=r.nom==='connexion'?PAGES.connexion():`<div class="page">${PAGES[r.nom](r.arg)}</div>`;
 const cle=r.nom+(r.arg||'');if(cle!==derniere){scrollTo({top:0,behavior:'instant'});derniere=cle;}
 if(r.nom==='conversation'){const f=document.getElementById('fil');f&&f.lastElementChild&&f.lastElementChild.scrollIntoView({block:'nearest'});}
}
function rafraichir(){const y=scrollY;rendu();scrollTo({top:y,behavior:'instant'});}
function aller(h){if(location.hash==='#'+h)rendu();else location.hash=h;}

/* Thème : « Automatique » rend la main au réglage de l’appareil (ou de l’hôte). */
const themeHote=document.documentElement.getAttribute('data-theme');
function appliqueTheme(){if(S.theme==='auto'){themeHote?document.documentElement.setAttribute('data-theme',themeHote):document.documentElement.removeAttribute('data-theme');}else document.documentElement.setAttribute('data-theme',S.theme);}
try{const t=localStorage.getItem('rafals-theme');if(t==='light'||t==='dark'||t==='auto')S.theme=t;}catch(e){}
appliqueTheme();

/* ================= Actions ================= */
document.addEventListener('click',e=>{
 if(e.target.matches('[data-voile]')){S.fenetre=null;dessineFenetre();return;}
 const b=e.target.closest('[data-act]');
 if(!b){if(S.menu&&!e.target.closest('.compte')){S.menu=false;dessineEntete(route());}return;}
 const a=b.dataset.act,v=b.dataset.v;
 if(agendaClic(a,v)||profilClic(a,v)||demandeClic(a,v))return;
 switch(a){
  case 'menu':S.menu=!S.menu;dessineEntete(route());break;
  case 'metier':S.metier=v;rafraichir();break;
  case 'metier-accueil':S.metier=v;S.recherche='';aller('trouver');break;
  case 'ailleurs-ouvrir':S.fenetre={type:'ailleurs'};dessineFenetre();break;
  case 'ailleurs-retirer':{const a=S.ailleurs.splice(+v,1)[0];
   /* Décision de Raphael du 09/11/2026 : la barre revient si le total redescend sous le seuil ET qu'aucun devis ni facture avec TVA n'a été envoyé depuis l'activation */
   if(S.tvaActive&&totalAnnee()<SEUIL_TVA){if(S.tvaFactureEnvoyee)toast(euros(a.m)+' retirés. Vous avez déjà facturé la TVA : elle reste activée.');else{S.tvaActive=false;toast(euros(a.m)+' retirés. Vous êtes sous le seuil : la TVA est désactivée.');}}
   else toast(euros(a.m)+' retirés.');
   rafraichir();break;}
  case 'vers-rdv':S.agendaOnglet='rdv';break;
  case 'vers-avis':{const z=document.getElementById('pp-avis');z&&z.scrollIntoView({behavior:'smooth',block:'start'});break;}
  case 'signaler':toast('Dans le vrai site, une fenêtre s’ouvre pour expliquer ce qui ne va pas. L’administrateur regarde.');break;
  case 'suivre':{const id=+v;if(S.abonnes.has(id)){S.abonnes.delete(id);toast('Vous ne suivez plus '+presta(id).nom);}else{S.abonnes.add(id);toast('Abonné : vous serez prévenu des créneaux libres de '+presta(id).nom);}rafraichir();break;}
  case 'ecrire':{const p=presta(+v);let c=S.convs.find(x=>x.avec===p.nom);if(!c){c={id:S.convs.length+1,avec:p.nom,couleur:p.couleur,nonLu:false,msgs:[]};S.convs.unshift(c);}aller('conversation-'+c.id);break;}
  case 'ecrire-client':{let c=S.convs.find(x=>x.avec===v);if(!c){const cl=CLIENTS.find(x=>x[0]===v);c={id:S.convs.length+1,avec:v,couleur:cl?cl[4]:'#555',nonLu:false,msgs:[]};S.convs.unshift(c);}aller('conversation-'+c.id);break;}
  case 'creneau':S.creneauChoisi=S.creneauChoisi===v?null:v;rafraichir();break;
  case 'reserver':{const p=presta(+v);const c=p.creneaux[+S.creneauChoisi.split('-')[1]];S.creneauChoisi=null;toast('Demande envoyée à '+p.nom+' pour '+c);rafraichir();break;}
  case 'devis-filtre':S.devisOnglet=v;rafraichir();break;
  case 'pdf':toast(v==='carte'||v==='carte seule'?'Dans le vrai site, le PDF de la carte se télécharge ici.':'Dans le vrai site, la facture '+v+' se télécharge en PDF.');break;
  case 'couleur':S.couleurCarte=+v;rafraichir();break;
  case 'muet':{const id=+v;S.muets.has(id)?S.muets.delete(id):S.muets.add(id);toast(S.muets.has(id)?presta(id).nom+' est muet : vous ne recevez plus rien.':'Vous recevez de nouveau les nouvelles de '+presta(id).nom);rafraichir();break;}
  case 'theme':S.theme=v;try{localStorage.setItem('rafals-theme',v);}catch(err){}appliqueTheme();toast('Enregistré');rafraichir();break;
  case 'mail':S.mail=v;toast('Enregistré');rafraichir();break;
  case 'telephone':S.telephone=!S.telephone;toast(S.telephone?'Notifications activées sur ce téléphone':'Notifications coupées sur ce téléphone');rafraichir();break;
  case 'alerte':S.alertes[v]=S.alertes[v]===false;toast('Enregistré');rafraichir();break;
  case 'retirer-metier':{if(S.metiersMoi.length<=1){toast('Gardez au moins un métier.');break;}const m=S.metiersMoi.splice(+v,1)[0];toast(m[0]+' retiré');rafraichir();break;}
  case 'deconnexion':S.connecte=false;S.menu=false;aller('connexion');break;
  default:
   if(a.startsWith('notif-')){const k=a.slice(6);S.notif[k]=!S.notif[k];toast('Enregistré');rafraichir();}
 }
});
document.addEventListener('submit',e=>{
 const f=e.target;const t=f.dataset.form;if(!t)return;e.preventDefault();
 if(t==='chercher'){S.recherche=f.q.value;S.metier='Tous';aller('trouver');}
 else if(t==='message'){const txt=f.t.value.trim();if(!txt)return;const c=S.convs.find(x=>x.id===+f.dataset.v);c.msgs.push(['moi',txt,'À l’instant']);rafraichir();const input=document.getElementById('msg-'+c.id);input&&input.focus();
  if(!c.repondu){c.repondu=true;setTimeout(()=>{c.msgs.push(['eux','Merci, je regarde et je vous réponds vite !','À l’instant']);if(route().nom==='conversation'&&route().arg==String(c.id)){rafraichir();const i=document.getElementById('msg-'+c.id);i&&i.focus();}else{c.nonLu=true;dessineEntete(route());}},1400);}}
 else if(t==='demande'){if(!metierDmd()){S.dmdChoix=true;majZoneMetier();toast('Choisissez le métier : nous ne l’avons pas reconnu.');return;}S.mesDemandes.unshift({id:Date.now(),titre:f.titre.value.trim(),metier:metierDmd(),ville:f.ville.value.trim(),quand:f.quand.value,desc:f.desc.value.trim(),date:'08/11/2026',etat:'ouverte',fin:'08/12/2026',reponses:[]});toast('Demande publiée. Les prestataires près de chez vous sont prévenus.');aller('mes-demandes');}
 else if(t==='infos'){S.infos={mail:f.mail.value.trim(),tel:f.tel.value.trim()};toast('Informations enregistrées.');rafraichir();}
 else if(t==='adresse'){S.adresse=f.adr.value.trim();toast('Adresse enregistrée.');rafraichir();}
 else if(t==='modif-profil'){S.bio=f.bio.value.trim();S.ville=f.ville.value.trim();S.fenetre=null;dessineFenetre();toast('Profil enregistré.');rafraichir();}
 else if(t==='ailleurs'){const m=parseFloat(String(f.m.value).replace(/\s/g,'').replace(',','.'));const err=document.getElementById('ai-err');
  if(!(m>0)){err.textContent='Écrivez un montant, ex. 2000 ou 45,50.';err.hidden=false;return;}
  if(!f.d.value||f.d.value>CLE_AUJ){err.textContent='Choisissez une date de cette année, pas encore à venir.';err.hidden=false;return;}
  S.ailleurs.push({m,d:f.d.value});S.ailleurs.sort((a,b)=>a.d<b.d?-1:1);S.fenetre=null;dessineFenetre();
  if(!S.tvaActive&&totalAnnee()>=SEUIL_TVA){S.tvaActive=true;toast('Barre pleine : votre TVA est activée pour vos prochains devis et factures.');}else toast(euros(m)+' ajoutés.');
  rafraichir();}
 else if(t==='modif-demande'){const d=trouveDmd(S.fenetre.id);d.titre=f.titre.value.trim();d.desc=f.desc.value.trim();d.quand=f.quand.value;S.fenetre=null;dessineFenetre();toast('Demande modifiée.');rafraichir();}
 else if(t==='connexion'){S.connecte=true;toast('Bonjour Karim !');aller('accueil');}
 else if(t==='metier'){if(!f.nom.value){toast('Vous avez déjà tous les métiers.');return;}const p=Math.max(1,+f.prix.value||40);S.metiersMoi.push([f.nom.value,p]);toast(f.nom.value+' ajouté');rafraichir();}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='d-titre'||t.id==='d-desc'){const f=t.form;S.dmdTexte=f.titre.value+' '+f.desc.value;S.dmdDevine=devineMetier(S.dmdTexte);majZoneMetier();}
 else if(t.id==='q-trouver'){S.recherche=t.value;document.getElementById('resultats').innerHTML=resultats();}
 else if(t.id==='phrase'){S.phraseCarte=t.value;document.getElementById('cv-phrase').textContent=t.value;}
 else if(t.id==='ca'){S.ca=Math.max(0,+t.value||0);document.getElementById('cotis').textContent=euros(S.ca*0.212);}
 else if(t.id==='am-nom'){const n=t.value.trim();document.getElementById('am-ok').textContent=n?'Ajouter '+cap(n):'Ajouter';}
 else if(t.id==='zone'){S.zone=+t.value;document.getElementById('zone-val').textContent=S.zone+' km';document.getElementById('zone-ex').textContent=S.zone<10?'Nantes seulement.':S.zone<20?'Ex. Rezé, Orvault, Saint-Herblain.':'Ex. jusqu’à Clisson ou Ancenis.';}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.fenetre){S.fenetre=null;dessineFenetre();}else if(S.menu){S.menu=false;dessineEntete(route());}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='f-avatar'||t.id==='f-photo'){const fi=t.files&&t.files[0];if(!fi)return;
  if(!/^image\/(png|jpeg)$/.test(fi.type)){toast('Choisissez une photo JPG ou PNG.');return;}
  if(fi.size>5e6){toast('Cette photo dépasse 5 Mo : choisissez-en une plus légère.');return;}
  const lr=new FileReader();lr.onload=()=>{if(t.id==='f-avatar'){S.avatar=lr.result;toast('Photo changée.');}else{S.photos.push({src:lr.result});toast('Photo ajoutée.');}rafraichir();};lr.readAsDataURL(fi);return;}
 if(t.id==='d-metier-choix'){S.dmdForce=t.value||null;return;}
 if(t.id==='ar-date'&&S.fenetre){if(t.value&&t.value>=CLE_AUJ){S.fenetre.date=t.value;document.getElementById('ar-ok').textContent='Arrêter '+S.fenetre.m+' après le '+dateCourte(t.value);}return;}
 const c=t.dataset.champ;if(!c)return;
 if(c.startsWith('f-')&&S.fenetre){const [,i,b]=c.split('-');S.fenetre.pl[+i][+b]=+e.target.value;S.fenetre.erreur=null;S.fenetre.conflits=null;dessineFenetre();}
 else if(c.startsWith('s-')&&S.edSem){const [,j,k,b]=c.split('-');S.edSem.sem[+j][+k][+b]=+e.target.value;}
 else if(c.startsWith('r-')&&S.fenetre){S.fenetre.r[c.slice(2)]=e.target.value;}
});
let largeurPc=matchMedia('(min-width:1024px)').matches;
addEventListener('resize',()=>{const pc=matchMedia('(min-width:1024px)').matches;if(pc!==largeurPc){largeurPc=pc;if(route().nom==='agenda'&&S.agendaPret&&S.agendaOnglet==='cal'&&!S.fenetre)rafraichir();}});
addEventListener('hashchange',rendu);
rendu();
</script>
