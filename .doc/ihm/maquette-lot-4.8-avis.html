<title>Maquette rafals avis</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:36px;padding:6px 12px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-att{background:var(--att-doux);color:var(--att)}
.note{font-size:13.5px;color:var(--doux);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-att{background:var(--att-doux);color:var(--att)} .a-err{background:var(--err-doux);color:var(--err)}
.etoiles{color:var(--accent);font-size:18px;letter-spacing:1px}
.choix-etoiles{display:flex;gap:4px} .choix-etoiles button{font-size:30px;border:0;background:none;cursor:pointer;color:var(--bord);padding:0 2px;min-height:42px} .choix-etoiles button.on{color:var(--accent)}
.avis{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--bord);padding-top:12px}
.avis:first-of-type{border-top:0;padding-top:0}
.reponse{margin-left:18px;border-left:3px solid var(--prim-doux);padding:4px 10px;font-size:14px}
.rdv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bord);padding-top:14px}
.rdv:first-of-type{border-top:0;padding-top:0}
.monavis{background:var(--fond);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap} .grosse{font-size:34px;font-weight:700}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.compteur{margin-left:4px;background:var(--accent);color:var(--sur);border-radius:999px;padding:1px 7px;font-size:12px}
.mots{display:flex;flex-wrap:wrap;gap:6px} .mot{display:inline-flex;align-items:center;gap:6px;background:var(--neu-doux);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px} .mot button{border:0;background:var(--surface);color:var(--err);border-radius:999px;width:24px;height:24px;cursor:pointer;font-weight:700}
input,textarea{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
textarea{min-height:100px}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
</style>

<div class="bandeau"><b>Maquette lot 4.8</b> · écrans :
  <button class="onglet" data-e="client" aria-pressed="true">1. Mes rendez-vous (client)</button>
  <button class="onglet" data-e="public">2. Page publique</button>
  <button class="onglet" data-e="presta">3. Mon agenda › Rendez-vous</button>
  <button class="onglet" data-e="admin">4. Administration › Avis</button>
  <button class="onglet" data-e="mots">5. Administration › Mots interdits</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const E = {};
const rdv = (titre, quand, avec, extra) => '<div class="rdv"><div class="tete"><h3>' + titre + '</h3><span class="badge b-neu">passé</span></div><p style="margin:0;font-weight:600">' + quand + '</p><p class="note">' + avec + '</p>' + extra + '</div>';
E.client = () => '<h1>Mes rendez-vous</h1><div class="sous-onglets"><button>À venir</button><button aria-pressed="true">Passés et annulés</button></div><div class="carte">' +
  rdv('Coupe femme', 'Mardi 13/10/2026, 10 h 00 – 10 h 45', 'Avec Léa Martin · 35 €', '<div class="actions"><button class="btn prim petit" data-fen="noter">Donner mon avis</button><span class="note">Jusqu\'au 12/11/2026.</span></div>') +
  rdv('Dépannage fuite', 'Lundi 05/10/2026, 9 h 00 – 11 h 00', 'Avec Karim Benali · 50 €', '<div class="monavis"><span class="etoiles">★★☆☆☆</span><span><b>Votre avis :</b> En retard d\'une heure, sinon travail correct.</span><div class="reponse"><b>Réponse de Karim :</b> Bouchon sur la rocade, j\'avais prévenu par SMS.</div><div class="actions"><button class="btn sec petit" data-fen="noter">Modifier</button><button class="btn dan petit" data-toast="Avis retiré : il n\'est plus affiché.">Retirer</button><span class="note">Modifiable jusqu\'au 04/11/2026.</span></div></div>') +
  rdv('Ménage 2 h', 'Jeudi 01/10/2026, 9 h 00 – 11 h 00', 'Avec Julie Leroy · 50 €', '<div class="monavis"><span class="etoiles">★☆☆☆☆</span><div class="alerte a-err">Avis caché par rafals : « Accusation grave sans élément ».</div></div>') +
  '</div><p class="note">« Donner mon avis » : seulement après un rendez-vous tenu (sans absence), pendant 30 jours.</p>';
E.public = () => '<div class="carte"><div class="tete"><h1 style="font-size:26px">Karim Benali</h1></div><p class="note">★ 4,2 (30 avis) · Plombier · Part de Pessac</p><p class="note">(profil et annonces : inchangés)</p></div>' +
  '<div class="carte"><h2>Avis</h2><div class="resume"><span class="grosse">4,2</span><div><div class="etoiles">★★★★☆</div><span class="note">30 avis de clients ayant eu un rendez-vous</span></div></div>' +
  '<div class="avis"><span class="etoiles">★★★★★</span><span><b>Marie D.</b> <span class="note">· octobre 2026</span></span><span>Ponctuel et soigneux, je recommande.</span></div>' +
  '<div class="avis"><span class="etoiles">★★☆☆☆</span><span><b>Paul P.</b> <span class="note">· octobre 2026</span></span><span>En retard d\'une heure, sinon travail correct.</span><div class="reponse"><b>Réponse de Karim :</b> Bouchon sur la rocade, j\'avais prévenu par SMS.</div></div>' +
  '<div class="avis"><span class="etoiles">★★★★☆</span><span><b>Client ayant quitté rafals</b> <span class="note">· septembre 2026</span></span><span>Bon travail.</span></div>' +
  '<div><button class="btn sec petit">Voir plus d\'avis</button></div></div><p class="note">Sans avis : « Pas encore d\'avis. » Les résultats de recherche montrent aussi « ★ 4,2 (30 avis) ».</p>';
E.presta = () => '<h1>Mon agenda</h1><div class="sous-onglets"><button>Calendrier</button><button aria-pressed="true">Rendez-vous</button><button>Semaine type</button><button>Réglages</button><button>Horaires libres</button></div>' +
  '<details class="carte" open><summary style="font-weight:700;cursor:pointer">Passés et annulés</summary>' +
  rdv('Dépannage fuite', 'Lundi 05/10/2026, 9 h 00 – 11 h 00', 'Client : Paul Petit', '<div class="monavis"><span class="etoiles">★★☆☆☆</span><span><b>Avis de Paul P. :</b> En retard d\'une heure, sinon travail correct.</span><div class="actions"><button class="btn sec petit" data-fen="repondre">Répondre…</button><button class="btn dan petit" data-fen="signaler">Signaler…</button></div></div>') +
  rdv('Chauffe-eau', 'Jeudi 01/10/2026, 14 h 00 – 16 h 00', 'Client : Marie Dupont', '<div class="monavis"><span class="etoiles">★☆☆☆☆</span><span><b>Avis de Marie D. :</b> Il m\'a volé un bijou.</span><div class="alerte a-att">Signalé le 02/10 : l\'administrateur va le regarder.</div></div>') +
  '</details>';
E.admin = () => '<h1>Administration</h1><div class="sous-onglets"><button>Accords</button><button>Comptes</button><button>Prestataires</button><button>Absences contestées</button><button aria-pressed="true">Avis signalés<span class="compteur">1</span></button><button>Mots interdits</button><button>Propositions</button><button>Métiers</button></div>' +
  '<div class="carte"><div class="tete"><h3>Avis sur Karim Benali</h3><span class="badge b-att">signalé</span></div><span class="etoiles">★☆☆☆☆</span><span><b>Marie D.</b> <span class="note">· octobre 2026</span> : « Il m\'a volé un bijou. »</span><div class="alerte a-att">Signalé par Karim le 02/10/2026 : « Fausse accusation »</div>' +
  '<div class="actions"><button class="btn sec" data-toast="Avis laissé : le signalement est traité.">Le laisser</button><button class="btn dan" data-fen="cacher">Le cacher…</button></div></div><p class="note">Vide : « Aucun avis signalé. »</p>';
E.mots = () => '<h1>Administration</h1><div class="sous-onglets"><button>…</button><button>Avis signalés</button><button aria-pressed="true">Mots interdits</button><button>…</button></div>' +
  '<div class="carte"><h2>Mots interdits (50)</h2><p class="note">Un avis ou une réponse qui contient un de ces mots (mot entier, sans tenir compte des accents ni des majuscules) est refusé à l\'envoi.</p>' +
  '<div class="actions"><input placeholder="ex. abruti" style="max-width:240px"><button class="btn prim" data-toast="« abruti » ajouté à la liste.">Ajouter</button></div>' +
  '<div class="mots">' + ['abruti','batard','bouffon','con','connard','cretin','debile','encule','enfoire','merde','…'].map(m => '<span class="mot">' + m + '<button title="Retirer">×</button></span>').join('') + '</div></div>';
const F = {
  noter: '<h3>Votre avis sur Léa Martin</h3><p class="note">Coupe femme, mardi 13/10/2026.</p><span style="font-weight:600;font-size:13px">Note *</span><div class="choix-etoiles">' + [1,2,3,4,5].map(n => '<button data-etoile="' + n + '" class="' + (n <= 4 ? 'on' : '') + '">★</button>').join('') + '</div><span style="font-weight:600;font-size:13px">Votre avis *</span><textarea placeholder="ex. Ponctuelle et soigneuse, je recommande."></textarea><p class="note" style="display:flex;justify-content:space-between"><span>De 10 à 1000 caractères. Signé « Marie D. ».</span><span>0 / 1000</span></p><div class="alerte a-err" hidden id="err">Votre avis contient un mot interdit : reformulez-le, s\'il vous plaît.</div><div class="pied"><button class="btn prim" data-close data-toast="Merci : votre avis est publié.">Publier mon avis</button><button class="btn sec" data-close>Annuler</button></div>',
  repondre: '<h3>Répondre à Paul P.</h3><p class="note">Votre réponse sera affichée sous l\'avis, pour tous. Une seule réponse ; la note ne change pas.</p><textarea placeholder="ex. Bouchon sur la rocade, j\'avais prévenu par SMS."></textarea><div class="pied"><button class="btn prim" data-close data-toast="Réponse publiée.">Publier ma réponse</button><button class="btn sec" data-close>Annuler</button></div>',
  signaler: '<h3>Signaler cet avis ?</h3><p class="note">L\'administrateur de rafals le lira ; l\'avis reste affiché en attendant.</p><input placeholder="Pourquoi ? ex. Fausse accusation, contient mon numéro…"><div class="pied"><button class="btn dan" data-close data-toast="Avis signalé : l\'administrateur va le regarder.">Signaler</button><button class="btn sec" data-close>Annuler</button></div>',
  cacher: '<h3>Cacher cet avis ?</h3><p class="note">Il ne sera plus affiché et sa note ne comptera plus. Le motif est envoyé au client. Rien n\'est effacé.</p><input placeholder="Motif * ex. Accusation grave sans élément"><div class="pied"><button class="btn dan" data-close data-toast="Avis caché : le client est prévenu.">Cacher</button><button class="btn sec" data-close>Annuler</button></div>',
};
let etat = 'client', m;
function rendre() { document.getElementById('ecran').innerHTML = E[etat](); document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat)); window.scrollTo(0, 0); }
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(m); m = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const s = ev.target.closest('[data-etoile]'); if (s) { const n = +s.dataset.etoile; s.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.etoile <= n)); return; }
  const el = ev.target.closest('[data-e],[data-fen],[data-close],[data-toast]'); if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
  if (el.dataset.e) { etat = el.dataset.e; rendre(); }
  if (el.dataset.toast) toast(el.dataset.toast);
});
rendre();
</script>
