<title>Trois styles pour rafals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700;800&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Trois directions pour l'accueil, sur le même contenu. Un seul thème clair, voulu : on compare des styles, pas des modes. */
:root{
  --vert:#2F6B4F;--fonce:#1F4D38;--vif:#5FD38A;--orange:#E8863F;--encre:#16211B;--doux:#5B6A60;--trait:#DDE3DE;
  --ombre:0 8px 28px rgba(31,77,56,.10);
  --marque:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --base:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:#fff;color:var(--encre);font:400 16px/1.5 var(--base)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.in{max-width:1120px;margin:auto;padding-inline:20px}
.t-vert{background:#D8ECDF;color:#1F4D38}.t-orange{background:#FBE7D8;color:#7A3A0E}.t-bleu{background:#DCEAF7;color:#1D4A72}.t-violet{background:#E8E1F6;color:#49317F}.t-jaune{background:#FBEBC6;color:#6E4300}
svg.scene{width:100%;height:100%;display:block}

/* Bandeau de la maquette */
.maq{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--encre);color:#fff;padding:10px 16px}
.maq-in{max-width:1120px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.maq p{flex:1 1 280px;font-size:14.5px;color:#D5E6DC}
.seg{display:flex;background:#2A3830;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:#fff;font-weight:700;padding:0 14px;border-radius:9px;min-height:40px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--encre)}

/* Communs */
.h .in{display:flex;align-items:center;gap:6px}
.logo{font:800 28px/1 var(--marque);color:var(--vert);margin-right:auto;letter-spacing:-.02em}
.logo i{color:var(--orange);font-style:normal}
.h nav{display:flex;gap:2px}
.h nav button{border:0;background:none;font-weight:700;padding:0 13px;min-height:42px;border-radius:99px;white-space:nowrap}
.pt{background:#B3261E;color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:2px}
.cpt{display:flex;align-items:center;gap:8px;font-weight:700;border:0;background:none;min-height:42px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.av.pt2{width:30px;height:30px;font-size:11.5px}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--trait);background:none;font-size:20px}
@media (max-width:939px){.h nav{display:none}.burger{display:block}.cpt span:last-child{display:none}}
.rech{display:flex;align-items:center;gap:10px}
.rech input{flex:1;min-width:0;border:0;outline:0;background:none;min-height:48px}
.cols{display:grid;gap:32px;padding-top:36px}
.cols>*{min-width:0}
@media (min-width:940px){.cols{grid-template-columns:1fr 360px;align-items:start}.pub{position:sticky;top:84px}}
@media (max-width:939px){.cols .pub{order:-1}}
.tete{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:16px}
.tete span{color:var(--doux);font-size:14.5px}
.liste{display:flex;flex-direction:column;gap:16px}
.vide{padding:24px;border:2px dashed var(--trait);border-radius:20px;color:var(--doux)}
.pub{display:flex;flex-direction:column;gap:14px}
.pub label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.pub textarea,.pub input{border:0;padding:12px 14px;min-height:48px;font-weight:400;font-size:16px;width:100%;background:#fff;color:var(--encre)}
.pub textarea{min-height:116px;resize:vertical}
.pub .photo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;background:none;border:0;padding:0;min-height:42px;text-align:left}
.pub .photo span{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;border:2px dashed currentColor}
.pub small{font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;background:var(--encre);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;max-width:calc(100% - 32px);text-align:center}

/* ============ A. Chaleureux ============ */
.sA{background:#F1F7F2;font-family:"Nunito",var(--base);padding-bottom:72px}
.sA .h{padding-block:14px}
.sA .h nav button[aria-current]{background:#fff;color:var(--vert);box-shadow:var(--ombre)}
.sA .hero{display:grid;gap:20px;align-items:center;padding-block:20px 12px}
@media (min-width:900px){.sA .hero{grid-template-columns:1.1fr .9fr}}
.sA .hero>*{min-width:0}
.sA h1{font:900 clamp(36px,5.6vw,60px)/1.04 "Nunito",var(--base);letter-spacing:-.02em}
.sA h1 em{font-style:normal;color:var(--vert)}
.sA .sous{font-size:19px;color:var(--doux);margin-top:12px;max-width:42ch}
.sA .rech{background:#fff;border-radius:99px;padding:6px 6px 6px 22px;box-shadow:var(--ombre);max-width:520px;margin-top:22px}
.sA .rech button{width:50px;height:50px;border-radius:50%;border:0;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.sA .dessin{max-width:440px;justify-self:center;width:100%}
.sA .cats{display:flex;gap:22px;overflow-x:auto;padding:10px 4px 14px}
.sA .cats button{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;font-weight:800;min-width:76px}
.sA .cats .b{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:4px solid #F1F7F2}
.sA .cats .b .ic{width:30px;height:30px}
.sA .cats button[aria-pressed="true"] .b{box-shadow:0 0 0 3px var(--vert)}
.sA h2{font:900 26px/1.15 "Nunito",var(--base)}
.cA{background:#fff;border-radius:26px;padding:22px;box-shadow:var(--ombre);display:flex;flex-direction:column;gap:14px}
.cA .top{display:flex;align-items:center;gap:12px}
.cA .top>div{margin-right:auto;line-height:1.3;min-width:0}
.cA .top small{display:block;color:var(--doux);font-size:14px}
.cA .bud{background:var(--vert);color:#fff;font-weight:900;padding:6px 15px;border-radius:99px;font-size:17px;white-space:nowrap}
.cA .bud.libre{background:#F1F7F2;color:var(--vert);font-size:14px}
.cA .mid{display:grid;grid-template-columns:1fr 116px;gap:16px;align-items:start}
.cA .mid>div{min-width:0}
.cA h3{font:900 21px/1.2 "Nunito",var(--base);margin-bottom:4px}
.cA p{color:var(--doux)}
.cA .img{border-radius:18px;overflow:hidden;aspect-ratio:1}
.cA .bot{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cA .chip{display:inline-flex;gap:6px;align-items:center;background:#F1F7F2;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:800}
.cA .chip .ic{width:16px;height:16px}
.cA .bot button{margin-left:auto;border:0;background:var(--vert);color:#fff;font-weight:800;border-radius:99px;padding:0 20px;min-height:44px}
.sA .pub{background:var(--fonce);color:#fff;border-radius:30px;padding:26px}
.sA .pub textarea,.sA .pub input{border-radius:16px}
.sA .pub .go{border:0;background:var(--orange);color:var(--encre);font-weight:900;border-radius:99px;min-height:52px;font-size:17px}
.sA .pub small{color:#D5E6DC}

/* ============ B. Épuré ============ */
.sB{font-family:"Plus Jakarta Sans",var(--base);padding-bottom:72px}
.sB .h{border-bottom:1px solid #ECEFEC;padding-block:12px}
.sB .h nav button{color:var(--doux);font-weight:600;border-radius:0;padding-inline:10px}
.sB .h nav button[aria-current]{color:var(--encre);box-shadow:inset 0 -2px 0 var(--encre)}
.sB .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:60px 32px}
.sB .hero b{color:var(--vert)}
.sB h1{font:800 clamp(32px,5.2vw,56px)/1.06 "Plus Jakarta Sans",var(--base);letter-spacing:-.035em;max-width:16ch}
.sB .rech{width:100%;max-width:620px;border:1px solid var(--trait);border-radius:20px;padding:6px 6px 6px 18px;box-shadow:0 12px 34px rgba(22,33,27,.09);margin-top:10px}
.sB .rech button{background:var(--encre);color:#fff;border:0;border-radius:14px;padding:0 22px;min-height:50px;font-weight:700;flex:none}
.sB .cats{display:flex;gap:30px;overflow-x:auto;border-bottom:1px solid #ECEFEC;padding-inline:20px}
.sB .cats>:first-child{margin-left:auto}.sB .cats>:last-child{margin-right:auto}
.sB .cats button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--doux);font-weight:600;font-size:14px;min-width:56px}
.sB .cats button[aria-pressed="true"]{color:var(--encre);border-color:var(--encre)}
.sB .cats .ic{width:26px;height:26px;stroke-width:1.6}
.sB h2{font:800 24px/1.15 "Plus Jakarta Sans",var(--base);letter-spacing:-.02em}
.sB .liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:32px 20px}
.sB .vide{grid-column:1/-1}
.cB{display:flex;flex-direction:column;min-width:0}
.cB .cov{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/11;max-width:100%}
.cB .bud{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:99px;padding:4px 13px;font-weight:800}
.cB h3{font:700 17px/1.3 "Plus Jakarta Sans",var(--base);margin-top:14px}
.cB .meta{color:var(--doux);font-size:14.5px;margin-top:2px}
.cB .who{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px}
.cB .who span:nth-child(2){margin-right:auto}
.cB .who button{border:1px solid var(--encre);background:#fff;border-radius:99px;font-weight:700;padding:0 14px;min-height:42px}
.sB .pub{border:1px solid var(--trait);border-radius:24px;padding:26px;box-shadow:0 12px 34px rgba(22,33,27,.07)}
.sB .pub textarea,.sB .pub input{border:1px solid var(--trait);border-radius:14px}
.sB .pub .go{border:0;background:var(--vert);color:#fff;font-weight:700;border-radius:14px;min-height:52px;font-size:16.5px}
.sB .pub small,.sB .pub .photo{color:var(--doux)}

/* ============ C. Vif ============ */
.sC{padding-bottom:72px}
.sC .haut{background:var(--fonce);color:#fff;padding-bottom:92px;position:relative;overflow:hidden}
.sC .h{padding-block:14px;position:relative}
.sC .logo{color:#fff}
.sC .h nav button{color:#D5E6DC}
.sC .h nav button[aria-current]{color:#fff;background:rgba(255,255,255,.14)}
.sC .cpt{color:#fff}
.sC .burger{color:#fff;border-color:rgba(255,255,255,.35)}
.sC .hero{position:relative;padding-top:36px;display:flex;flex-direction:column;gap:26px}
.sC h1{font:800 clamp(46px,9vw,108px)/.9 var(--marque);letter-spacing:-.045em;max-width:9ch}
.sC h1 em{font-style:normal;color:var(--vif)}
.sC .rech{background:#fff;color:var(--encre);border-radius:18px;padding:6px 6px 6px 18px;max-width:600px}
.sC .rech button{background:var(--orange);color:var(--encre);font-weight:800;border-radius:13px;padding:0 24px;border:0;min-height:54px;flex:none}
.sC .deco{position:absolute;right:-30px;top:0;width:min(46%,500px);pointer-events:none}
@media (max-width:899px){.sC .deco{display:none}}
.sC .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:-60px;position:relative}
@media (min-width:760px){.sC .cats{grid-template-columns:repeat(5,1fr)}}
.sC .cats button{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:14px;min-height:116px;padding:16px;border-radius:24px;border:3px solid transparent;font:800 20px/1.1 var(--marque);text-align:left}
.sC .cats button.tout{background:#fff;color:var(--encre);border-color:var(--encre)}
.sC .cats button[aria-pressed="true"]{border-color:var(--encre);box-shadow:5px 5px 0 var(--encre)}
.sC .cats .ic{width:30px;height:30px}
.sC h2{font:800 34px/1 var(--marque);letter-spacing:-.03em}
.cC{border-radius:28px;padding:24px;display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between}
.cC .l{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.cC .tag{display:inline-flex;gap:7px;align-items:center;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.cC .tag .ic{width:17px;height:17px}
.cC h3{font:800 28px/1.05 var(--marque);letter-spacing:-.025em;color:var(--encre)}
.cC p{color:var(--encre)}
.cC .meta{font-weight:700;font-size:14.5px}
.cC .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:14px;flex:1 0 auto}
@media (max-width:559px){.cC .r{flex-direction:row;align-items:center}}
.cC .bud{font:800 38px/1 var(--marque);color:var(--encre);white-space:nowrap}
.cC .bud.libre{font-size:17px}
.cC .r button{background:var(--encre);color:#fff;border:0;border-radius:99px;padding:0 22px;min-height:48px;font-weight:800}
.sC .pub{background:var(--orange);color:var(--encre);border-radius:28px;padding:26px}
.sC .pub h2{font-size:30px}
.sC .pub textarea,.sC .pub input{border-radius:16px}
.sC .pub .go{border:0;background:var(--encre);color:#fff;font-weight:800;border-radius:99px;min-height:54px;font-size:17px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>

<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>

<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z"/></symbol>
</defs></svg>

<div class="maq"><div class="maq-in">
  <span class="seg" role="group" aria-label="Choisir un style">
    <button data-style="A" aria-pressed="true">A · Chaleureux</button>
    <button data-style="B" aria-pressed="false">B · Épuré</button>
    <button data-style="C" aria-pressed="false">C · Vif</button>
  </span>
  <p id="maq-texte"></p>
</div></div>

<div id="scene"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS={tout:['Tout','grid',''],jardin:['Jardin','leaf','t-vert'],menage:['Ménage','spark','t-bleu'],brico:['Bricolage','tool','t-orange'],plomberie:['Plomberie','drop','t-violet']};
const DEMANDES=[
  {cat:'jardin',titre:'Tondre ma pelouse de 200 m²',ville:'Pessac',quand:'Samedi 10/10',budget:'40 €',client:'Julie M.',ini:'JM',age:'il y a 2 h',rep:3,desc:'Pelouse plate, sans obstacle. Tondeuse à apporter, bordures à faire aussi.'},
  {cat:'brico',titre:'Monter une armoire à 3 portes',ville:'Mérignac',quand:'Cette semaine',budget:'35 €',client:'Hugo P.',ini:'HP',age:'il y a 5 h',rep:1,desc:'Armoire en kit déjà livrée, 3e étage avec ascenseur.'},
  {cat:'menage',titre:'Ménage de 3 h avant un déménagement',ville:'Bordeaux',quand:'Lundi 12/10',budget:'60 €',client:'Nadia B.',ini:'NB',age:'hier',rep:6,desc:'Appartement de 45 m² vide. Sols, cuisine et salle de bain.'},
  {cat:'plomberie',titre:'Robinet de cuisine qui fuit',ville:'Talence',quand:'Dès que possible',budget:'',client:'Marc T.',ini:'MT',age:'hier',rep:0,desc:'Le mitigeur goutte en continu. Je n\'ai pas le modèle de rechange.'},
];
const TEXTES={
  A:'A · Chaleureux : formes rondes, ombres douces, petits dessins. On se sent entre voisins.',
  B:'B · Épuré : beaucoup de blanc, de grandes images, peu de texte. Sérieux et moderne.',
  C:'C · Vif : très grand titre, grands aplats de couleur. On ne le confond avec aucun autre site.',
};

/* Petits dessins qui remplacent les photos des clients dans la maquette */
const SCENES={
jardin:`<rect width="400" height="280" fill="#DDF1E4"/><circle cx="318" cy="66" r="36" fill="#F6C667"/><ellipse cx="110" cy="290" rx="240" ry="130" fill="#8FD0A5"/><ellipse cx="330" cy="310" rx="220" ry="130" fill="#5FB583"/><rect x="92" y="120" width="12" height="60" rx="4" fill="#7A5B3A"/><circle cx="98" cy="104" r="40" fill="#2F6B4F"/><circle cx="246" cy="196" r="8" fill="#fff"/><circle cx="270" cy="212" r="6" fill="#F6C667"/><circle cx="210" cy="222" r="6" fill="#fff"/>`,
brico:`<rect width="400" height="280" fill="#FBE7D8"/><rect y="220" width="400" height="60" fill="#F1CDB0"/><rect x="130" y="50" width="150" height="176" rx="8" fill="#C98A54"/><path d="M180 50v176M230 50v176" stroke="#7A3A0E" stroke-width="3" fill="none"/><circle cx="172" cy="140" r="4" fill="#7A3A0E"/><circle cx="222" cy="140" r="4" fill="#7A3A0E"/><circle cx="238" cy="140" r="4" fill="#7A3A0E"/><rect x="42" y="170" width="64" height="52" rx="5" fill="#E8A56B"/><path d="M42 190h64" stroke="#7A3A0E" stroke-width="3" fill="none"/><rect x="312" y="150" width="12" height="72" rx="6" fill="#2F6B4F"/><rect x="315" y="110" width="6" height="44" fill="#8A94A3"/>`,
menage:`<rect width="400" height="280" fill="#DCEAF7"/><rect y="226" width="400" height="54" fill="#C4DBF0"/><rect x="50" y="40" width="130" height="130" rx="8" fill="#fff"/><path d="M115 40v130M50 105h130" stroke="#93C2EC" stroke-width="4" fill="none"/><path d="M236 150h96l-12 80h-72z" fill="#5B9BD5"/><path d="M236 150a48 30 0 0196 0" stroke="#1D4A72" stroke-width="4" fill="none"/><circle cx="262" cy="118" r="16" fill="#fff"/><circle cx="296" cy="98" r="11" fill="#fff"/><circle cx="318" cy="126" r="8" fill="#fff"/><path d="M356 54l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#F6C667"/>`,
plomberie:`<rect width="400" height="280" fill="#E8E1F6"/><path d="M0 70h400M0 140h400M100 0v140M200 0v140M300 0v140" stroke="#D6CBEE" stroke-width="3" fill="none"/><rect x="100" y="210" width="210" height="70" rx="14" fill="#fff"/><rect x="140" y="92" width="110" height="20" rx="10" fill="#6B55B3"/><rect x="230" y="92" width="20" height="48" rx="10" fill="#6B55B3"/><rect x="160" y="64" width="16" height="32" fill="#49317F"/><rect x="146" y="56" width="44" height="12" rx="6" fill="#49317F"/><path d="M240 156s9 12 9 19a9 9 0 01-18 0c0-7 9-19 9-19z" fill="#5B9BD5"/><path d="M240 190s6 8 6 13a6 6 0 01-12 0c0-5 6-13 6-13z" fill="#93C2EC"/>`,
};
const scene=c=>`<svg class="scene" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dessin à la place de la photo du client">${SCENES[c]}</svg>`;
const QUARTIER=`<svg viewBox="0 0 420 290" role="img" aria-label="Dessin d'une rue avec trois maisons" style="width:100%;display:block"><ellipse cx="210" cy="160" rx="205" ry="128" fill="#D8ECDF"/><circle cx="336" cy="70" r="30" fill="#F6C667"/><rect x="42" y="208" width="7" height="34" fill="#7A5B3A"/><circle cx="45" cy="196" r="27" fill="#2F6B4F"/><rect x="70" y="150" width="84" height="92" fill="#fff"/><path d="M58 152l54-48 54 48z" fill="#E8863F"/><rect x="102" y="200" width="22" height="42" rx="3" fill="#2F6B4F"/><rect x="80" y="166" width="20" height="20" rx="3" fill="#DCEAF7"/><rect x="172" y="118" width="92" height="124" fill="#FBEBC6"/><path d="M160 120l58-52 58 52z" fill="#1F4D38"/><rect x="207" y="194" width="24" height="48" rx="3" fill="#E8863F"/><rect x="184" y="138" width="22" height="22" rx="3" fill="#fff"/><rect x="232" y="138" width="22" height="22" rx="3" fill="#fff"/><rect x="282" y="164" width="74" height="78" fill="#F8DFE4"/><path d="M272 166l47-40 47 40z" fill="#C96A82"/><rect x="309" y="202" width="20" height="40" rx="3" fill="#7F2238"/><rect x="292" y="178" width="16" height="16" rx="3" fill="#fff"/><rect x="372" y="214" width="6" height="28" fill="#7A5B3A"/><circle cx="375" cy="204" r="22" fill="#5FB583"/><rect x="20" y="240" width="380" height="12" rx="6" fill="#8FD0A5"/></svg>`;
const DECO=`<svg class="deco" viewBox="0 0 500 420" aria-hidden="true"><circle cx="330" cy="170" r="150" fill="#E8863F"/><path d="M110 330a150 150 0 01150-150v150z" fill="#5FD38A"/><rect x="330" y="250" width="130" height="130" rx="28" fill="#FBEBC6" transform="rotate(12 395 315)"/><circle cx="170" cy="110" r="34" fill="none" stroke="#fff" stroke-width="10"/></svg>`;

let style='A',cat='tout',mot='';
const entete=()=>`<header class="h"><div class="in"><span class="logo">rafals<i>.</i></span>
  <nav aria-label="Menu principal"><button aria-current="page">Accueil</button><button data-autre>Trouver un prestataire</button><button data-autre>Mes réservations</button><button data-autre>Messages<span class="pt">2</span></button><button data-autre>Proposer mes services</button></nav>
  <button class="cpt" data-autre><span class="av pt2 t-vert">JM</span><span>Julie</span></button><button class="burger" data-autre aria-label="Ouvrir le menu">☰</button></div></header>`;
const recherche=(bouton)=>`<label class="rech">${style==='A'?'':ic('search')}<input id="besoin-${style}" type="search" value="${esc(mot)}" placeholder="ex. pelouse, ménage, robinet…" aria-label="Chercher dans les demandes" maxlength="80">${bouton}</label>`;
const publier=()=>`<form class="pub" id="pub-${style}"><h2>Publier une demande</h2>
  <label for="t-${style}">Votre besoin<textarea id="t-${style}" maxlength="300" placeholder="ex. Tondre ma pelouse de 200 m² samedi matin"></textarea></label>
  <label for="a-${style}">Où ?<input id="a-${style}" placeholder="ex. 12 rue des Lilas, Pessac"></label>
  <button type="button" class="photo" data-msg="Le choix de photos s'ouvre ici (5 au plus)."><span>${ic('cam')}</span>Ajouter des photos</button>
  <button class="go" type="submit">Publier ma demande</button>
  <small>Gratuit. La rue n'est montrée qu'au prestataire que vous choisissez.</small></form>`;
const catsHtml=()=>Object.entries(CATS).map(([c,[nom,icone,teinte]])=>{const p=`data-cat="${c}" aria-pressed="${c===cat}"`;
  if(style==='A')return `<button ${p}><span class="b ${teinte||'t-jaune'}">${ic(icone)}</span>${nom}</button>`;
  if(style==='B')return `<button ${p}>${ic(icone)}${nom}</button>`;
  return `<button ${p} class="${teinte||'tout'}">${ic(icone)}${nom}</button>`}).join('');
const reponses=d=>d.rep?`${d.rep} réponse${d.rep>1?'s':''}`:'Aucune réponse';

function carte(d){const[nom,icone,teinte]=CATS[d.cat];
  if(style==='A')return `<article class="cA"><div class="top"><span class="av ${teinte}">${d.ini}</span><div><b>${d.client}</b><small>${d.ville} · ${d.age}</small></div>${d.budget?`<span class="bud">${d.budget}</span>`:'<span class="bud libre">Prix à proposer</span>'}</div>
    <div class="mid"><div><h3>${esc(d.titre)}</h3><p>${esc(d.desc)}</p></div><div class="img">${scene(d.cat)}</div></div>
    <div class="bot"><span class="chip">${ic('clock')}${d.quand}</span><span class="chip">${reponses(d)}</span><button data-msg="La conversation avec ${d.client} s'ouvre.">Répondre</button></div></article>`;
  if(style==='B')return `<article class="cB"><div class="cov">${scene(d.cat)}<span class="bud">${d.budget||'Prix à proposer'}</span></div><h3>${esc(d.titre)}</h3><p class="meta">${d.ville} · ${d.quand}</p>
    <div class="who"><span class="av pt2 ${teinte}">${d.ini}</span><span>${d.client} · ${reponses(d).toLowerCase()}</span><button data-msg="La conversation avec ${d.client} s'ouvre.">Répondre</button></div></article>`;
  return `<article class="cC ${teinte}"><div class="l"><span class="tag">${ic(icone)}${nom}</span><h3>${esc(d.titre)}</h3><p>${esc(d.desc)}</p><span class="meta">${d.ville} · ${d.quand} · ${d.client} · ${reponses(d).toLowerCase()}</span></div>
    <div class="r">${d.budget?`<span class="bud">${d.budget}</span>`:'<span class="bud libre">Prix à proposer</span>'}<button data-msg="La conversation avec ${d.client} s'ouvre.">Répondre</button></div></article>`}

function liste(){
  const m=mot.trim().toLowerCase();
  const l=DEMANDES.filter(d=>(cat==='tout'||d.cat===cat)&&(!m||`${d.titre} ${d.desc} ${CATS[d.cat][0]} ${d.ville}`.toLowerCase().includes(m)));
  $('#liste').innerHTML=l.length?l.map(carte).join(''):'<p class="vide">Aucune demande ne correspond. Essayez un autre mot, ou publiez la vôtre.</p>';
  $('#compte').textContent=`${l.length} demande${l.length>1?'s':''}`;
  $$('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===cat));
}
function dessiner(){
  const corps=`<div class="in cols"><div><div class="tete"><h2>Les demandes près de chez vous</h2><span id="compte"></span></div><div class="liste" id="liste"></div></div>${publier()}</div>`;
  const pages={
    A:()=>`${entete()}<div class="in"><div class="hero"><div><h1>Bonjour Julie ! <em>De quoi avez-vous besoin ?</em></h1><p class="sous">Un voisin ou un professionnel du quartier s'en occupe, souvent dès cette semaine.</p>${recherche(`<button type="button" aria-label="Chercher" data-msg="La liste se filtre pendant que vous écrivez.">${ic('search')}</button>`)}</div><div class="dessin">${QUARTIER}</div></div><div class="cats" role="group" aria-label="Types de service">${catsHtml()}</div></div>${corps}`,
    B:()=>`${entete()}<div class="in hero"><b>Bonjour Julie</b><h1>De quoi avez-vous besoin ?</h1>${recherche(`<button type="button" data-msg="La liste se filtre pendant que vous écrivez.">Chercher</button>`)}</div><div class="cats" role="group" aria-label="Types de service">${catsHtml()}</div>${corps}`,
    C:()=>`<div class="haut">${DECO}${entete()}<div class="in hero"><h1>Bonjour Julie. <em>Un coup de main ?</em></h1>${recherche(`<button type="button" data-msg="La liste se filtre pendant que vous écrivez.">Chercher</button>`)}</div></div><div class="in"><div class="cats" role="group" aria-label="Types de service">${catsHtml()}</div></div>${corps}`,
  };
  $('#scene').className='s'+style;$('#scene').innerHTML=pages[style]();
  $('#maq-texte').textContent=TEXTES[style];
  $$('[data-style]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===style));
  liste();
}
let minuteur;
function message(t){const z=$('#toast');z.textContent=t;z.hidden=false;clearTimeout(minuteur);minuteur=setTimeout(()=>z.hidden=true,3000)}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-style]');if(s){style=s.dataset.style;try{history.replaceState(null,'','#'+style)}catch{}dessiner();return window.scrollTo(0,0)}
  const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;return liste()}
  const m=e.target.closest('[data-msg]');if(m)return message(m.dataset.msg);
  if(e.target.closest('[data-autre]'))message('Dans cette maquette, seul l\'accueil est dessiné.');
});
document.addEventListener('input',e=>{if(e.target.id.startsWith('besoin-')){mot=e.target.value;liste()}});
document.addEventListener('submit',e=>{e.preventDefault();
  const texte=$('#t-'+style).value.trim(),adresse=$('#a-'+style).value.trim();
  if(texte.length<5)return message('Écrivez votre besoin en quelques mots.');
  if(!adresse)return message('Indiquez où : une adresse ou une ville.');
  DEMANDES.unshift({cat:'jardin',titre:texte.slice(0,60),ville:adresse.split(',').pop().trim(),quand:'Dès que possible',budget:'',client:'Julie M.',ini:'JM',age:'à l\'instant',rep:0,desc:texte});
  e.target.reset();cat='tout';liste();message('Demande publiée. Les prestataires proches la voient déjà.');
});
const depart=location.hash.slice(1).toUpperCase();if(TEXTES[depart])style=depart;
dessiner();
</script>
