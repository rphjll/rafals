<title>Maquette rafals absences</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:36px;padding:6px 12px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-ok{background:var(--ok-doux);color:var(--ok)} .b-att{background:var(--att-doux);color:var(--att)} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-err{background:var(--err-doux);color:var(--err)}
.note{font-size:13.5px;color:var(--doux);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-att{background:var(--att-doux);color:var(--att)} .a-err{background:var(--err-doux);color:var(--err)} .a-ok{background:var(--ok-doux);color:var(--ok)}
.rdv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bord);padding-top:14px}
.rdv:first-of-type{border-top:0;padding-top:0}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.compteur{margin-left:4px;background:var(--accent);color:var(--sur);border-radius:999px;padding:1px 7px;font-size:12px}
.versions{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:560px){.versions{grid-template-columns:1fr}}
.version{border:1px solid var(--bord);border-radius:10px;padding:10px 12px;font-size:14px}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
textarea{min-height:90px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
</style>

<div class="bandeau"><b>Maquette lot 4.6</b> · écrans :
  <button class="onglet" data-e="client" aria-pressed="true">1. Mes rendez-vous (client)</button>
  <button class="onglet" data-e="compte">2. Mon compte</button>
  <button class="onglet" data-e="presta">3. Mon agenda › Rendez-vous</button>
  <button class="onglet" data-e="public">4. Page publique</button>
  <button class="onglet" data-e="admin">5. Administration</button>
  <button class="onglet" data-e="agenda">6. Bloquer avec des rendez-vous</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const rdv = (titre, badge, quand, avec, extra) => '<div class="rdv"><div class="tete"><h3>' + titre + '</h3>' + badge + '</div><p style="margin:0;font-weight:600">' + quand + '</p><p class="note">' + avec + '</p>' + extra + '</div>';
const E = {};
E.client = () => '<h1>Mes rendez-vous</h1><div class="sous-onglets"><button>À venir</button><button aria-pressed="true">Passés et annulés</button></div><div class="carte">' +
  rdv('Dépannage fuite', '<span class="badge b-neu">passé</span>', 'Mardi 13/10/2026, 10 h 00 – 12 h 00', 'Avec Karim Benali · 50 € · espèces', '<div class="actions"><button class="btn dan petit" data-fen="pas-venu">Karim n\'est pas venu…</button></div><p class="note">Possible pendant 7 jours après le rendez-vous.</p>') +
  rdv('Coupe femme', '<span class="badge b-err">absente</span>', 'Lundi 12/10/2026, 10 h 00 – 10 h 45', 'Avec Léa Martin · 35 € · espèces', '<div class="alerte a-att">Léa Martin indique que vous n\'êtes pas venue. Si c\'est faux, contestez avant le lundi 19/10 à 10 h 40.</div><div class="actions"><button class="btn sec petit" data-fen="je-suis-venu">Je suis venue…</button></div>') +
  rdv('Ménage 2 h', '<span class="badge b-err">absente</span>', 'Jeudi 08/10/2026, 9 h 00 – 11 h 00', 'Avec Julie Leroy · 50 € · espèces', '<div class="alerte a-att">Contestation envoyée le 09/10 : « J\'étais là, personne n\'a ouvert. » rafals va trancher.</div>') +
  rdv('Coupe homme', '<span class="badge b-neu">passé</span>', 'Lundi 05/10/2026, 18 h 00 – 18 h 30', 'Avec Léa Martin', '<p class="note">Absence signalée par vous : « Karim n\'est pas venu » — décision de rafals : l\'absence compte.</p>') +
  '</div>';
E.compte = () => '<h1>Mon compte</h1><div class="carte"><h2>Mes informations</h2><p class="note">(inchangé)</p></div>' +
  '<div class="carte"><h2>Absences</h2><p style="margin:0;font-weight:600">2 absences sans prévenir en 6 mois</p><p class="note">À 3 absences en 6 mois, vous ne pourrez plus réserver pendant 1 mois. Une absence compte 7 jours après avoir été signalée, sauf si vous la contestez.</p></div>' +
  '<div class="carte"><h2>Absences (exemple : suspendue)</h2><div class="alerte a-err">3 absences sans prévenir en 6 mois : vous ne pouvez plus réserver jusqu\'au 10/12/2026.</div></div>' +
  '<p class="note">Sans absence : la carte ne s\'affiche pas.</p>';
E.presta = () => '<h1>Mon agenda</h1><div class="sous-onglets"><button>Calendrier</button><button aria-pressed="true">Rendez-vous<span class="compteur">1</span></button><button>Semaine type</button><button>Réglages</button><button>Horaires libres</button></div>' +
  '<div class="carte"><h2>Demandes à accepter</h2>' + rdv('Coupe femme', '<span class="badge b-att">en attente</span>', 'Jeudi 15/10/2026, 9 h 00 – 9 h 45', 'Client : Marie Dupont · 06 00 00 00 00 <span class="badge b-err">2 absences en 6 mois</span>', '<div class="actions"><button class="btn prim petit">Accepter</button><button class="btn sec petit">Refuser…</button></div>') + '</div>' +
  '<details class="carte" open><summary style="font-weight:700;cursor:pointer">Passés et annulés (3)</summary>' +
  rdv('Coupe femme', '<span class="badge b-neu">passé</span>', 'Mardi 13/10/2026, 10 h 00 – 10 h 45', 'Client : Marie Dupont', '<div class="actions"><button class="btn dan petit" data-toast="Absence signalée : Marie Dupont a 7 jours pour contester.">Client absent</button></div><p class="note">Possible pendant 7 jours après le rendez-vous.</p>') +
  rdv('Coupe homme', '<span class="badge b-err">vous : absent</span>', 'Lundi 12/10/2026, 18 h 00 – 18 h 30', 'Client : Paul Petit', '<div class="alerte a-att">Le client indique que vous n\'êtes pas venu. Si c\'est faux, contestez avant le lundi 19/10 à 18 h 40.</div><div class="actions"><button class="btn sec petit" data-fen="je-suis-venu">Je suis venu…</button></div>') +
  '</details>';
E.public = () => '<div class="carte"><div class="tete"><h1 style="font-size:26px">Karim Benali</h1><span class="badge b-ok">SIRET vérifié</span></div><p class="note">★ 4,2 (30 avis) · Plombier · Part de Pessac, jusqu\'à 20 km</p><div class="alerte a-att">1 absence sans prévenir ces 6 derniers mois</div><p class="note">Sans absence : rien n\'est affiché.</p></div>';
E.admin = () => '<h1>Administration</h1><div class="sous-onglets"><button>Accords à vérifier</button><button>Comptes</button><button>Prestataires</button><button aria-pressed="true">Absences contestées<span class="compteur">1</span></button><button>Propositions de métiers</button><button>Métiers</button></div>' +
  '<div class="carte"><div class="tete"><h3>Dépannage fuite · mardi 13/10/2026 à 10 h 00</h3><span class="badge b-att">à trancher</span></div>' +
  '<div class="versions"><div class="version"><b>Marie Dupont (cliente)</b><br>a signalé le 13/10 à 12 h 05 : « Karim n\'est pas venu ».</div><div class="version"><b>Karim Benali (prestataire)</b><br>a contesté le 14/10 : « Je suis venu à 10 h, personne n\'a ouvert, j\'ai appelé 2 fois. »</div></div>' +
  '<div class="actions"><button class="btn dan" data-toast="Décision enregistrée : l\'absence compte. Les deux sont prévenus.">L\'absence compte</button><button class="btn sec" data-toast="Décision enregistrée : l\'absence ne compte pas. Les deux sont prévenus.">Elle ne compte pas</button></div></div>' +
  '<p class="note">Vide : « Aucune absence contestée. » La liste montre aussi, plus bas, « Annulations de dernière minute par les prestataires (6 derniers mois) » : Léa Martin · 2.</p>';
E.agenda = () => '<h1>Mon agenda</h1><div class="carte"><h2>Périodes bloquées à venir</h2><p class="note">Clic sur [Bloquer] dans la fenêtre « Bloquer une période » (20/10 → 24/10)…</p><div><button class="btn prim" data-fen="choix">Voir ce qui s\'affiche</button></div></div>';
const F = {
  'pas-venu': '<h3>Karim n\'est pas venu ?</h3><p class="note" style="font-size:14.5px">Dépannage fuite, mardi 13/10 à 10 h 00. Karim est prévenu et a 7 jours pour contester ; s\'il ne conteste pas, l\'absence apparaîtra sur sa page. (Remboursement d\'un paiement en ligne : bientôt.)</p><div class="pied"><button class="btn dan" data-close data-toast="Absence signalée.">Signaler l\'absence</button><button class="btn sec" data-close>Annuler</button></div>',
  'je-suis-venu': '<h3>Contester l\'absence</h3><p class="note">Expliquez ce qui s\'est passé : l\'administrateur de rafals lira les deux versions et tranchera. En attendant, rien n\'est compté ni affiché.</p><textarea placeholder="ex. Je suis venu à 10 h, personne n\'a ouvert, j\'ai appelé 2 fois."></textarea><div class="pied"><button class="btn prim" data-close data-toast="Contestation envoyée : rafals va trancher.">Envoyer</button><button class="btn sec" data-close>Annuler</button></div>',
  choix: '<h3>2 rendez-vous pendant cette période</h3><ul style="margin:0;padding-left:18px"><li>mardi 20/10/2026 à 10 h 00 · Coupe femme · Marie Dupont</li><li>jeudi 22/10/2026 à 14 h 00 · Couleur · Paul Petit</li></ul><p class="note">Annuler : chaque client est prévenu par mail (« Le prestataire n\'est pas disponible à cette date »). Garder : ces rendez-vous restent, tout le reste de la période est bloqué.</p><div class="pied"><button class="btn dan" data-close data-toast="Période bloquée, 2 rendez-vous annulés.">Annuler ces rendez-vous et bloquer</button><button class="btn sec" data-close data-toast="Période bloquée autour des 2 rendez-vous.">Bloquer autour</button></div><p class="note">Même fenêtre pour une semaine type qui ne couvre plus des rendez-vous : [Annuler ces rendez-vous] / [Les garder].</p>',
};
let etat = 'client', m;
function rendre() { document.getElementById('ecran').innerHTML = E[etat](); document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat)); window.scrollTo(0, 0); }
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(m); m = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-e],[data-fen],[data-close],[data-toast]'); if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
  if (el.dataset.e) { etat = el.dataset.e; rendre(); }
  if (el.dataset.toast) toast(el.dataset.toast);
});
rendre();
</script>
