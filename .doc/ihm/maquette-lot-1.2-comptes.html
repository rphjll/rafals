<title>Maquette rafals connexion</title>
<style>
:root{
  --fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--texte-doux:#58665C;--bord:#D8E1DA;
  --primaire:#2F6B4F;--primaire-texte:#FFFFFF;--primaire-doux:#E2EEE7;--accent:#D9793A;
  --ok:#2E7D4F;--ok-doux:#E3F2E8;--attente:#B26A00;--attente-doux:#FCF0DC;--erreur:#B3261E;--erreur-doux:#FBE4E2;
  --neutre-doux:#E8ECF1;--sur-etat:#FFFFFF;--voile:rgb(10 14 20 / .55);
  --titre:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--corps:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--texte-doux:#A3AEBD;--bord:#2C3730;--primaire:#79C49C;--primaire-texte:#0F1A13;--primaire-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--attente:#F0B35A;--attente-doux:#33260F;--erreur:#F08A82;--erreur-doux:#3A1A18;--neutre-doux:#262E39;--sur-etat:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--texte-doux:#A3AEBD;--bord:#2C3730;--primaire:#79C49C;--primaire-texte:#0F1A13;--primaire-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--attente:#F0B35A;--attente-doux:#33260F;--erreur:#F08A82;--erreur-doux:#3A1A18;--neutre-doux:#262E39;--sur-etat:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:var(--corps);font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--texte-doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--primaire);color:var(--primaire);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px;position:sticky;top:0;z-index:5}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--titre);font-weight:700;font-size:24px;color:var(--primaire);background:none;border:0;padding:0;cursor:pointer}
.logo span{color:var(--accent)}
.menu{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.menu a{color:var(--texte-doux);text-decoration:none;padding:8px 10px;border-radius:10px;font-weight:500}
.qui{font-weight:600;padding-inline:8px}
@media (max-width:767px){.menu a{display:none}}
main{padding-inline:16px;padding-block:28px 60px}
.carte{max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--titre);font-size:26px;margin:0;letter-spacing:-.3px}
.sous{color:var(--texte-doux);margin:-8px 0 0}
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-weight:600;font-size:13px}
.champ label i{color:var(--erreur);font-style:normal}
.champ input{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px}
.champ small{font-size:13px;color:var(--texte-doux)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.deux{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:10px 18px;cursor:pointer;width:100%}
.btn.prim{background:var(--primaire);color:var(--primaire-texte);border-color:var(--primaire)}
.btn.sec{background:var(--surface);color:var(--primaire);border-color:var(--primaire)}
.btn.petit{width:auto;min-height:38px;padding:7px 14px}
.erreur{background:var(--erreur-doux);color:var(--erreur);border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px}
.info{background:var(--ok-doux);color:var(--ok);border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px}
.attente{background:var(--attente-doux);color:var(--attente);border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px}
.separateur{display:flex;align-items:center;gap:10px;color:var(--texte-doux);font-size:13px}
.separateur::before,.separateur::after{content:"";flex:1;border-top:1px solid var(--bord)}
.note{max-width:460px;margin:14px auto 0;font-size:13px;color:var(--texte-doux)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur-etat);padding:12px 18px;border-radius:10px;font-weight:600}
</style>

<div class="bandeau" id="onglets"><b>Maquette lot 1.2</b> · écrans :
  <button class="onglet" data-e="inscription" aria-pressed="true">1. Inscription</button>
  <button class="onglet" data-e="inscrit">2. Après l'inscription</button>
  <button class="onglet" data-e="verifier">3. Lien de vérification</button>
  <button class="onglet" data-e="connexion">4. Connexion</button>
  <button class="onglet" data-e="connecte">5. Connecté</button>
  <button class="onglet" data-e="oubli">6. Mot de passe oublié</button>
  <button class="onglet" data-e="nouveau">7. Nouveau mot de passe</button>
</div>

<header><div class="entete">
  <button class="logo" data-e="connexion">rafals<span>.</span></button>
  <nav class="menu" id="menu"></nav>
</div></header>

<main id="ecran"></main>
<div class="toast" id="toast" hidden></div>

<script>
const ecrans = {
  inscription: {connecte:false, html:`
    <div class="carte">
      <h1>Créer mon compte</h1>
      <p class="sous">Pour réserver un prestataire, ou proposer vos services.</p>
      <div class="deux">
        <div class="champ"><label>Prénom <i>*</i></label><input value="Marie"></div>
        <div class="champ"><label>Nom <i>*</i></label><input value="Dupont"></div>
      </div>
      <div class="champ"><label>Adresse mail <i>*</i></label><input value="marie.dupont@gmail.com"></div>
      <div class="champ"><label>Téléphone <i>*</i></label><input value="06 12 34 56 78"><small>Visible seulement des prestataires chez qui vous réservez.</small></div>
      <div class="champ"><label>Date de naissance <i>*</i></label><input value="12/03/1972"><small>Il faut avoir au moins 16 ans.</small></div>
      <div class="champ"><label>Mot de passe <i>*</i></label><input type="password" value="MaisonBleue44"><small>Au moins 10 caractères (ex. MaisonBleue44).</small></div>
      <div class="erreur" id="err-insc" hidden>Un compte existe déjà avec cette adresse mail.</div>
      <button class="btn prim" data-e="inscrit">Créer mon compte</button>
      <div class="separateur">déjà inscrit ?</div>
      <button class="btn sec" data-e="connexion">Se connecter</button>
    </div>
    <p class="note">Si le serveur refuse (ex. adresse déjà utilisée, moins de 16 ans), son message s'affiche en rouge juste au-dessus du bouton. <button class="btn sec petit" onclick="document.getElementById('err-insc').hidden=false">Voir un exemple</button></p>`},
  inscrit: {connecte:false, html:`
    <div class="carte">
      <h1>Vérifiez votre boîte mail</h1>
      <p>Un lien vient d'être envoyé à <b>marie.dupont@gmail.com</b>. Cliquez dessus pour finir votre inscription (il est valable 7 jours).</p>
      <div class="attente">Tant que votre adresse n'est pas vérifiée, vous pouvez vous connecter, mais pas réserver ni publier.</div>
      <button class="btn prim" data-e="connexion">Se connecter</button>
      <button class="btn sec" data-toast="Si un compte non vérifié existe avec cette adresse, un nouveau lien vient d'être envoyé.">Je n'ai rien reçu : renvoyer le lien</button>
    </div>`},
  verifier: {connecte:false, html:`
    <div class="carte">
      <h1>Adresse vérifiée</h1>
      <div class="info">Votre adresse mail est vérifiée.</div>
      <button class="btn prim" data-e="connexion">Se connecter</button>
    </div>
    <div class="carte" style="margin-top:16px">
      <h1>Lien expiré (autre cas)</h1>
      <div class="erreur">Ce lien a expiré. Demandez-en un nouveau.</div>
      <div class="champ"><label>Adresse mail <i>*</i></label><input value="marie.dupont@gmail.com"></div>
      <button class="btn prim" data-toast="Si un compte non vérifié existe avec cette adresse, un nouveau lien vient d'être envoyé.">Recevoir un nouveau lien</button>
    </div>
    <p class="note">C'est la page ouverte par le lien du mail (…/verifier-adresse?jeton=…). Elle vérifie toute seule, sans rien demander.</p>`},
  connexion: {connecte:false, html:`
    <div class="carte">
      <h1>Se connecter</h1>
      <div class="champ"><label>Adresse mail <i>*</i></label><input value="marie.dupont@gmail.com"></div>
      <div class="champ"><label>Mot de passe <i>*</i></label><input type="password" value="MaisonBleue44"></div>
      <div class="erreur" id="err-cnx" hidden>5 erreurs de suite : connexion bloquée jusqu'à 14 h 15.</div>
      <button class="btn prim" data-e="connecte" data-toast="Bonjour Marie !">Se connecter</button>
      <button class="btn sec" data-e="oubli">Mot de passe oublié ?</button>
      <div class="separateur">pas encore de compte ?</div>
      <button class="btn sec" data-e="inscription">Créer mon compte</button>
    </div>
    <p class="note">Message du serveur en rouge au-dessus du bouton : « Adresse mail ou mot de passe incorrect. », ou le blocage. <button class="btn sec petit" onclick="document.getElementById('err-cnx').hidden=false">Voir un exemple</button></p>`},
  connecte: {connecte:true, html:`
    <div class="carte">
      <h1>Le bon prestataire, près de chez vous.</h1>
      <p class="sous" style="margin:0">(l'accueil habituel)</p>
      <div class="attente">Vérifiez votre adresse mail pour pouvoir réserver. <button class="btn sec petit" data-toast="Si un compte non vérifié existe avec cette adresse, un nouveau lien vient d'être envoyé.">Renvoyer le lien</button></div>
    </div>
    <p class="note">En haut à droite : votre prénom et « Se déconnecter ». Le bandeau orange n'apparaît que si l'adresse n'est pas encore vérifiée.</p>`},
  oubli: {connecte:false, html:`
    <div class="carte">
      <h1>Mot de passe oublié</h1>
      <p class="sous">Indiquez votre adresse : nous vous envoyons un lien pour en choisir un nouveau.</p>
      <div class="champ"><label>Adresse mail <i>*</i></label><input value="marie.dupont@gmail.com"></div>
      <button class="btn prim" data-toast="Si un compte existe avec cette adresse, un lien vient d'être envoyé (valable 1 heure).">Recevoir un lien</button>
      <button class="btn sec" data-e="connexion">Retour à la connexion</button>
    </div>`},
  nouveau: {connecte:false, html:`
    <div class="carte">
      <h1>Nouveau mot de passe</h1>
      <div class="champ"><label>Nouveau mot de passe <i>*</i></label><input type="password" value="JardinVert2027"><small>Au moins 10 caractères.</small></div>
      <div class="champ"><label>Le même, encore une fois <i>*</i></label><input type="password" value="JardinVert2027"></div>
      <button class="btn prim" data-e="connexion" data-toast="Votre mot de passe est changé. Vous pouvez vous connecter.">Enregistrer le nouveau mot de passe</button>
    </div>
    <p class="note">Page ouverte par le lien du mail « mot de passe oublié ». Après le changement, tous vos appareils sont déconnectés.</p>`},
};
function menu(connecte){
  document.getElementById('menu').innerHTML =
    '<a href="#">Trouver un prestataire</a><a href="#">Proposer mes services</a><a href="#">Mes rendez-vous</a>' +
    (connecte
      ? '<span class="qui">Marie</span><button class="btn sec petit" data-e="connexion" data-toast="Vous êtes déconnecté.">Se déconnecter</button>'
      : '<button class="btn prim petit" data-e="connexion">Se connecter</button>');
}
function aller(e){
  document.getElementById('ecran').innerHTML = ecrans[e].html;
  menu(ecrans[e].connecte);
  document.querySelectorAll('.onglet').forEach(b=>b.setAttribute('aria-pressed', b.dataset.e===e));
  window.scrollTo(0,0);
}
let minuteur;
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-e],[data-toast]'); if(!el) return; ev.preventDefault();
  if(el.dataset.e) aller(el.dataset.e);
  if(el.dataset.toast){const t=document.getElementById('toast');t.textContent=el.dataset.toast;t.hidden=false;clearTimeout(minuteur);minuteur=setTimeout(()=>t.hidden=true,3000);}
});
aller('inscription');
</script>
