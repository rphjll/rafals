<title>Maquette rafals rendez-vous</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
.menu{display:flex;gap:14px;font-size:14px;color:var(--doux);flex-wrap:wrap}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:36px;padding:6px 12px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)} .ver{background:var(--neu-doux);color:var(--neu);border-color:var(--neu-doux)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-ok{background:var(--ok-doux);color:var(--ok)} .b-att{background:var(--att-doux);color:var(--att)} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-err{background:var(--err-doux);color:var(--err)}
.note{font-size:13.5px;color:var(--doux);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.jour{flex:0 0 auto;border:1px solid var(--bord);background:var(--surface);color:var(--texte);border-radius:10px;padding:8px 10px;text-align:center;min-width:64px;cursor:pointer;font:inherit}
.jour small{display:block;color:var(--doux);font-size:12px} .jour[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);color:var(--prim);font-weight:700} .jour.plein{opacity:.5}
.puces{display:flex;gap:8px;flex-wrap:wrap}
.puce{border:1px solid var(--prim);color:var(--prim);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
.puce:hover{background:var(--prim-doux)}
.rdv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bord);padding-top:14px}
.rdv:first-of-type{border-top:0;padding-top:0}
.infos{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px} .infos dt{color:var(--doux)} .infos dd{margin:0;font-weight:500}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.compteur{margin-left:4px;background:var(--accent);color:var(--sur);border-radius:999px;padding:1px 7px;font-size:12px}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.champ{display:flex;flex-direction:column;gap:6px} .champ label{font-weight:600;font-size:13px}
input,textarea,select{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choix button{font:inherit;border:1px solid var(--bord);background:var(--fond);color:var(--texte);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:42px;text-align:left}
.choix button[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);color:var(--prim);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
.bulle{background:var(--texte);color:var(--surface);border-radius:8px;padding:9px 12px;font-size:13px;max-width:340px}
</style>

<div class="bandeau"><b>Maquette lot 4.4</b> · écrans :
  <button class="onglet" data-e="reserver" aria-pressed="true">1. Réserver (page d'une annonce)</button>
  <button class="onglet" data-e="mes">2. Mes rendez-vous (client)</button>
  <button class="onglet" data-e="recus">3. Rendez-vous reçus (prestataire)</button>
  <button class="onglet" data-e="reglages">4. Réglages (prestataire)</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span><nav class="menu"><span>Trouver</span><span>Mes rendez-vous</span><span>Mon compte</span></nav></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const jours = ['mar.<br><b>13</b><small>oct.</small>','mer.<br><b>14</b><small>oct.</small>','jeu.<br><b>15</b><small>oct.</small>','ven.<br><b>16</b><small>oct.</small>','sam.<br><b>17</b><small>oct.</small>','dim.<br><b>18</b><small>fermé</small>','lun.<br><b>19</b><small>fermé</small>','mar.<br><b>20</b><small>oct.</small>'];
const E = {};
E.reserver = () => '<div class="carte" style="padding:0;overflow:hidden"><div style="height:140px;background:linear-gradient(135deg,var(--prim-doux),var(--ok-doux));display:grid;place-items:center;color:var(--prim);font-weight:700">photo</div><div style="padding:20px;display:flex;flex-direction:column;gap:8px"><div class="tete"><h1 style="font-size:24px">Coupe femme</h1><b style="color:var(--prim);font-size:22px">35 €</b></div><p class="note">par <b style="color:var(--texte)">Léa Martin</b> · Coiffeur · 45 min · Chez vous (Léa vient de Mérignac) · Espèces</p></div></div>' +
  '<div class="carte"><h2>Choisir un horaire</h2><div class="jours">' + jours.map((j, i) => '<button class="jour' + (i === 5 || i === 6 ? ' plein' : '') + '" aria-pressed="' + (i === 0) + '">' + j + '</button>').join('') + '</div>' +
  '<p style="margin:0;font-weight:600">Mardi 13 octobre</p><div class="puces">' + ['9 h 00','9 h 15','9 h 30','10 h 45','11 h 00','11 h 15','14 h 00','14 h 15','14 h 30','…'].map(h => '<button class="puce" data-fen="confirmer">' + h + '</button>').join('') + '</div>' +
  '<p class="note">Annonce à l\'heure : une liste « Combien d\'heures ? » (de 2 h à 4 h) apparaît au-dessus, et le prix total se met à jour. Pas connecté : un clic sur un horaire mène à la connexion, puis revient ici.</p></div>';
const rdv = (titre, badge, quand, lignes, boutons) => '<div class="rdv"><div class="tete"><h3>' + titre + '</h3>' + badge + '</div><p style="margin:0;font-weight:600">' + quand + '</p><dl class="infos">' + lignes + '</dl><div class="actions">' + boutons + '</div></div>';
E.mes = () => '<h1>Mes rendez-vous</h1><div class="sous-onglets"><button aria-pressed="true">À venir</button><button aria-pressed="false">Passés et annulés</button></div>' +
  '<div class="carte">' +
  rdv('Coupe femme', '<span class="badge b-ok">confirmé</span>', 'Mardi 13/10/2026, 10 h 00 – 10 h 45', '<dt>Avec</dt><dd>Léa Martin · 06 12 34 56 78</dd><dt>Où</dt><dd>Chez vous : 8 allée des Pins, 33400 Talence</dd><dt>Prix</dt><dd>35 € · espèces</dd>', '<button class="btn sec petit" data-fen="deplacer">Déplacer</button><button class="btn dan petit" data-fen="annuler">Annuler…</button><span class="note">Annulation gratuite jusqu\'au lundi 12/10 à 10 h 00.</span>') +
  rdv('Dépannage fuite', '<span class="badge b-att">en attente</span>', 'Jeudi 15/10/2026, 9 h 00 – 11 h 00', '<dt>Avec</dt><dd>Karim Benali</dd><dt>Où</dt><dd>Chez vous : 8 allée des Pins, 33400 Talence</dd><dt>Prix</dt><dd>50 € · espèces</dd>', '<span class="note">Karim doit accepter avant le 14/10 à 18 h 00.</span><button class="btn dan petit" data-fen="annuler">Annuler la demande</button>') +
  rdv('Ménage 2 h', '<span class="badge b-ok">confirmé</span>', 'Aujourd\'hui, 16 h 00 – 18 h 00', '<dt>Avec</dt><dd>Julie Leroy · 07 00 00 00 00</dd><dt>Prix</dt><dd>50 € · espèces</dd>', '<button class="btn ver petit" data-bulle="Moins de 24 h avant : appelez Julie Leroy au 07 00 00 00 00.">🔒 Annuler</button><button class="btn ver petit" data-bulle="Moins de 24 h avant : appelez Julie Leroy au 07 00 00 00 00.">🔒 Déplacer</button>') +
  '</div><p class="note">Vide : « Aucun rendez-vous pour l\'instant. » + [Trouver un prestataire]. Onglet « Passés et annulés » : passés, refusés (« Refusé : Déjà pris ce jour-là »), expirés (« Léa n\'a pas répondu »), annulés, déplacés.</p>';
E.recus = () => '<h1>Mon agenda</h1><div class="sous-onglets"><button>Calendrier</button><button aria-pressed="true">Rendez-vous<span class="compteur">1</span></button><button>Semaine type</button><button>Réglages</button><button>Horaires libres</button></div>' +
  '<div class="carte"><h2>Demandes à accepter</h2>' + rdv('Dépannage à l\'heure · 3 h', '<span class="badge b-att">en attente</span>', 'Jeudi 15/10/2026, 9 h 00 – 12 h 00', '<dt>Client</dt><dd>Marie Dupont · 06 00 00 00 00</dd><dt>Où</dt><dd>8 allée des Pins, 33400 Talence</dd><dt>Prix</dt><dd>120 € · espèces</dd>', '<button class="btn prim petit" data-toast="Rendez-vous accepté : Marie Dupont est prévenue.">Accepter</button><button class="btn sec petit" data-fen="refuser">Refuser…</button><span class="note">Répondez avant le 14/10 à 18 h 00.</span>') + '</div>' +
  '<div class="carte"><h2>À venir</h2>' + rdv('Coupe femme', '<span class="badge b-ok">confirmé</span>', 'Mardi 13/10/2026, 10 h 00 – 10 h 45', '<dt>Client</dt><dd>Marie Dupont · 06 00 00 00 00</dd><dt>Où</dt><dd>8 allée des Pins, 33400 Talence</dd><dt>Prix</dt><dd>35 € · espèces</dd>', '<button class="btn dan petit" data-fen="annuler-presta">Annuler…</button>') + '</div>' +
  '<p class="note">Plus bas, « Passés et annulés » (replié). Le calendrier montre aussi le nombre de rendez-vous de chaque jour, et le détail du jour les liste.</p>';
E.reglages = () => '<h1>Mon agenda</h1><div class="sous-onglets"><button>Calendrier</button><button>Rendez-vous</button><button>Semaine type</button><button aria-pressed="true">Réglages</button><button>Horaires libres</button></div>' +
  '<div class="carte"><h2>Réservations</h2><span style="font-weight:600;font-size:13px">Quand un client réserve *</span><div class="choix"><button aria-pressed="true">Confirmé aussitôt<br><small class="note">l\'horaire libre est pris</small></button><button aria-pressed="false">J\'accepte chaque demande<br><small class="note">24 h pour répondre</small></button></div>' +
  '<div class="champ"><label>Annulation gratuite par le client jusqu\'à *</label><select><option>2 h avant</option><option>12 h avant</option><option selected>24 h avant</option><option>48 h avant</option></select></div><div><button class="btn prim" data-toast="Réglages enregistrés.">Enregistrer</button></div></div>' +
  '<div class="carte"><h2>Horaires</h2><p class="note">(la carte des réglages du lot 3.4 : écart, pause, délais — inchangée)</p></div>';
const F = {
  confirmer: '<h3>Réserver ce rendez-vous ?</h3><dl class="infos"><dt>Service</dt><dd>Coupe femme, avec Léa Martin</dd><dt>Quand</dt><dd>Mardi 13/10/2026, 10 h 45 – 11 h 30</dd><dt>Où</dt><dd>Chez vous : 8 allée des Pins, 33400 Talence</dd><dt>Prix</dt><dd>35 €</dd></dl>' +
    '<span style="font-weight:600;font-size:13px">Paiement *</span><div class="choix"><button aria-pressed="true">Espèces, le jour même</button><button class="ver" disabled>🔒 Carte (bientôt)</button></div>' +
    '<p class="note">Sans adresse enregistrée : les champs de l\'adresse (rue, complément, ville) s\'affichent ici. Annonce « chez vous ou chez Léa » : un choix du lieu. Annulation gratuite jusqu\'au lundi 12/10 à 10 h 45.</p>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Rendez-vous confirmé · mardi 13/10 à 10 h 45">Réserver mardi 13/10 à 10 h 45</button><button class="btn sec" data-close>Annuler</button></div>',
  annuler: '<h3>Annuler ce rendez-vous ?</h3><p class="note" style="font-size:14.5px">Coupe femme avec Léa Martin, mardi 13/10 à 10 h 00. Léa est prévenue par mail et l\'horaire redevient libre.</p><div class="pied"><button class="btn dan" data-close data-toast="Rendez-vous annulé.">Annuler le rendez-vous</button><button class="btn sec" data-close>Garder</button></div>',
  deplacer: '<h3>Déplacer « Coupe femme »</h3><p class="note">Actuellement : mardi 13/10 à 10 h 00. Choisissez un nouvel horaire (même prix).</p><div class="jours">' + jours.slice(0, 5).map((j, i) => '<button class="jour" aria-pressed="' + (i === 2) + '">' + j + '</button>').join('') + '</div><div class="puces"><button class="puce" data-close data-toast="Rendez-vous déplacé au jeudi 15/10 à 14 h 00.">14 h 00</button><button class="puce">14 h 15</button><button class="puce">15 h 30</button></div><p class="note">Si Léa accepte chaque demande : « Demande envoyée : votre rendez-vous de mardi reste valable tant que Léa n\'a pas accepté. »</p><div class="pied"><span></span><button class="btn sec" data-close>Fermer</button></div>',
  refuser: '<h3>Refuser la demande de Marie Dupont ?</h3><div class="champ"><label>Motif (facultatif, envoyé à la cliente)</label><input placeholder="ex. Déjà pris ce jour-là"></div><div class="pied"><button class="btn dan" data-close data-toast="Demande refusée : l\'horaire est de nouveau libre.">Refuser</button><button class="btn sec" data-close>Annuler</button></div>',
  'annuler-presta': '<h3>Annuler le rendez-vous de Marie Dupont ?</h3><div class="champ"><label>Motif * (envoyé à la cliente)</label><input placeholder="ex. Malade, désolée"></div><p class="note">À moins de 24 h, l\'annulation est comptée et visible par l\'administrateur.</p><div class="pied"><button class="btn dan" data-close data-toast="Rendez-vous annulé : Marie Dupont est prévenue.">Annuler le rendez-vous</button><button class="btn sec" data-close>Garder</button></div>',
};
let etat = 'reserver', m;
function rendre() { document.getElementById('ecran').innerHTML = E[etat](); document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat)); window.scrollTo(0, 0); }
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(m); m = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-bulle]'); if (b) { const o = b.parentElement.querySelector('.bulle'); if (o) { o.remove(); return; } const d = document.createElement('div'); d.className = 'bulle'; d.textContent = b.dataset.bulle; b.parentElement.appendChild(d); return; }
  const j = ev.target.closest('.jour'); if (j) { j.parentElement.querySelectorAll('.jour').forEach(x => x.setAttribute('aria-pressed', x === j)); return; }
  const c = ev.target.closest('.choix button:not([disabled])'); if (c) { c.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === c)); return; }
  const el = ev.target.closest('[data-e],[data-fen],[data-close],[data-toast]'); if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
  if (el.dataset.e) { etat = el.dataset.e; rendre(); }
  if (el.dataset.toast) toast(el.dataset.toast);
});
rendre();
</script>
