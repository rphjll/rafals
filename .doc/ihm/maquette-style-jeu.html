<style>
/* Mise en page : barre d'icônes (les vraies pages de rafals) en haut ; à gauche les lignes (ligne choisie entourée) ; à droite l'aide et les choix ; boutons en bas à droite. Ambiance sombre unique, voulue. */
:root{
  color-scheme: dark;
  --fond1:#1d5592; --fond2:#0b1e3d; --fond3:#06122a;
  --texte:#eef3fb; --doux:#9fb3cc; --eteint:#6c7f99;
  --trait:#5d6f88; --trait-on:#ffffff; --trait-bleu:#1d3f86;
  --cadre:#f4f7d9; --barre:#0d1a33; --barre-icone:#c7d3e4;
  --choisi-fond:#ffffff; --choisi-texte:#0b1e3d;
  --bouton:#2a4b85; --bouton-bord:#5c7fbd; --vif:#ffd84a;
  --forme:rgba(140,190,255,.10); --forme-bord:rgba(170,210,255,.22);
  --rouge:#ff5a5a;
  --titre:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --corps:"Barlow","Segoe UI",system-ui,sans-serif;
}
:root[data-ambiance="vert"]{ --fond1:#227552; --fond2:#0c2a1d; --fond3:#061710; --trait-bleu:#2F6B4F; --barre:#0b2018; --bouton:#2F6B4F; --bouton-bord:#79C49C; --doux:#a9c9b8; --vif:#F0955A; --forme:rgba(121,196,156,.11); --forme-bord:rgba(150,230,190,.24); }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fond3);color:var(--texte);font-family:var(--corps);font-size:15px;overflow-x:hidden}

/* ---------- Arrière-plan : dégradé + formes qui flottent ---------- */
.fond{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(90% 80% at 30% 35%,var(--fond1) 0%,var(--fond2) 55%,var(--fond3) 100%);transition:background .6s}
.forme{position:absolute;border:2px solid var(--forme-bord);background:var(--forme);animation:derive 22s ease-in-out infinite alternate;will-change:transform}
.f1{width:300px;height:300px;border-radius:56px;left:-60px;top:52%;--r:18deg}
.f2{width:200px;height:200px;border-radius:50%;right:10%;top:-40px;animation-duration:26s}
.f3{width:150px;height:150px;border-radius:28px;right:-30px;bottom:14%;--r:45deg;animation-duration:19s}
.f4{width:100px;height:100px;border-radius:22px;left:44%;bottom:6%;--r:30deg;animation-duration:24s}
.f5{width:460px;height:460px;border-radius:50%;left:18%;top:-280px;background:none;animation-duration:34s}
.f6{width:70px;height:70px;border-radius:16px;left:24%;top:30%;--r:12deg;animation-duration:17s}
@keyframes derive{
  0%{transform:translate(0,0) rotate(var(--r,0deg))}
  50%{transform:translate(70px,-50px) rotate(calc(var(--r,0deg) + 25deg))}
  100%{transform:translate(-40px,40px) rotate(calc(var(--r,0deg) - 15deg))}
}
.bulle{position:absolute;bottom:-40px;width:18px;height:18px;border-radius:5px;border:2px solid var(--forme-bord);background:var(--forme);animation:monte linear infinite}
@keyframes monte{to{transform:translateY(-115vh) rotate(220deg)}}
.lueur{position:absolute;left:50%;top:45%;width:70vmax;height:70vmax;margin:-35vmax 0 0 -35vmax;background:radial-gradient(circle,rgba(120,180,255,.16),transparent 60%);animation:respire 8s ease-in-out infinite}
:root[data-ambiance="vert"] .lueur{background:radial-gradient(circle,rgba(121,196,156,.16),transparent 60%)}
@keyframes respire{50%{transform:scale(1.15);opacity:.55}}
.fond.arret *{animation-play-state:paused!important}

/* ---------- Écran ---------- */
.ecran{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
.haut{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px}
.logo{font-family:var(--titre);font-weight:900;font-style:italic;font-size:28px;line-height:32px}
.logo i{color:#F0955A;font-style:normal}
.centre{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.icones{display:flex;gap:2px;background:var(--barre);padding:4px;border-radius:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.ico{all:unset;cursor:pointer;position:relative;width:46px;height:32px;flex:none;display:grid;place-items:center;border-radius:3px;color:var(--barre-icone);transition:background .15s,color .15s}
.ico svg{width:20px;height:20px}
.ico:hover{background:rgba(255,255,255,.1);color:#fff}
.ico[aria-selected="true"]{background:#d8e2ef;color:var(--fond2)}
.ico:focus-visible{outline:2px solid var(--cadre);outline-offset:2px}
.pastille{position:absolute;top:1px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--rouge);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.nom-onglet{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.compte{justify-self:end;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--vif);color:#1a1500;display:grid;place-items:center;font-weight:700}

.corps{flex:1;display:grid;grid-template-columns:28px minmax(0,1fr) 10px minmax(0,380px);gap:24px;margin-top:22px}
.repere{background:rgba(255,255,255,.07);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:14px 0;align-self:start;height:240px;margin-top:20px}
.repere span{width:3px;height:3px;background:var(--doux);border-radius:2px;transition:height .3s,background .3s}
.repere span.on{height:22px;background:#fff}

.liste{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 190px);overflow-y:auto;scrollbar-width:none;padding:4px 6px 4px 4px;min-width:0}
.liste::-webkit-scrollbar{display:none}
.vue{animation:entre .3s ease-out}
@keyframes entre{from{opacity:0;transform:translateX(-18px)}}
.groupe{font-family:var(--titre);font-weight:900;font-style:italic;font-size:26px;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 6px 6px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.groupe:first-child{margin-top:0}
.ligne{display:grid;grid-template-columns:minmax(0,1fr) 210px;align-items:center;gap:12px;padding:9px 14px;border:2px solid transparent;border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.ligne:hover{background:rgba(255,255,255,.05)}
.ligne.active{border-color:var(--cadre);background:rgba(4,12,30,.55);box-shadow:0 0 18px rgba(244,247,217,.18)}
.ligne:focus-visible{outline:none;border-color:var(--cadre)}
.ligne .nom{font-weight:600;min-width:0}
.ligne .nom small{display:block;font-weight:500;font-size:13px;color:var(--doux)}
.ligne.grise .nom,.ligne.grise .val{color:var(--eteint)}
.val-zone{display:grid;grid-template-columns:20px 1fr 20px;align-items:center}
.fleche{all:unset;cursor:pointer;visibility:hidden;font-weight:700;font-size:18px;text-align:center}
.ligne.active .fleche{visibility:visible}
.fleche:hover{color:var(--cadre)}
.val{text-align:center;font-weight:500}
.val.chiffre{font-family:var(--titre);font-style:italic;font-weight:900;font-size:22px;color:var(--vif)}
.val.nouveau{color:var(--vif);font-weight:700}
.traits{grid-column:1/-1;display:flex;gap:6px;justify-content:center;margin-top:5px}
.traits span{flex:1;max-width:44px;height:3px;background:var(--trait)}
.traits span.on{background:var(--trait-on)}
.traits.deux span{max-width:66px}
.traits.deux span.bleu{background:var(--trait-bleu)}
.ouvrir{text-align:center;font-weight:700;color:var(--doux)}

.ascenseur{background:rgba(255,255,255,.08);border-radius:4px;position:relative;margin:8px 0}
.ascenseur span{position:absolute;left:0;right:0;top:var(--haut,0%);height:var(--taille,40%);background:#c9d4e4;border-radius:4px;transition:top .25s}

.aide{padding-top:4px;min-width:0}
.aide h2{margin:0 0 10px;font-size:17px;font-weight:700}
.aide p{margin:0 0 10px;color:var(--doux);line-height:1.45;font-weight:500}
.exemple{font-size:14px;border-left:2px solid var(--doux);padding:4px 0 4px 10px;margin:14px 0 22px}
.options{display:flex;flex-direction:column;gap:2px;max-width:260px}
.opt{all:unset;cursor:pointer;font-weight:700;font-size:14px;text-transform:uppercase;padding:3px 10px 3px 16px;position:relative}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.on{background:var(--choisi-fond);color:var(--choisi-texte)}
.opt.on::before{content:"";position:absolute;left:5px;top:50%;margin-top:-4px;border:4px solid transparent;border-left-color:var(--choisi-texte)}
.opt:focus-visible{outline:2px solid var(--cadre)}
.gros{all:unset;cursor:pointer;display:inline-block;font-family:var(--titre);font-weight:900;font-style:italic;font-size:22px;text-transform:uppercase;background:var(--vif);color:#1a1500;padding:6px 22px;transform:skewX(-10deg);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .1s}
.gros:hover{transform:skewX(-10deg) translateY(-2px)}
.gros:focus-visible{outline:2px solid #fff;outline-offset:3px}
.note{margin-top:14px;font-size:13px;color:#8fe0b4;font-weight:600;opacity:0;transition:opacity .2s}
.note.vu{opacity:1}

.bas{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.signe{font-size:11px;color:var(--doux)}
.boutons{display:flex;gap:10px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--bouton);border:1px solid var(--bouton-bord);padding:7px 16px 7px 8px;border-radius:5px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;transition:filter .15s}
.btn:hover{filter:brightness(1.2)}
.btn:focus-visible{outline:2px solid var(--cadre);outline-offset:2px}
.touche{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:4px;background:#c9d4e4;color:var(--fond2);font-size:11px;font-weight:700}

@media (max-width:900px){
  .haut{grid-template-columns:1fr auto}
  .centre{grid-column:1/-1;grid-row:2}
  .corps{grid-template-columns:minmax(0,1fr);gap:16px}
  .repere,.ascenseur{display:none}
  .liste{max-height:none;overflow:visible}
  .aide{background:rgba(4,12,30,.55);border-radius:10px;padding:16px}
}
@media (max-width:480px){
  .ligne{grid-template-columns:minmax(0,1fr) 140px;padding:8px 10px}
  .groupe{font-size:22px}
  .ico{width:40px}
}
</style>

const etat={};PAGES.forEach(p=>p.lignes.forEach(l=>{if(l.id)etat[l.id]=l.d;}));
let page=PAGES.findIndex(p=>p.k==='parametres'),act=0;
const $=s=>document.querySelector(s);
const vraies=()=>PAGES[page].lignes.filter(l=>!l.g);

function traits(l){
  const v=etat[l.id];
  if(l.vals.length===2)return `<div class="traits deux"><span class="${v?'bleu':'on'}"></span><span class="${v?'on':''}"></span></div>`;
  return `<div class="traits">${l.vals.map((_,i)=>`<span class="${i===v?'on':''}"></span>`).join('')}</div>`;
}
function dessineIcones(){
  $('#icones').innerHTML=PAGES.map((p,i)=>`<button class="ico" role="tab" aria-selected="${i===page}" aria-label="${p.nom}" data-p="${i}">${SVG[p.k]}${p.pastille?`<span class="pastille">${p.pastille}</span>`:''}</button>`).join('');
  $('#nom-onglet').textContent=PAGES[page].nom;
}
function dessineListe(anime){
  let n=0;
  const L=$('#liste');
  L.classList.toggle('vue',!!anime);
  L.innerHTML=PAGES[page].lignes.map(l=>{
    if(l.g)return `<div class="groupe">${l.g}</div>`;
    const i=n++;const cls=`ligne${i===act?' active':''}${l.grise?' grise':''}`;
    const nom=`<span class="nom">${l.nom}${l.sous?`<small>${l.sous}</small>`:''}</span>`;
    if(l.t==='l')return `<div class="${cls}" tabindex="0" data-i="${i}">${nom}<div class="val-zone"><span></span><span class="val${l.chiffre?' chiffre':''}${l.nouveau?' nouveau':''}">${l.v}</span><span class="ouvrir">›</span></div></div>`;
    return `<div class="${cls}" tabindex="0" data-i="${i}">${nom}<div class="val-zone"><button class="fleche" data-pas="-1" aria-label="Précédent">‹</button><span class="val">${l.vals[etat[l.id]]}</span><button class="fleche" data-pas="1" aria-label="Suivant">›</button>${traits(l)}</div></div>`;
  }).join('');
  if(anime)setTimeout(()=>L.classList.remove('vue'),320);
  const total=vraies().length,part=Math.max(18,Math.min(100,400/total));
  $('#repere').innerHTML=Array.from({length:4},(_,k)=>`<span class="${Math.min(3,Math.floor(act/total*4))===k?'on':''}"></span>`).join('');
  const c=$('#curseur');c.style.setProperty('--taille',part+'%');c.style.setProperty('--haut',(act/Math.max(1,total-1))*(100-part)+'%');
  const a=L.querySelector('.ligne.active');if(a)a.scrollIntoView({block:'nearest'});
  dessineAide();
}
function dessineAide(){
  const l=vraies()[act];
  let bas='';
  if(l.t==='r')bas=`<div class="options">${l.vals.map((v,i)=>`<button class="opt${i===etat[l.id]?' on':''}" data-o="${i}">${v}</button>`).join('')}</div><div class="note" id="note">✓ Enregistré</div>`;
  else if(l.bouton)bas=`<button class="gros" data-ouvre="1">${l.bouton}</button><div class="note" id="note">Dans le vrai site, cette page s'ouvrirait.</div>`;
  $('#aide').innerHTML=`<h2>${l.nom}</h2><p>${l.aide}</p><div class="exemple">${l.ex}</div>${bas}`;
}
function montre(){const e=$('#note');if(!e)return;e.classList.add('vu');clearTimeout(montre.t);montre.t=setTimeout(()=>e.classList.remove('vu'),1400);}
function applique(){
  document.documentElement.dataset.ambiance=etat.ambiance?'vert':'';
  $('#fond').classList.toggle('arret',!etat.anim);
}
function choisit(v){
  const l=vraies()[act];if(l.t!=='r')return;
  etat[l.id]=(v+l.vals.length)%l.vals.length;applique();dessineListe();montre();
}
function allerA(i){page=i;act=0;dessineIcones();dessineListe(true);}

document.addEventListener('click',e=>{
  const ic=e.target.closest('.ico');if(ic){allerA(+ic.dataset.p);return;}
  const ligne=e.target.closest('.ligne');
  const f=e.target.closest('.fleche');if(f&&ligne){act=+ligne.dataset.i;choisit(etat[vraies()[act].id]+ +f.dataset.pas);return;}
  if(ligne){act=+ligne.dataset.i;dessineListe();return;}
  const o=e.target.closest('.opt');if(o){choisit(+o.dataset.o);return;}
  if(e.target.closest('[data-ouvre]')){const l=vraies()[act];if(l.va)allerA(PAGES.findIndex(p=>p.k===l.va));else montre();return;}
  if(e.target.closest('#defaut')){PAGES[page].lignes.forEach(l=>{if(l.id)etat[l.id]=l.d;});applique();dessineListe();return;}
  if(e.target.closest('#retour')){allerA(0);}
});
document.addEventListener('keydown',e=>{
  const k=e.key,n=vraies().length;
  if(k==='ArrowDown'){e.preventDefault();act=(act+1)%n;dessineListe();}
  else if(k==='ArrowUp'){e.preventDefault();act=(act-1+n)%n;dessineListe();}
  else if(k==='ArrowRight'||k==='ArrowLeft'){const l=vraies()[act];if(l.t==='r'){e.preventDefault();choisit(etat[l.id]+(k==='ArrowRight'?1:-1));}}
  else if(k==='q'||k==='Q'||k==='e'||k==='E'){allerA((page+(k.toLowerCase()==='e'?1:-1)+PAGES.length)%PAGES.length);}
  else if(k==='r'||k==='R'){$('#defaut').click();}
  else if(k==='Escape'){allerA(0);}
});
applique();dessineIcones();dessineListe(true);
</script>
