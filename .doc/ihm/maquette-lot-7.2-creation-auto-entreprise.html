<title>Maquette rafals création</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}

.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}

.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:36px;padding:6px 12px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-att{background:var(--att-doux);color:var(--att)}
.note{font-size:13.5px;color:var(--doux);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-att{background:var(--att-doux);color:var(--att)} .a-err{background:var(--err-doux);color:var(--err)}
.etoiles{color:var(--accent);font-size:18px;letter-spacing:1px}
.choix-etoiles{display:flex;gap:4px} .choix-etoiles button{font-size:30px;border:0;background:none;cursor:pointer;color:var(--bord);padding:0 2px;min-height:42px} .choix-etoiles button.on{color:var(--accent)}
.avis{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--bord);padding-top:12px}
.avis:first-of-type{border-top:0;padding-top:0}
.reponse{margin-left:18px;border-left:3px solid var(--prim-doux);padding:4px 10px;font-size:14px}
.rdv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bord);padding-top:14px}
.rdv:first-of-type{border-top:0;padding-top:0}
.monavis{background:var(--fond);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap} .grosse{font-size:34px;font-weight:700}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.compteur{margin-left:4px;background:var(--accent);color:var(--sur);border-radius:999px;padding:1px 7px;font-size:12px}
.mots{display:flex;flex-wrap:wrap;gap:6px} .mot{display:inline-flex;align-items:center;gap:6px;background:var(--neu-doux);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px} .mot button{border:0;background:var(--surface);color:var(--err);border-radius:999px;width:24px;height:24px;cursor:pointer;font-weight:700}
input,textarea{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}

.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}

.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
.b-ok{background:var(--ok-doux);color:var(--ok)} .b-err{background:var(--err-doux);color:var(--err)}
.a-ok{background:var(--ok-doux);color:var(--ok)} .a-neu{background:var(--neu-doux);color:var(--neu)}
.ver{background:var(--neu-doux);color:var(--neu);border-color:var(--neu-doux)}
.lignes{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px} .lignes span:nth-child(odd){color:var(--doux)}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:8px} .choix button{font:inherit;border:1px solid var(--bord);background:var(--surface);color:var(--texte);border-radius:10px;min-height:52px;padding:8px;cursor:pointer;text-align:left}
.choix button[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);font-weight:600}
.case{display:flex;gap:10px;align-items:flex-start;font-size:14px} .case input{width:20px;min-height:20px;height:20px;margin-top:2px}
.etats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--doux);align-items:center}
.tableau{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bord)} th{color:var(--doux);font-weight:600;font-size:13px} th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px} .chiffre{background:var(--fond);border-radius:10px;padding:10px 12px} .chiffre b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.etq{font-weight:600;font-size:13px}
.ligne-form{display:grid;grid-template-columns:1fr 70px 100px auto;gap:6px;align-items:center}
.ligne-form .court{text-align:right}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px} .deux label{display:flex;flex-direction:column;gap:4px}
.choix.trois{grid-template-columns:1fr 1fr 1fr}
.photos{display:flex;gap:6px} .photos span{background:var(--neu-doux);border-radius:8px;padding:14px 18px}
.fenetre{width:min(560px,100%);max-height:90vh;overflow-y:auto}
@media (max-width:480px){.ligne-form{grid-template-columns:1fr 60px 80px auto}.deux{grid-template-columns:1fr}}

select{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
.champ{display:flex;flex-direction:column;gap:4px} .champ small{color:var(--doux);font-size:13px} .etq i{font-weight:400;color:var(--doux)}
.deux{align-items:start}
.etapes{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--doux)}
.etapes li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--bord);border-radius:999px;background:var(--surface)}
.etapes li b{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--neu-doux);color:var(--neu);font-size:12px}
.etapes li.ici{border-color:var(--prim);color:var(--prim);font-weight:700} .etapes li.ici b{background:var(--prim);color:var(--prim-t)}
.etapes li.faite b{background:var(--ok-doux);color:var(--ok)}
.fichier{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border:1px solid var(--bord);border-radius:10px;padding:12px}
.fichier>div:first-child{flex:1 1 260px}
.suivi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.suivi li{display:flex;gap:12px;align-items:flex-start}
.suivi li>b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--neu-doux);color:var(--neu)}
.suivi li.faite>b{background:var(--ok-doux);color:var(--ok)} .suivi li.ici>b{background:var(--att-doux);color:var(--att)}
u[data-e],u[data-fen]{color:var(--prim);cursor:pointer}

<div class="bandeau"><b>Maquette lot 7.2</b> · Karim crée son auto-entreprise sans quitter rafals :
  <button class="onglet" data-e="depart" aria-pressed="true">0. Départ</button>
  <button class="onglet" data-e="vous">1. Vous</button>
  <button class="onglet" data-e="activite">2. Votre activité</button>
  <button class="onglet" data-e="choix">3. Vos choix</button>
  <button class="onglet" data-e="papiers">4. Vos papiers</button>
  <button class="onglet" data-e="envoi">5. Vérifier et envoyer</button>
  <button class="onglet" data-e="suivi">6. Suivi du dossier</button>
  <button class="onglet" data-e="corriger">7. Un papier à refaire</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const ORDRE = ['depart', 'vous', 'activite', 'choix', 'papiers', 'envoi', 'suivi', 'corriger'];
const NOMS = ['Vous', 'Votre activité', 'Vos choix', 'Vos papiers', 'Vérifier et envoyer'];
const etapes = n => '<ol class="etapes">' + NOMS.map((x, i) => '<li class="' + (i + 1 < n ? 'faite' : i + 1 === n ? 'ici' : '') + '"><b>' + (i + 1 < n ? '✓' : i + 1) + '</b><span>' + x + '</span></li>').join('') + '</ol>';
const champ = (nom, valeur, aide, opt) => '<label class="champ"><span class="etq">' + nom + (opt ? ' <i>(facultatif)</i>' : ' *') + '</span><input value="' + valeur + '">' + (aide ? '<small>' + aide + '</small>' : '') + '</label>';
const liste = (nom, options, aide) => '<label class="champ"><span class="etq">' + nom + ' *</span><select>' + options.map(o => '<option>' + o + '</option>').join('') + '</select>' + (aide ? '<small>' + aide + '</small>' : '') + '</label>';
const bascule = (nom, options, choisi, aide) => '<div class="champ"><span class="etq">' + nom + ' *</span><div class="choix' + (options.length === 3 ? ' trois' : '') + '">' + options.map((o, i) => '<button aria-pressed="' + (i === choisi) + '">' + o + '</button>').join('') + '</div>' + (aide ? '<small>' + aide + '</small>' : '') + '</div>';
const pied = (avant, apres, texte) => '<div class="pied">' + (avant ? '<button class="btn sec" data-e="' + avant + '">Retour</button>' : '<span></span>') + '<button class="btn prim" data-e="' + apres + '" data-toast="Enregistré.">' + (texte || 'Enregistrer et continuer') + '</button></div>';
const fichier = (titre, texte, etat, bouton) => '<div class="fichier"><div><b>' + titre + '</b><p class="note">' + texte + '</p></div><div class="actions">' + etat + (bouton ? '<button class="btn sec petit" data-toast="(choix d\'un fichier sur l\'appareil)">' + bouton + '</button>' : '') + '</div></div>';

const E = {};
E.depart = () => '<h1>Créer mon auto-entreprise</h1>' +
  '<div class="carte"><h2>rafals fait la démarche avec vous</h2><p>Vous répondez à quelques questions ici, vous déposez 2 ou 3 papiers, et rafals envoie votre dossier au guichet officiel de l\'État. Vous n\'avez aucun autre site à ouvrir.</p>' +
  '<div class="lignes"><span>Durée</span><span>environ 15 minutes</span><span>Prix</span><span>gratuit</span><span>Résultat</span><span>votre numéro SIRET, sous 1 à 4 semaines, ajouté tout seul à votre profil</span></div>' +
  '<div class="alerte a-neu">À préparer : votre pièce d\'identité, votre numéro de sécurité sociale (sur la carte Vitale) et, pour un métier réglementé (plombier, coiffeur…), votre diplôme.</div>' +
  '<div class="actions"><button class="btn prim" data-e="vous">Commencer</button><button class="btn sec" data-toast="(ouvre le guide en 5 étapes qui existe déjà)">Je préfère le faire moi-même</button></div></div>' +
  '<div class="carte"><h2>Vous avez déjà une entreprise ?</h2><p>Auto-entreprise, entreprise individuelle ou société : ne créez rien. Écrivez son numéro SIRET, rafals le vérifie tout seul et l\'ajoute à votre profil.</p>' +
  '<label class="champ"><span class="etq">Numéro SIRET *</span><input value="912 345 678 00012"><small>14 chiffres, sur vos papiers de l\'INSEE ou de l\'URSSAF.</small></label>' +
  '<div class="actions"><button class="btn prim" data-toast="SIRET vérifié : BENALI Karim, Mérignac. Ajouté à votre profil.">Ajouter mon entreprise</button></div></div>' +
  '<p class="note"><b>Si Karim a déjà un SIRET dans son profil</b>, la page affiche seulement : « Vous avez déjà une entreprise (SIRET 912 345 678 00012) : il n\'y a rien à créer. » et le bouton [Commencer] disparaît. Sans profil de prestataire, [Ajouter mon entreprise] l\'emmène d\'abord créer son profil, le SIRET déjà rempli.</p>' +
  '<p class="note">Il faut être connecté : le dossier est gardé dans le compte, on peut s\'arrêter et reprendre plus tard. Le guide actuel (« je le fais moi-même sur le site de l\'État ») reste disponible. Si Karim a déjà un dossier commencé, le bouton devient [Reprendre mon dossier].</p>';

E.vous = () => '<h1>Créer mon auto-entreprise</h1>' + etapes(1) +
  '<div class="carte"><h2>Vous</h2><p class="note">Écrivez exactement comme sur votre pièce d\'identité.</p>' +
  bascule('Civilité', ['Monsieur', 'Madame'], 0) +
  '<div class="deux">' + champ('Nom de naissance', 'BENALI') + champ('Nom d\'usage', '', 'ex. nom d\'époux ou d\'épouse', true) + '</div>' +
  champ('Prénoms', 'Karim, Youssef', 'Tous vos prénoms, séparés par une virgule.') +
  '<div class="deux">' + champ('Date de naissance', '14/03/1998') + champ('Ville de naissance', 'Bordeaux (33)', 'Né à l\'étranger : choisissez le pays.') + '</div>' +
  '<div class="deux">' + liste('Nationalité', ['Française', 'Autre pays de l\'Union européenne', 'Autre pays']) + liste('Situation de famille', ['Célibataire', 'En concubinage', 'Pacsé', 'Marié', 'Divorcé', 'Veuf']) + '</div>' +
  champ('Numéro de sécurité sociale', '1 98 03 33 063 123 45', 'Les 15 chiffres de votre carte Vitale. Il sert à vous rattacher à l\'URSSAF ; rafals l\'efface dès que votre dossier est accepté.') +
  '<h3>Votre adresse</h3>' + champ('Numéro et rue', '12 rue des Lilas') + '<div class="deux">' + champ('Code postal', '33700') + champ('Ville', 'Mérignac') + '</div>' +
  '<div class="deux">' + champ('Mail', 'karim.benali@example.com') + champ('Téléphone', '06 12 34 56 78') + '</div>' +
  pied('depart', 'activite') + '</div>' +
  '<p class="note">Le nom, le prénom, le mail, le téléphone et l\'adresse sont remplis d\'avance avec ceux du compte. « Marié » ou « Pacsé » fait apparaître une question de plus : « Votre conjoint travaille-t-il avec vous dans l\'entreprise ? » (si oui : rafals renvoie vers le site de l\'État, ce cas est trop particulier). « Autre pays » demande en plus le titre de séjour à l\'étape 4. Moins de 18 ans : rafals demande l\'autorisation des parents à l\'étape 4.</p>';

E.activite = () => '<h1>Créer mon auto-entreprise</h1>' + etapes(2) +
  '<div class="carte"><h2>Votre activité</h2>' +
  liste('Votre métier', ['Plombier', 'Coiffeur à domicile', 'Ménage à domicile', 'Jardinier', '…'], 'La liste des métiers de rafals.') +
  '<div class="alerte a-att">Plombier est un métier réglementé : il faut un diplôme (CAP, BEP…) ou 3 ans d\'expérience. rafals vous demandera le papier à l\'étape 4.</div>' +
  champ('Décrivez ce que vous faites', 'Dépannage et installation de plomberie chez les particuliers', 'Une phrase simple. De 10 à 250 caractères.') +
  champ('Date de début', '01/11/2026', 'Au plus tôt aujourd\'hui, au plus tard dans 1 mois.') +
  bascule('Où travaillez-vous ?', ['Chez mes clients', 'Chez moi', 'Dans un local'], 0, 'Votre entreprise est déclarée à votre adresse : 12 rue des Lilas, 33700 Mérignac.') +
  champ('Nom commercial', 'Benali Plomberie', 'Sinon, votre entreprise porte votre nom.', true) +
  bascule('En même temps, vous êtes…', ['Rien d\'autre', 'Salarié', 'Retraité'], 1, 'Autre cas (étudiant, sans emploi…) : choisissez « Rien d\'autre ».') +
  bascule('Avez-vous déjà été à votre compte ?', ['Non, jamais', 'Oui'], 0, '« Oui » demande l\'ancien numéro SIREN. Si cette entreprise existe encore, rafals arrête le dossier : « Ne la recréez pas : ajoutez son SIRET à votre profil. »') +
  pied('vous', 'choix') + '</div>' +
  '<p class="note">« Dans un local » demande l\'adresse du local et un papier de plus (le bail). Les métiers que rafals ne sait pas déclarer (agriculture, professions libérales réglementées : avocat, médecin…) affichent : « Pour ce métier, la démarche se fait sur le site de l\'État » avec le lien.</p>';

E.choix = () => '<h1>Créer mon auto-entreprise</h1>' + etapes(3) +
  '<div class="carte"><h2>Vos choix</h2><p class="note">Trois questions. Si vous ne savez pas, gardez le choix conseillé : il se change plus tard.</p>' +
  bascule('Vous déclarerez à l\'URSSAF l\'argent encaissé…', ['Chaque trimestre (conseillé)', 'Chaque mois'], 0, 'ex. chaque trimestre : 4 déclarations par an. rafals vous enverra un rappel par mail.') +
  bascule('Payer l\'impôt en même temps que les cotisations ?', ['Non (conseillé)', 'Oui'], 0, 'Le « versement libératoire » : possible seulement sous un certain revenu. En cas de doute, répondez Non.') +
  '<label class="case"><input type="checkbox" checked><span><b>Demander la réduction de début d\'activité (ACRE)</b><br>Des cotisations moins chères la première année, si vous y avez droit. C\'est l\'URSSAF qui décide.</span></label>' +
  '<label class="case"><input type="checkbox" checked><span><b>Ne pas rendre mon adresse publique</b><br>Votre adresse personnelle n\'apparaîtra pas dans les annuaires d\'entreprises.</span></label>' +
  '<div class="alerte a-neu">Déjà choisi pour vous, car c\'est la règle des auto-entreprises : pas de TVA à facturer, et le régime « micro ».</div>' +
  pied('activite', 'papiers') + '</div>';

E.papiers = () => '<h1>Créer mon auto-entreprise</h1>' + etapes(4) +
  '<div class="carte"><h2>Vos papiers</h2><p class="note">En PDF ou en photo (rafals transforme la photo en PDF). 10 Mo au plus par papier.</p>' +
  fichier('Pièce d\'identité', 'Carte d\'identité (recto et verso) ou passeport. Écrivez à la main sur la copie : « J\'atteste sur l\'honneur que cette copie est conforme à l\'original », la date et votre signature.', '<span class="badge b-ok">déposé</span>', 'Remplacer') +
  fichier('Diplôme ou preuve de 3 ans d\'expérience', 'Demandé parce que Plombier est un métier réglementé. ex. CAP, ou bulletins de salaire.', '<span class="badge b-att">à déposer</span>', 'Choisir un fichier…') +
  fichier('Attestation sur l\'honneur', '« Je n\'ai jamais été condamné à une interdiction de gérer une entreprise. » rafals l\'écrit pour vous avec votre nom et celui de vos parents : il reste à la signer à l\'étape suivante.', '<span class="badge b-neu">préparée par rafals</span>') +
  '<div class="deux">' + champ('Nom et prénom de votre père', 'BENALI Ahmed', 'Demandé par l\'administration pour l\'attestation.') + champ('Nom de naissance et prénom de votre mère', 'HADDAD Samira') + '</div>' +
  pied('choix', 'envoi') + '</div>' +
  '<p class="note">Le bouton [Enregistrer et continuer] est verrouillé 🔒 tant qu\'un papier manque : « Il manque : le diplôme ». Les papiers sont rangés dans le placard à fichiers de rafals, lisibles seulement par Karim et par le serveur ; ils sont effacés dès que le dossier est accepté.</p>';

const ligneSuivi = (etat, titre, texte) => '<li class="' + etat + '"><b>' + (etat === 'faite' ? '✓' : etat === 'ici' ? '…' : '') + '</b><div><strong>' + titre + '</strong><p class="note">' + texte + '</p></div></li>';
E.suivi = () => '<h1>Mon dossier de création</h1>' +

const F = { pouvoir: '<h3>Pouvoir donné à rafals</h3><p>Je soussigné Karim Youssef BENALI, né le 14/03/1998 à Bordeaux, demeurant 12 rue des Lilas, 33700 Mérignac, donne pouvoir à rafals pour effectuer en mon nom la déclaration de création de mon entreprise individuelle auprès du guichet des formalités des entreprises, et pour répondre aux demandes de correction de ce dossier.</p><p class="note">Fait sur rafals le 04/10/2026 à 15 h 18. Ce pouvoir vaut pour ce dossier seulement ; il est joint au dossier envoyé.</p><div class="pied"><span></span><button class="btn prim" data-ferme>Fermer</button></div>' };

const ecran = document.getElementById('ecran'), couche = document.getElementById('couche'), toast = document.getElementById('toast');
function montrer(e) {
  ecran.innerHTML = E[e]();
  document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === e));
  window.scrollTo(0, 0);
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-e],[data-fen],[data-ferme],[data-toast],.choix button');
  if (!t) return;
  if (t.matches('.choix button')) t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t));
  if (t.dataset.toast) { toast.textContent = t.dataset.toast; toast.hidden = false; setTimeout(() => { toast.hidden = true; }, 2200); }
  if (t.dataset.fen) couche.innerHTML = '<div class="voile"><div class="fenetre">' + F[t.dataset.fen] + '</div></div>';
  if (t.hasAttribute('data-ferme')) couche.innerHTML = '';
  if (t.dataset.e) montrer(t.dataset.e);
});
montrer('depart');
