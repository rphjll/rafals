<title>Maquette rafals annonces</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
.menu{display:flex;gap:14px;font-size:14px;color:var(--doux);flex-wrap:wrap} .menu b{color:var(--prim)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.champ{display:flex;flex-direction:column;gap:6px} .champ label,.leg{font-weight:600;font-size:13px} .champ label i,.leg i{color:var(--err);font-style:normal}
input,select,textarea{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:520px){.deux{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)} .ver{background:var(--neu-doux);color:var(--neu);border-color:var(--neu-doux);cursor:not-allowed}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-ok{background:var(--ok-doux);color:var(--ok)} .b-att{background:var(--att-doux);color:var(--att)} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-err{background:var(--err-doux);color:var(--err)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13.5px;color:var(--doux);margin:0}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-err{background:var(--err-doux);color:var(--err)} .a-att{background:var(--att-doux);color:var(--att)}
.choix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} @media (max-width:520px){.choix{grid-template-columns:1fr}}
.choix button{font:inherit;text-align:left;border:1px solid var(--bord);background:var(--fond);color:var(--texte);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:42px}
.choix button[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);color:var(--prim);font-weight:600}
.choix small{display:block;font-weight:400;color:var(--doux);font-size:12.5px}
.coche{display:flex;gap:10px;align-items:center;min-height:42px} .coche input{width:20px;min-height:20px;accent-color:var(--prim)}
.ligne-annonce{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;border-top:1px solid var(--bord);padding-top:14px}
.ligne-annonce:first-of-type{border-top:0;padding-top:0}
.vignette{width:72px;height:72px;border-radius:10px;background:var(--prim-doux);display:grid;place-items:center;color:var(--prim);font-weight:700;font-size:13px}
.prix{font-weight:700;color:var(--prim)}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photo{width:96px;height:96px;border-radius:10px;background:linear-gradient(135deg,var(--prim-doux),var(--ok-doux));position:relative;display:grid;place-items:center;color:var(--prim);font-weight:700}
.photo button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:var(--surface);color:var(--err);cursor:pointer;font-weight:700}
.ajout{width:96px;height:96px;border:1.5px dashed var(--prim);border-radius:10px;display:grid;place-items:center;color:var(--prim);font-weight:600;font-size:13px;text-align:center;cursor:pointer;background:transparent}
.galerie{height:220px;border-radius:10px;background:linear-gradient(135deg,var(--prim-doux),var(--ok-doux));display:grid;place-items:center;color:var(--prim);font-weight:700}
.infos{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14.5px} .infos dt{color:var(--doux)} .infos dd{margin:0;font-weight:500}
.metier{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--bord);padding-top:12px}
.metier:first-of-type{border-top:0;padding-top:0}
.ariane{font-size:13.5px;color:var(--doux)}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
.bulle{background:var(--texte);color:var(--surface);border-radius:8px;padding:9px 12px;font-size:13px;max-width:320px}
</style>

<div class="bandeau"><b>Maquette lot 3.2</b> · écrans :
  <button class="onglet" data-e="activite" aria-pressed="true">1. Mon activité</button>
  <button class="onglet" data-e="liste">2. Mes annonces</button>
  <button class="onglet" data-e="ecrire">3. Écrire une annonce</button>
  <button class="onglet" data-e="modifier">4. Modifier + photos</button>
  <button class="onglet" data-e="apercu">5. L'annonce vue par un client</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span><nav class="menu"><span>Trouver</span><b>Mon activité</b><b>Mes annonces</b><span>Mon compte</span></nav></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div id="couche"></div><div class="toast" id="toast" hidden></div>

<script>
const E = {};
E.activite = '<h1>Mon activité</h1>' +
  '<div class="carte"><div class="tete"><h2>Karim Benali <span class="badge b-ok">actif</span></h2><button class="btn sec">Modifier mon profil</button></div><p class="note">Plombier · Pessac (33600), jusqu\'à 15 km · <span class="badge b-ok">SIRET vérifié</span></p><p class="note">(carte du profil : inchangée, lot 2.5)</p></div>' +
  '<div class="carte"><div class="tete"><h2>Mes annonces</h2><span class="note">3 en ligne sur 20</span></div><p class="note">Vous apparaissez dans les recherches grâce à vos annonces en ligne.</p><div class="actions"><button class="btn prim" data-e="liste">Voir mes annonces</button><button class="btn sec" data-e="ecrire">Écrire une annonce</button></div></div>' +
  '<div class="carte"><h2>Mes métiers</h2>' +
    '<div class="metier"><div><b>Plombier</b> <span class="badge b-ok">principal</span><p class="note">Fin prévue le 15/11/2026 : ensuite, Électricien deviendra votre métier principal.</p></div><button class="btn sec" data-fen="fin">Changer la date de fin…</button></div>' +
    '<div class="metier"><div><b>Électricien</b></div><button class="btn sec" data-fen="finsec">Mettre une date de fin…</button></div>' +
    '<div class="metier"><div><b>Chauffagiste</b> <span class="badge b-neu">arrêté depuis le 31/08/2026</span><p class="note">Ses 2 annonces sont en pause : reprenez le métier, puis republiez-les.</p></div><button class="btn prim" data-toast="Chauffagiste repris : republiez ses annonces dans « Mes annonces ».">Reprendre ce métier</button></div>' +
    '<p class="note">Ajouter un métier : [Modifier mon profil]. Un métier se termine par une date de fin (il sera aussi visible dans votre agenda au lot 3.4). Les rendez-vous pris après cette date seront annulés (quand les rendez-vous existeront).</p></div>' +
  '<div class="carte"><h2>Mon local</h2><p style="margin:0;font-weight:500">3 rue du Moulin<br>33600 Pessac</p><p class="note">Pour vos annonces « chez moi ». Les clients voient seulement « Pessac » ; la rue, après avoir réservé.</p><div class="actions"><button class="btn sec">Modifier</button><button class="btn dan" data-toast-err="Des annonces en ligne ont lieu chez vous : mettez-les en pause ou changez leur lieu d\'abord.">Effacer l\'adresse</button></div><div class="alerte a-err" id="errlocal" hidden></div></div>' +
  '<div class="carte"><h2>Visibilité</h2><p class="note">(inchangée, lot 2.5 : pause, reprise, arrêt)</p></div>';

const ligne = (titre, prix, metier, badge, raison, boutons, photo) => '<div class="ligne-annonce"><div class="vignette">' + (photo || 'sans<br>photo') + '</div><div style="display:flex;flex-direction:column;gap:6px"><div class="tete"><h3>' + titre + '</h3>' + badge + '</div><p class="note"><span class="prix">' + prix + '</span> · ' + metier + '</p>' + (raison ? '<p class="note">' + raison + '</p>' : '') + '<div class="actions">' + boutons + '</div></div></div>';
const bModif = '<button class="btn sec" data-e="modifier">Modifier</button>', bApercu = '<button class="btn sec" data-e="apercu">Voir comme un client</button>';
E.liste = '<p class="ariane">Mon activité › Mes annonces</p><div class="tete"><h1>Mes annonces</h1><button class="btn prim" data-e="ecrire">Écrire une annonce</button></div>' +
  '<p class="note">3 annonces en ligne sur 20 au plus.</p>' +
  '<div class="carte">' +
    ligne('Dépannage fuite', '50 € · 2 h', 'Plombier · chez le client · carte ou espèces', '<span class="badge b-ok">en ligne</span>', '', bModif + bApercu + '<button class="btn sec" data-toast="Annonce mise en pause.">Mettre en pause</button><button class="btn dan" data-fen="retirer" style="margin-left:auto">Retirer…</button>', '3 photos') +
    ligne('Dépannage à l\'heure', '40 €/h · de 1 h à 3 h', 'Plombier · chez le client · espèces', '<span class="badge b-ok">en ligne</span>', '', bModif + bApercu + '<button class="btn sec">Mettre en pause</button><button class="btn dan" data-fen="retirer" style="margin-left:auto">Retirer…</button>') +
    ligne('Tableau électrique', 'Sur devis', 'Électricien · chez le client · espèces', '<span class="badge b-ok">en ligne</span>', '', bModif + bApercu + '<button class="btn sec">Mettre en pause</button><button class="btn dan" data-fen="retirer" style="margin-left:auto">Retirer…</button>') +
    ligne('Entretien chaudière', '80 € · 1 h', 'Chauffagiste · chez le client · carte ou espèces', '<span class="badge b-neu">en pause</span>', 'Cachée : vous avez arrêté ce métier (date de fin passée).', bModif + '<button class="btn ver" data-bulle="Reprenez d\'abord le métier Chauffagiste (page « Mon activité »), puis republiez.">🔒 Republier</button>') +
  '</div>' +
  '<details class="carte"><summary style="cursor:pointer;font-weight:700">Annonces retirées (1)</summary><div style="margin-top:12px">' + ligne('Débouchage évier', '45 € · 1 h', 'Plombier', '<span class="badge b-neu">retirée</span>', '', '<button class="btn sec" data-toast="Annonce republiée.">Republier</button>') + '</div></details>';

const formulaire = (titre, bouton, extra) => '<p class="ariane">Mon activité › Mes annonces › ' + titre + '</p><h1>' + titre + '</h1>' +
  '<div class="carte"><h2>Le service</h2>' +
    '<div class="champ"><label>Métier <i>*</i></label><select><option>Plombier</option><option>Électricien</option></select><span class="note">Seulement les métiers de votre profil.</span></div>' +
    '<div class="champ"><label>Titre <i>*</i></label><input value="Dépannage fuite" placeholder="ex. Ménage 2 h"></div>' +
    '<div class="champ"><label>Description</label><textarea>Intervention rapide sur Pessac et alentours. Pièces en plus si besoin, avec votre accord.</textarea><span class="note" style="text-align:right">92 / 1000</span></div></div>' +
  '<div class="carte"><h2>Le prix</h2><span class="leg">Forme du prix <i>*</i></span>' +
    '<div class="choix" data-groupe="prix"><button aria-pressed="true" data-p="fixe">Prix fixe<small>ex. 50 € pour 2 h</small></button><button aria-pressed="false" data-p="heure">À l\'heure<small>le client choisit ses heures</small></button><button aria-pressed="false" data-p="devis">Sur devis<small>le client vous écrit</small></button></div>' +
    '<div id="zone-prix"></div></div>' +
  '<div class="carte"><h2>Où et comment payer</h2><span class="leg">Lieu <i>*</i></span>' +
    '<div class="choix"><button aria-pressed="true">Chez le client</button><button aria-pressed="false">Chez moi<small>3 rue du Moulin, Pessac</small></button><button aria-pressed="false">Les deux</button></div>' +
    '<span class="leg">Paiement <i>*</i> (au moins un)</span>' +
    '<label class="coche"><input type="checkbox" checked> Carte bancaire, sur rafals</label>' +
    '<label class="coche"><input type="checkbox" checked> Espèces, le jour du service</label>' +
    '<p class="note">Sans SIRET vérifié, la case « Carte » est verrouillée 🔒 avec la raison : « Le paiement par carte demande un SIRET vérifié (page « Mon activité »). »</p></div>' +
  extra +
  '<div class="alerte a-err" id="err" hidden>Indiquez la durée du service (ex. 2 h) : elle bloque votre agenda.</div>' +
  '<div class="actions"><button class="btn prim" data-e="modifier" data-toast="Annonce publiée : les clients peuvent la voir.">' + bouton + '</button><button class="btn sec" data-e="liste">Annuler</button><button class="btn sec" onclick="document.getElementById(\'err\').hidden=false" style="margin-left:auto">Voir un refus</button></div>';
const zones = {
  fixe: '<div class="deux"><div class="champ"><label>Prix (€) <i>*</i></label><input value="50" inputmode="decimal"></div><div class="champ"><label>Durée <i>*</i></label><select><option>30 min</option><option>45 min</option><option>1 h</option><option>1 h 30</option><option selected>2 h</option><option>3 h</option></select></div></div><p class="note">La durée bloque votre agenda : jamais deux clients en même temps.</p>',
  heure: '<div class="champ"><label>Prix de l\'heure (€) <i>*</i></label><input value="40"></div><div class="deux"><div class="champ"><label>Au moins (heures) <i>*</i></label><input value="1"></div><div class="champ"><label>Au plus (heures) <i>*</i></label><input value="3"></div></div><p class="note">Le client choisit entre 1 h et 3 h et voit le total avant de réserver (ex. 2 h → 80 €).</p>',
  devis: '<p class="note">Pas de prix ni de durée : le client vous décrit son besoin (avec photos), vous répondez par un devis (bientôt disponible).</p>',
};
E.ecrire = formulaire('Écrire une annonce', 'Publier l\'annonce', '<div class="carte"><h2>Photos</h2><p class="note">Vous pourrez ajouter jusqu\'à 5 photos juste après avoir publié.</p></div>');
E.modifier = formulaire('Modifier « Dépannage fuite »', 'Enregistrer',
  '<div class="carte"><div class="tete"><h2>Photos</h2><span class="note">3 / 5</span></div><div class="photos"><div class="photo">1<button title="Retirer" data-toast="Photo retirée : les suivantes remontent d\'un rang.">×</button></div><div class="photo">2<button>×</button></div><div class="photo">3<button>×</button></div><button class="ajout" data-toast="Photo ajoutée.">+ Ajouter<br>une photo</button></div><p class="note">JPG ou PNG, 5 Mo au plus. La n° 1 est montrée en premier.</p></div>');

E.apercu = '<p class="ariane">Aperçu : ce que voient les clients</p>' +
  '<div class="galerie">photo 1 / 3</div>' +
  '<div class="carte"><div class="tete"><h1 style="font-size:24px">Dépannage fuite</h1><span class="prix" style="font-size:22px">50 €</span></div>' +
    '<p class="note">par <b style="color:var(--texte)">Karim Benali</b> · Plombier</p>' +
    '<dl class="infos"><dt>Durée</dt><dd>2 h</dd><dt>Où</dt><dd>Chez vous (Karim vient de Pessac)</dd><dt>Paiement</dt><dd>Carte bancaire ou espèces</dd></dl>' +
    '<p style="margin:0">Intervention rapide sur Pessac et alentours. Pièces en plus si besoin, avec votre accord.</p>' +
    '<div><button class="btn ver" data-bulle="La réservation arrive bientôt (niveau 4).">🔒 Réserver</button></div></div>' +
  '<p class="note">Autres affichages : « 40 € de l\'heure · de 1 h à 3 h » ; « Sur devis » + 🔒 [Demander un devis] ; lieu « Au salon, à Mérignac » (jamais la rue avant réservation).</p>';

const F = {
  retirer: '<h3>Retirer « Dépannage fuite » ?</h3><p class="note" style="font-size:14.5px">Elle ne sera plus proposée aux clients et passera dans « Annonces retirées ». Vous pourrez la republier plus tard. Les rendez-vous déjà pris restent.</p><div class="pied"><button class="btn dan" data-close data-toast="Annonce retirée.">Retirer</button><button class="btn sec" data-close>Annuler</button></div>',
  fin: '<h3>Date de fin pour « Plombier »</h3><div class="champ"><label>Dernier jour <i>*</i></label><input type="date" value="2026-11-15"></div>' +
    '<div class="champ"><label>Ensuite, votre métier principal sera <i>*</i></label><select><option>Électricien</option><option>Chauffagiste</option></select><span class="note">Choisi d\'avance : le 1er ajouté. Avec un seul métier secondaire, pas de choix.</span></div>' +
    '<p class="note">Après cette date, vos annonces « Plombier » seront mises en pause (gardées). Seul métier ? Votre profil reste affiché, sans annonce.</p>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Date de fin enregistrée : 15/11/2026.">Enregistrer</button><button class="btn dan" data-close data-toast="Plus de date de fin pour Plombier.">Enlever la date</button><button class="btn sec" data-close>Annuler</button></div>',
  finsec: '<h3>Date de fin pour « Électricien »</h3><div class="champ"><label>Dernier jour <i>*</i></label><input type="date" value="2026-12-31"></div><p class="note">Après cette date, vos annonces « Électricien » seront mises en pause (gardées). Vous pourrez reprendre ce métier quand vous voudrez.</p><div class="pied"><button class="btn prim" data-close data-toast="Date de fin enregistrée : 31/12/2026.">Enregistrer</button><button class="btn sec" data-close>Annuler</button></div>',
};

let etat = 'activite', minuterie;
function rendre() {
  document.getElementById('ecran').innerHTML = E[etat];
  document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat));
  const z = document.getElementById('zone-prix'); if (z) z.innerHTML = zones.fixe;
  window.scrollTo(0, 0);
}
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(minuterie); minuterie = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const p = ev.target.closest('[data-p]');
  if (p) { p.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === p)); document.getElementById('zone-prix').innerHTML = zones[p.dataset.p]; return; }
  const c = ev.target.closest('.choix button');
  if (c) { c.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === c)); return; }
  const b = ev.target.closest('[data-bulle]');
  if (b) { const old = b.parentElement.querySelector('.bulle'); if (old) { old.remove(); return; } const d = document.createElement('div'); d.className = 'bulle'; d.textContent = b.dataset.bulle; b.after(d); return; }
  const e = ev.target.closest('[data-toast-err]');
  if (e) { const a = document.getElementById('errlocal'); a.textContent = e.dataset.toastErr; a.hidden = false; return; }
  const el = ev.target.closest('[data-e],[data-fen],[data-close],[data-toast]'); if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
