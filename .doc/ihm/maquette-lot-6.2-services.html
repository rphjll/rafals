<title>Maquette rafals services</title>
<style>
:root{--fond:#F3F6F2;--surface:#FFFFFF;--texte:#1D2620;--doux:#58665C;--bord:#D8E1DA;--prim:#2F6B4F;--prim-t:#FFFFFF;--prim-doux:#E2EEE7;--accent:#D9793A;--ok:#2E7D4F;--ok-doux:#E3F2E8;--att:#B26A00;--att-doux:#FCF0DC;--err:#B3261E;--err-doux:#FBE4E2;--neu:#5B6573;--neu-doux:#E8ECF1;--sur:#FFFFFF;--voile:rgb(10 14 20 / .55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}}
:root[data-theme="dark"]{color-scheme:dark;--fond:#121713;--surface:#1A211C;--texte:#E7ECF2;--doux:#A3AEBD;--bord:#2C3730;--prim:#79C49C;--prim-t:#0F1A13;--prim-doux:#1C3024;--accent:#F0955A;--ok:#6CC592;--ok-doux:#17301F;--att:#F0B35A;--att-doux:#33260F;--err:#F08A82;--err-doux:#3A1A18;--neu:#A3AEBD;--neu-doux:#262E39;--sur:#0F1A13}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;margin:0}
.bandeau{background:var(--surface);border-bottom:1px dashed var(--bord);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)}
.bandeau b{color:var(--texte)}
.onglet{font:inherit;border:1px solid var(--bord);background:transparent;color:var(--texte);border-radius:8px;padding:5px 9px;cursor:pointer}
.onglet[aria-pressed="true"]{border-color:var(--prim);color:var(--prim);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--bord);padding-inline:16px}
.entete{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center}
.logo{font-weight:700;font-size:24px;color:var(--prim)} .logo span{color:var(--accent)}
main{padding-inline:16px;padding-block:28px 60px}
.contenu{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.3px} h2{font-size:20px;margin:0} h3{margin:0;font-size:17px}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;min-height:42px;padding:9px 16px;cursor:pointer}
.petit{min-height:36px;padding:6px 12px;font-size:14px}
.prim{background:var(--prim);color:var(--prim-t);border-color:var(--prim)} .sec{background:var(--surface);color:var(--prim);border-color:var(--prim)} .dan{background:var(--surface);color:var(--err);border-color:var(--err)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap} .b-neu{background:var(--neu-doux);color:var(--neu)} .b-att{background:var(--att-doux);color:var(--att)}
.note{font-size:13.5px;color:var(--doux);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alerte{border-radius:8px;padding:10px 12px;font-weight:500;font-size:14px} .a-att{background:var(--att-doux);color:var(--att)} .a-err{background:var(--err-doux);color:var(--err)}
.etoiles{color:var(--accent);font-size:18px;letter-spacing:1px}
.choix-etoiles{display:flex;gap:4px} .choix-etoiles button{font-size:30px;border:0;background:none;cursor:pointer;color:var(--bord);padding:0 2px;min-height:42px} .choix-etoiles button.on{color:var(--accent)}
.avis{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--bord);padding-top:12px}
.avis:first-of-type{border-top:0;padding-top:0}
.reponse{margin-left:18px;border-left:3px solid var(--prim-doux);padding:4px 10px;font-size:14px}
.rdv{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bord);padding-top:14px}
.rdv:first-of-type{border-top:0;padding-top:0}
.monavis{background:var(--fond);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap} .grosse{font-size:34px;font-weight:700}
.sous-onglets{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bord)}
.sous-onglets button{font:inherit;border:0;background:transparent;color:var(--doux);padding:10px 12px;border-bottom:3px solid transparent;font-weight:600;min-height:42px}
.sous-onglets button[aria-pressed="true"]{color:var(--prim);border-bottom-color:var(--prim)}
.compteur{margin-left:4px;background:var(--accent);color:var(--sur);border-radius:999px;padding:1px 7px;font-size:12px}
.mots{display:flex;flex-wrap:wrap;gap:6px} .mot{display:inline-flex;align-items:center;gap:6px;background:var(--neu-doux);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px} .mot button{border:0;background:var(--surface);color:var(--err);border-radius:999px;width:24px;height:24px;cursor:pointer;font-weight:700}
input,textarea{min-height:42px;border:1px solid var(--bord);border-radius:10px;background:var(--fond);color:var(--texte);font:inherit;padding:10px 12px;width:100%}
textarea{min-height:100px}
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:16px}
.fenetre{background:var(--surface);border:1px solid var(--bord);border-radius:10px;padding:22px;width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
.fenetre h3{font-size:20px} .pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ok);color:var(--sur);padding:12px 18px;border-radius:10px;font-weight:600}
.b-ok{background:var(--ok-doux);color:var(--ok)} .b-err{background:var(--err-doux);color:var(--err)}
.a-ok{background:var(--ok-doux);color:var(--ok)} .a-neu{background:var(--neu-doux);color:var(--neu)}
.ver{background:var(--neu-doux);color:var(--neu);border-color:var(--neu-doux)}
.lignes{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px} .lignes span:nth-child(odd){color:var(--doux)}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:8px} .choix button{font:inherit;border:1px solid var(--bord);background:var(--surface);color:var(--texte);border-radius:10px;min-height:52px;padding:8px;cursor:pointer;text-align:left}
.choix button[aria-pressed="true"]{border-color:var(--prim);background:var(--prim-doux);font-weight:600}
.case{display:flex;gap:10px;align-items:flex-start;font-size:14px} .case input{width:20px;min-height:20px;height:20px;margin-top:2px}
.etats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--doux);align-items:center}
.tableau{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bord)} th{color:var(--doux);font-weight:600;font-size:13px} th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px} .chiffre{background:var(--fond);border-radius:10px;padding:10px 12px} .chiffre b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.etq{font-weight:600;font-size:13px}
.ligne-form{display:grid;grid-template-columns:1fr 70px 100px auto;gap:6px;align-items:center}
.ligne-form .court{text-align:right}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px} .deux label{display:flex;flex-direction:column;gap:4px}
.choix.trois{grid-template-columns:1fr 1fr 1fr}
.photos{display:flex;gap:6px} .photos span{background:var(--neu-doux);border-radius:8px;padding:14px 18px}
.fenetre{width:min(560px,100%);max-height:90vh;overflow-y:auto}
@media (max-width:480px){.ligne-form{grid-template-columns:1fr 60px 80px auto}.deux{grid-template-columns:1fr}}
</style>
<div class="bandeau"><b>Maquette lot 6.2</b> (construite pendant ton absence, à valider) · écrans :
  <button class="onglet" data-e="tableau" aria-pressed="true">1. Administration › Tableau de bord</button>
  <button class="onglet" data-e="paiements">2. Administration › Paiements</button>
  <button class="onglet" data-e="demarches">3. Mes démarches</button>
  <button class="onglet" data-e="guide">4. Créer mon auto-entreprise</button>
</div>
<header><div class="entete"><span class="logo">rafals<span>.</span></span></div></header>
<main><div class="contenu" id="ecran"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
const E = {};
const chiffre = (titre, valeur, note) => '<div class="chiffre"><span class="note">' + titre + '</span><b>' + valeur + '</b><span class="note">' + (note || '&nbsp;') + '</span></div>';
E.tableau = () => '<h1>Administration</h1><div class="sous-onglets"><button aria-pressed="true">Tableau de bord</button><button>Accords<span class="compteur">2</span></button><button>Comptes</button><button>Prestataires</button><button>Absences<span class="compteur">1</span></button><button>…</button><button>Paiements</button></div>' +
  '<div class="carte"><h2>À traiter</h2><div class="actions"><button class="btn sec">2 accords à vérifier</button><button class="btn sec">1 absence contestée</button></div><p class="note">Un bouton par onglet où quelque chose attend (clic = ouvre l\'onglet). Rien : « Rien à traiter pour l\'instant. »</p></div>' +
  '<div class="carte"><h2>Octobre 2026</h2><div class="chiffres">' + chiffre('Nouveaux comptes', '12') + chiffre('Rendez-vous pris', '37') + chiffre('Paiements par carte', '14', '812,00 €') + chiffre('Commission de rafals', '40,60 €', '5 % des paiements') + chiffre('Remboursements', '2') + '</div>' +
  '<h3>En ce moment</h3><div class="chiffres">' + chiffre('Prestataires actifs', '8') + chiffre('Annonces en ligne', '21') + '</div><p class="note">Depuis le 1er du mois. Les paiements comptés sont ceux gardés (ni abandonnés, ni remboursés).</p></div>';
const lp = (d, quoi, presta, client, m, c, etat, cl) => '<tr><td>' + d + '</td><td>' + quoi + '<br><span class="note">' + presta + ' · ' + client + '</span></td><td class="n">' + m + '</td><td class="n">' + c + '</td><td><span class="badge ' + cl + '">' + etat + '</span></td></tr>';
E.paiements = () => '<h1>Administration</h1><div class="sous-onglets"><button>Tableau de bord</button><button>…</button><button aria-pressed="true">Paiements</button></div>' +
  '<div class="carte"><div class="tableau"><table><thead><tr><th>Payé le</th><th>Quoi</th><th class="n">Montant</th><th class="n">Commission</th><th>État</th></tr></thead><tbody>' +
  lp('03/10/2026', 'Muret de jardin — devis D-2026-0002 (arrhes)', 'Paul Petit', 'Marie Dupont', '357,00 €', '17,85 €', 'versé', 'b-ok') +
  lp('02/10/2026', 'Coupe femme — mardi 13/10/2026 à 10 h 00', 'Léa Martin', 'Paul Petit', '50,00 €', '2,50 €', 'payé (bloqué)', 'b-att') +
  lp('01/10/2026', 'Dépannage fuite — jeudi 15/10/2026 à 9 h 00', 'Karim Benali', 'Paul Petit', '120,00 €', '—', 'remboursé 120,00 €', 'b-err') +
  lp('—', 'Ménage 2 h — vendredi 16/10/2026 à 14 h 00', 'Julie Leroy', 'Marie Dupont', '50,00 €', '2,50 €', 'page de paiement ouverte', 'b-neu') +
  '</tbody></table></div><div class="actions"><button class="btn sec petit">← Plus récents</button><span class="note">Page 1 sur 3 · 74 paiements</span><button class="btn sec petit">Plus anciens →</button></div>' +
  '<p class="note">Lecture seule : les remboursements et les versements sont automatiques. Vide : « Aucun paiement par carte pour l\'instant. »</p></div>';
const lm = (p, m, n, avant, etat) => '<tr><td>' + p + '</td><td class="n"><b>' + m + '</b></td><td class="n">' + n + '</td><td>' + avant + '</td><td>' + etat + '</td></tr>';
E.demarches = () => '<h1>Mes démarches</h1><p class="note">Dans le menu, pour un prestataire : « Mes démarches ».</p>' +
  '<div class="carte"><h2>Déclaration à l\'URSSAF</h2><p class="note">Un auto-entrepreneur déclare à l\'URSSAF ce qu\'il a encaissé, chaque mois ou chaque trimestre, même 0 €. rafals prépare le chiffre d\'après vos factures ; la déclaration se fait sur le site de l\'URSSAF.</p>' +
  '<div class="alerte a-att">À déclarer pour septembre 2026 : <b>1 250,00 €</b>, avant le 31/10/2026.</div>' +
  '<div class="actions"><button class="btn prim" data-toast="(ouvre autoentrepreneur.urssaf.fr dans un nouvel onglet)">Aller sur le site de l\'URSSAF</button></div>' +
  '<div class="actions"><span class="etq">Voir :</span><div class="choix" style="grid-template-columns:auto auto"><button aria-pressed="true">Par mois</button><button>Par trimestre</button></div><div class="choix" style="grid-template-columns:auto auto"><button>2025</button><button aria-pressed="true">2026</button></div></div>' +
  '<div class="tableau"><table><thead><tr><th>Période</th><th class="n">Encaissé</th><th class="n">Factures</th><th>À déclarer avant le</th><th></th></tr></thead><tbody>' +
  lm('Octobre 2026', '310,00 €', '4', '30/11/2026', '<span class="badge b-neu">mois en cours</span>') +
  lm('Septembre 2026', '1 250,00 €', '9', '31/10/2026', '<span class="badge b-att">à déclarer</span>') +
  lm('Août 2026', '0,00 €', '0', '30/09/2026', '<span class="note">date passée</span>') +
  '</tbody></table></div>' +
  '<p class="note">Seulement ce qui est passé par rafals : ajoutez ce que vous avez encaissé ailleurs. La commission de rafals et les frais de paiement ne se déduisent pas. Avec la case « Je facture la TVA » : montants hors taxe.</p></div>' +
  '<p class="note">Sans SIRET vérifié : « Les démarches concernent les prestataires avec un SIRET. [Créer mon auto-entreprise] ».</p>';
const etape = (n, titre, texte, fait, bouton) => '<div class="carte"><div class="tete"><h3>' + n + '. ' + titre + '</h3><label class="case"><input type="checkbox"' + (fait ? ' checked' : '') + '> <span>C\'est fait</span></label></div><p style="margin:0">' + texte + '</p>' + (bouton ? '<div><button class="btn sec" data-toast="(ouvre le site officiel dans un nouvel onglet)">' + bouton + '</button></div>' : '') + '</div>';
E.guide = () => '<h1>Créer mon auto-entreprise</h1><p class="note">Ouvert à tous, même sans compte. rafals vous guide ; la déclaration se fait sur le site officiel de l\'État, gratuitement.</p>' +
  '<div class="alerte a-ok">2 étapes sur 5 faites.</div>' +
  etape(1, 'Est-ce pour moi ?', 'Il faut avoir 18 ans (à 16 ou 17 ans : seulement avec l\'accord des parents, sous conditions). Certains métiers demandent un diplôme ou 3 ans d\'expérience (coiffeur, plombier, électricien, maçon…) et une assurance.', true) +
  etape(2, 'Je prépare mes papiers', 'Une pièce d\'identité, un justificatif de domicile, et selon le métier : votre diplôme ou la preuve de votre expérience.', true) +
  etape(3, 'Je déclare mon activité', 'Sur le guichet unique de l\'État : choisissez « micro-entrepreneur ». C\'est gratuit, comptez 30 minutes.', false, 'Ouvrir le guichet unique') +
  etape(4, 'J\'attends mon SIRET', 'L\'INSEE vous l\'envoie en 1 à 4 semaines. En attendant, vous pouvez déjà proposer vos services sur rafals, payés en espèces.', false) +
  etape(5, 'Je termine sur rafals', 'Ajoutez votre SIRET dans « Mon activité » (il est vérifié tout seul), créez votre espace sur le site de l\'URSSAF, puis activez le paiement par carte.', false, 'Proposer mes services') +
  '<p class="note">L\'avancement est gardé sur cet appareil seulement. Besoin d\'un conseil sur le statut ? Voyez la CCI ou la chambre des métiers (gratuit). Ces explications sont une aide, pas un conseil juridique.</p>';
let etat = 'tableau', m;
function rendre() { document.getElementById('ecran').innerHTML = E[etat](); document.querySelectorAll('.bandeau .onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat)); }
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(m); m = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const c = ev.target.closest('.choix button'); if (c) { c.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === c)); return; }
  const el = ev.target.closest('[data-e],[data-toast]'); if (!el) return;
  if (el.dataset.e) { etat = el.dataset.e; rendre(); }
  if (el.dataset.toast) toast(el.dataset.toast);
});
rendre();
</script>
