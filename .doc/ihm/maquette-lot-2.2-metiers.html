      DONNEES.map(d => '<button class="dossier" data-d="' + d.code + '"><b>' + d.nom + '</b><small>' + d.metiers.slice(0, 3).map(m => m.nom).join(', ') + '…</small></button>').join('') + '</div>';
  }
  h += '<p class="note">Mon métier n\'est pas dans la liste ? <button class="btn sec" data-fen="proposer">Proposer un métier</button></p></div>';
  return h;
}
function lignePropo(nom, qui, quand) {
  return '<div class="ligne"><div><b>« ' + nom + ' »</b> · proposé par ' + qui + ' · le ' + quand + '</div>' +
    '<div class="actions"><button class="btn prim" data-fen="accepter">Accepter…</button><button class="btn sec" data-fen="remplacer">Remplacer…</button>' +
    '<button class="btn dan" data-toast="Proposition refusée.">Refuser</button></div></div>';
}
function vueProps() {
  return '<h1>Administration</h1>' + ongletsAdmin('props') +
    lignePropo('Cerf-voliste', 'Nadia Leroy', '28/09/2026 à 19 h 12') +
    lignePropo('Plombier chauffagiste', 'Tom Durand', '28/09/2026 à 19 h 40') +
    '<p class="note">Liste vide : « Aucune proposition de métier pour l\'instant. »</p>';
}
function vueMetiers() {
  const lignes = TOUS.slice(0, 8).map(m => '<tr><td>' + m.nom + '</td><td>' + m.dossier + '</td><td class="note">' + m.mots + '</td><td><span class="badge b-ok">actif</span></td><td><button class="btn sec" data-fen="modifier">Modifier</button></td></tr>').join('');
  return '<h1>Administration</h1>' + ongletsAdmin('metiers') +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><div class="champ" style="flex:1;min-width:220px"><label>Filtrer</label><input placeholder="ex. plom"></div><button class="btn prim" data-fen="nouveau">+ Nouveau métier</button></div>' +
    '<div class="cadre"><table><thead><tr><th>Métier</th><th>Dossier</th><th>Mots-clés</th><th>État</th><th></th></tr></thead><tbody>' + lignes +
    '<tr><td>Sculpteur sur ballons</td><td>Événements</td><td class="note">ballons</td><td><span class="badge b-neu">désactivé</span></td><td><button class="btn sec" data-fen="modifier">Modifier</button></td></tr>' +
    '</tbody></table></div><p class="note">128 métiers, triés par nom. Un métier ne se supprime jamais : on le désactive.</p>';
}
const options = sel => DONNEES.map(d => '<option' + (d.code === sel ? ' selected' : '') + '>' + d.nom + '</option>').join('');
const F = {
  proposer: '<h3>Proposer un métier</h3><p class="note">L\'administrateur le vérifiera. En attendant, choisissez « Autre ».</p>' +
    '<div class="champ"><label>Nom du métier *</label><input value="Cerf-voliste"></div>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Merci : votre proposition sera étudiée. En attendant, choisissez « Autre ».">Envoyer</button><button class="btn sec" data-close>Annuler</button></div>',
  accepter: '<h3>Accepter « Cerf-voliste » ?</h3><p class="note">Le métier sera créé et proposé à tous.</p>' +
    '<div class="champ"><label>Dossier où le ranger *</label><select>' + options('sport-loisirs') + '</select></div>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="« Cerf-voliste » ajouté dans Sport &amp; loisirs.">Accepter</button><button class="btn sec" data-close>Annuler</button></div>',
  remplacer: '<h3>Remplacer « Plombier chauffagiste »</h3><p class="note">par un métier qui existe déjà. Le nom proposé deviendra un de ses mots-clés.</p>' +
    '<div class="champ"><label>Métier existant *</label><input value="plomb"><div class="liste"><button class="actif">Plombier <small>Maison &amp; travaux</small></button><button>Diagnostiqueur immobilier <small>Maison &amp; travaux</small></button></div></div>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Remplacé par « Plombier ».">Remplacer</button><button class="btn sec" data-close>Annuler</button></div>',
  nouveau: '<h3>Nouveau métier</h3><div class="champ"><label>Nom *</label><input placeholder="ex. Cordiste"></div>' +
    '<div class="champ"><label>Dossier *</label><select>' + options('') + '</select></div>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Métier créé.">Créer</button><button class="btn sec" data-close>Annuler</button></div>',
  modifier: '<h3>Modifier « Plombier »</h3><div class="champ"><label>Nom *</label><input value="Plombier"></div>' +
    '<div class="champ"><label>Dossier *</label><select>' + options('maison-travaux') + '</select></div>' +
    '<div class="champ"><label>Mots-clés (séparés par des virgules)</label><input value="plomberie, fuite, chauffagiste, sanitaire"></div>' +
    '<label class="coche"><input type="checkbox" checked> Actif (proposé pour les nouvelles annonces)</label>' +
    '<div class="pied"><button class="btn prim" data-close data-toast="Métier enregistré.">Enregistrer</button><button class="btn sec" data-close>Annuler</button></div>',
};
function rendre() {
  document.getElementById('ecran').innerHTML = etat.e === 'choix' ? vueChoix() : etat.e === 'props' ? vueProps() : vueMetiers();
  document.querySelectorAll('.onglet').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === etat.e));
  const q = document.getElementById('q');
  if (q) { q.addEventListener('input', () => { res = chercher(q.value); etat.actif = 0; peindre(); }); q.addEventListener('keydown', clavier); }
}
function peindre() {
  const s = document.getElementById('sugg'); const v = document.getElementById('q').value.trim();
  s.innerHTML = res.length
    ? '<div class="liste">' + res.map((m, i) => '<button class="' + (i === etat.actif ? 'actif' : '') + '" data-r="' + i + '">' + m.nom + ' <small>' + m.dossier + '</small></button>').join('') + '</div>'
    : v ? '<p class="note">Aucun métier ne correspond. <button class="btn sec" data-fen="proposer">Proposer un métier</button></p>' : '';
}
function clavier(e) {
  if (!res.length) return;
  if (e.key === 'ArrowDown') { etat.actif = Math.min(res.length - 1, etat.actif + 1); peindre(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { etat.actif = Math.max(0, etat.actif - 1); peindre(); e.preventDefault(); }
  if (e.key === 'Enter') { etat.choisi = res[etat.actif]; rendre(); }
}
let minuteur;
function toast(t) { const x = document.getElementById('toast'); x.textContent = t; x.hidden = false; clearTimeout(minuteur); minuteur = setTimeout(() => x.hidden = true, 3000); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-e],[data-r],[data-d],[data-m],[data-act],[data-fen],[data-close],[data-toast]');
  if (!el) return;
  if (el.dataset.fen) { document.getElementById('couche').innerHTML = '<div class="voile"><div class="fenetre">' + F[el.dataset.fen] + '</div></div>'; return; }
  if (el.hasAttribute('data-close')) document.getElementById('couche').innerHTML = '';
  if (el.dataset.toast) toast(el.dataset.toast);
  if (el.dataset.e) { etat.e = el.dataset.e; rendre(); }
  if (el.dataset.r) { etat.choisi = res[+el.dataset.r]; rendre(); }
  if (el.dataset.d) { etat.dossier = DONNEES.find(d => d.code === el.dataset.d); rendre(); }
  if (el.dataset.m) { const [c, i] = el.dataset.m.split('|'); const d = DONNEES.find(x => x.code === c); etat.choisi = { ...d.metiers[+i], dossier: d.nom }; etat.dossier = null; rendre(); }
  if (el.dataset.act === 'changer') { etat.choisi = null; rendre(); }
  if (el.dataset.act === 'retour') { etat.dossier = null; rendre(); }
});
rendre();
</script>
